    <button class="back" id="back" aria-label="Voltar">←</button>
    <div class="chap" id="chap"></div>
    <div class="taxi hide" id="taxi"><span>Custo do comercial</span><b class="num" id="taxiV">R$ 0</b></div>
  </div>
  <nav class="menu" id="menu" aria-label="Seções"></nav>
</header>

<main><div class="screen" id="screen"></div></main>

<div class="cta"><div class="in">
  <button class="btn2" id="prev" aria-label="Voltar">←<span> Voltar</span></button>
  <button class="btn" id="next">Começar</button>
  <span class="kbd" id="kbd">aperte <b>Enter ↵</b></span>
</div></div>

<script>
/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const R = n => (n<0?'-':'') + 'R$ ' + Math.abs(Math.round(n)).toLocaleString('pt-BR');
const P = n => (isFinite(n)?n:0).toLocaleString('pt-BR',{maximumFractionDigits:1}) + '%';
const N = n => Math.round(n).toLocaleString('pt-BR');
// Aceita "3000", "3.000", "R$ 3.000,00", "12,5%"
function parse(s){
  s = String(s).replace(/[R$\s%]/gi,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s); return isNaN(n) ? null : n;
}
function countUp(el, to, fmt=R, dur=1300){
  const t0 = performance.now();
  const f = t => { const p = Math.min((t-t0)/dur,1); el.textContent = fmt(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}

/* ---------- Dados ---------- */
const d = {estrutura:3000, ferramentas:800, equip:600, salarios:7500, encargos:4500, outros:1600, vendedores:3,
           mkt:6000, leads:300, vendas:30, ticket:2000, cmv:45, imp:8, pA:5, pB:10, metaConv:12, bonus:40, convNova:12,
           ote:4000, lucroVend:3000, acel:2, teto:150};
const MIX_FIXO = 0.6; // 60% fixo / 40% variável

/* Parte 2: OTE, meta reversa, gatilho e curva (por vendedor) */
function calc2(){
  const c = calc();
  const nv = d.vendedores || 1;
  const fixo = d.ote*MIX_FIXO, varAlvo = d.ote*(1-MIX_FIXO);
  const mktVend = d.mkt/nv;
  const mv = c.mv;
  const meta = mv>0 ? Math.max(1, Math.ceil((c.cadeira + mktVend + varAlvo + d.lucroVend)/mv)) : 0;
  const gat = mv>0 ? Math.min(meta, Math.ceil((c.cadeira + mktVend)/mv)) : 0;
  const varDe = v => {
    if(!meta || v < gat) return 0;
    let at = v/meta;
    if(d.teto > 0) at = Math.min(at, d.teto/100);
    return at <= 1 ? varAlvo*at : varAlvo + varAlvo*(at-1)*d.acel;
  };
  const ganho = v => fixo + varDe(v);
  const empresa = v => v*mv - c.cadeira - mktVend - varDe(v);
  return {c, nv, fixo, varAlvo, mktVend, mv, meta, gat, varDe, ganho, empresa};
}

function calc(vendas = d.vendas){
  const fixo = d.estrutura+d.ferramentas+d.equip+d.salarios+d.encargos+d.outros;
  const cadeira = d.vendedores ? fixo/d.vendedores : 0;
  const cpl = d.leads ? d.mkt/d.leads : 0;
  const conv = d.leads ? vendas/d.leads*100 : 0;
  const cac = vendas ? (fixo+d.mkt)/vendas : 0;
  const perdidos = Math.max(d.leads-vendas,0);
  const desp = perdidos*cpl;
  const fat = d.ticket*vendas;
  const mv = d.ticket*(1-d.cmv/100-d.imp/100);
  const mt = mv*vendas;
  const antes = mt - fixo - d.mkt;
  const bateu = conv >= d.metaConv;
  const com = { A: fat*d.pA/100, B: Math.max(mt,0)*d.pB/100,
                C: Math.max(mt-desp,0)*d.pB/100 + (bateu ? d.bonus*vendas : 0) };
  return {fixo,cadeira,cpl,conv,cac,perdidos,desp,fat,mv,mt,antes,bateu,com,vendas};
}

let i = 0, answered = false, revealed = false;

const screen = $('screen'), btn = $('next');

function taxi(){
  // Soma o custo do comercial preenchido até agora (até a tela atual)
  const keys=['estrutura','ferramentas','equip','salarios','encargos','outros','mkt'];
  const seen = new Set(S.slice(0,i+1).filter(s=>s.k).map(s=>s.k));
  if(answered && S[i].k) seen.add(S[i].k); else if(S[i].k) seen.delete(S[i].k);
  const tot = keys.filter(k=>seen.has(k)).reduce((a,k)=>a+d[k],0);
  $('taxi').classList.toggle('hide', i===0 || tot===0 || !!S[i].p2);
  countUp($('taxiV'), tot, n=>R(n)+'/mês', 700);
}

function go(n){
  screen.classList.add('out');
  setTimeout(()=>{ i = Math.max(0,Math.min(S.length-1,n)); answered=false; revealed=false; render(); screen.classList.remove('out'); window.scrollTo(0,0); },220);
}

function render(){
  const s = S[i];
  $('bar').style.width = (i/(S.length-1)*100)+'%';
  $('chap').textContent = s.ch || '';
  $('back').disabled = i===0;
  $('prev').classList.toggle('hide', i===0);
  $('kbd').style.display = '';
  screen.style.animation='none'; void screen.offsetWidth; screen.style.animation='';
  const f = {intro, q, r1, r2, r3, r4, cmp, fin, p2, meta, gat, curva, bintro, bonus, legal}[s.t];
  f(s);
  taxi();
  drawMenu();
}

  const on=(id,fn,t)=>setTimeout(()=>{$(id).classList.add('on'); fn(); $(id).scrollIntoView({behavior:'smooth',block:'center'});},t);

function chartSVG(o, pers){
  const W=Math.round(Math.min(680,Math.max(340,screen.clientWidth||680))),H=W<500?300:330,L=46,Rr=10,T=18,B=26;
  const xMax=Math.max(Math.ceil(o.meta*1.8), (pers[2]?.v||0)+2);
  const xs=[...Array(xMax+1).keys()];
  const g=xs.map(o.ganho), e=xs.map(o.empresa);
  const yMin=Math.min(0,...e), yMax=Math.max(...g,...e)*1.08;
  const X=v=>L+(W-L-Rr)*v/xMax, Y=v=>T+(H-T-B)*(1-(v-yMin)/(yMax-yMin));
  const path=arr=>arr.map((y,k)=>`${k?'L':'M'}${X(k).toFixed(1)},${Y(y).toFixed(1)}`).join('');
  const ticks=[...Array(5)].map((_,k)=>yMin+(yMax-yMin)*k/4);
  const kfmt=v=>(Math.abs(v)>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':Math.round(v));
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Curva de ganho do vendedor e resultado da empresa por número de vendas">
    <rect x="${X(0)}" y="${T}" width="${X(o.gat)-X(0)}" height="${H-T-B}" fill="rgba(255,90,78,.08)"/>
    
    ${ticks.map(t=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end" class="ax">${kfmt(t)}</text>`).join('')}
    <line x1="${L}" x2="${W-Rr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mut)" stroke-width="1"/>
    ${[[o.gat,'gatilho','var(--red)'],[o.meta,'meta','var(--amber)']].map(([v,l,c])=>`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="${c}" stroke-dasharray="4 4"/><text x="${X(v)+5}" y="${l==='meta'?T+14:T+30}" class="zl" fill="${c}">${l} · ${v}</text>`).join('')}
    ${xs.filter(v=>v%Math.max(1,Math.round(xMax/8))===0).map(v=>`<text x="${X(v)}" y="${H-B+15}" text-anchor="middle" class="ax">${v}</text>`).join('')}
    <path d="${path(e)}" fill="none" stroke="var(--green)" stroke-width="2.5"/>
    <path d="${path(g)}" fill="none" stroke="var(--amber)" stroke-width="3"/>
    ${pers.map(p=>`<circle cx="${X(p.v)}" cy="${Y(o.ganho(p.v))}" r="6" fill="var(--amber)" stroke="var(--ink)" stroke-width="2"/><circle cx="${X(p.v)}" cy="${Y(o.empresa(p.v))}" r="6" fill="var(--green)" stroke="var(--ink)" stroke-width="2"/>`).join('')}
  </svg>
  <div class="legend"><span><i style="background:var(--amber)"></i>Quanto o vendedor ganha</span><span><i style="background:var(--green)"></i>Quanto a empresa fica</span><span class="mut">eixo: vendas no mês</span></div>`;
}

function curva(){
  const o=calc2();
  const pers=[
    {n:'Acomodado', v:Math.max(o.gat-1,0), d:'Faz o suficiente para não ser demitido.'},
    {n:'Regular', v:o.meta, d:'Bate a meta. Nem mais, nem menos.'},
    {n:'Fera', v:Math.ceil(o.meta*1.5), d:'Vende como se a empresa fosse dele.'}
  ];
  const tetoTxt = d.teto>0 ? `até ${N(d.teto)}% da meta` : 'sem teto';
  const reg=o.empresa(o.meta), fera=pers[2];
  const ganhoMais = o.ganho(o.meta)>0 ? (o.ganho(fera.v)/o.ganho(o.meta)-1)*100 : 0;
  const empMult = reg>0 ? o.empresa(fera.v)/reg : 0;
  screen.innerHTML = `<div class="step">A curva</div>
    <h2>O OTE completo do seu vendedor</h2>
    <div class="faixas">
      <div class="fx"><b class="neg">0 a ${N(Math.max(o.gat-1,0))}</b><span>vendas</span><p>Só o fixo, ${R(o.fixo)}</p></div>
      <div class="fx"><b>${N(o.gat)} a ${N(o.meta)}</b><span>vendas</span><p>Variável proporcional à meta</p></div>
      <div class="fx"><b class="amberTxt">${N(o.meta)}</b><span>a meta</span><p>OTE de ${R(d.ote)}</p></div>
      <div class="fx"><b class="pos">${N(o.meta+1)}+</b><span>vendas</span><p>Acelerador ${N(d.acel*10)/10}×, ${tetoTxt}</p></div>
    </div>
    ${chartSVG(o,pers)}
    <h2 style="margin-top:34px">Três vendedores. Quem merece ganhar mais?</h2>
    <div class="pers">
      ${pers.map(p=>{const em=o.empresa(p.v);return `<div class="pc">
        <h3>${p.n}</h3><p class="pd">${p.d}</p>
        <div class="fr"><span>Vendas</span><b class="num">${N(p.v)} · ${P(o.meta?p.v/o.meta*100:0)}</b></div>
        <div class="fr"><span>Ele ganha</span><b class="num amberTxt">${R(o.ganho(p.v))}</b></div>
        <div class="fr"><span>A empresa fica</span><b class="num ${em<0?'neg':'pos'}">${R(em)}</b></div></div>`}).join('')}
    </div>
    <div class="closing">
      <p>O Fera ganha <em>${P(ganhoMais)} a mais</em> que o Regular.${empMult>0?`<br>E deixa <em>${empMult.toLocaleString('pt-BR',{maximumFractionDigits:1})}× mais lucro</em>.`:''}</p>
      <small>OTE bem feito não é custo. É o único salário que se paga sozinho.</small>
    </div>`;
  btn.textContent='Parte 3: bonificação →';
}

  ],

try{ const sv = JSON.parse(localStorage.getItem('unique_bonus')||'null'); if(sv && sv.items) Object.assign(B, sv); }catch(e){}

const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const maxPer = it => it.pag==='ocorrencia' ? (+it.valor||0)*(+it.qtd||0) : (+it.valor||0);
const mensal = it => maxPer(it)*(FREQ[it.freq]?.m||1);
const opts = (o,sel) => Object.entries(o).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${typeof v==='string'?v:v.l}</option>`).join('');

function drawSum(){
  const act = B.items.filter(it=>it.on);
  const nv = d.vendedores||1, varAlvo = d.ote*(1-MIX_FIXO);
  const mes = act.reduce((a,it)=>a+mensal(it),0);
  const pctVar = varAlvo ? mes/varAlvo*100 : 0;
  $('bsum').innerHTML = `<div class="stats" style="margin-top:4px">
      <div class="stat"><span>Bônus máximo por vendedor</span><b class="num">${R(mes)}</b><small>por mês · ${R(mes*12)} no ano</small></div>
      <div class="stat"><span>Time inteiro no ano</span><b class="num">${R(mes*12*nv)}</b><small>${N(nv)} vendedores</small></div>
      <div class="stat"><span>Comparado ao variável do OTE</span><b class="num ${pctVar>100?'neg':''}">${P(pctVar)}</b><small>variável no alvo: ${R(varAlvo)}</small></div>
    </div>
    ${pctVar>100?`<div class="acid"><small>Atenção</small><p>O bônus máximo passou do variável de vendas. <b>Ele vai preferir cumprir checklist a vender.</b> Comportamento é meio, venda é fim.</p></div>`:''}`;
  // simulação
  const conds = B.conds.filter(c=>c.on);
  const gateOk = conds.length===0 || B.sim.gate;
  const pago = gateOk ? act.reduce((a,it)=>{ const k=B.items.indexOf(it); return a + (B.sim.done[k]===false?0:mensal(it)); },0) : 0;
  $('bsim').innerHTML = `${conds.length?`<label class="simrow gate"><input type="checkbox" id="simGate"${B.sim.gate?' checked':''}><span>Cumpriu as condições do item 1</span></label>`:''}
    ${act.map(it=>{const k=B.items.indexOf(it);return `<label class="simrow"><input type="checkbox" data-sim="${k}"${B.sim.done[k]===false?'':' checked'}><span>${esc(it.nome)}</span><b class="num">${R(mensal(it))}</b></label>`}).join('')||'<p class="hint2">Ligue pelo menos um comportamento.</p>'}
    <div class="simtot"><span>Ele recebe de bônus neste mês</span><b class="num ${gateOk?'pos':'neg'}">${R(pago)}</b></div>
    ${!gateOk?`<p class="hint2" style="color:var(--red)">Não cumpriu as condições: não recebe nenhum bônus, mesmo cumprindo o checklist.</p>`:''}`;
  // régua
  $('regua').innerHTML = `<b>RÉGUA DE BONIFICAÇÃO COMPORTAMENTAL</b><br><br>`+
    (conds.length?`Só recebe bônus quem cumprir todas as condições:<br>${conds.map(c=>'• '+esc(c.t)).join('<br>')}<br><br>`:'')+
    (act.length?`Comportamentos que valem bônus:<br>${act.map(it=>'• '+esc(regraTxt(it))).join('<br>')}<br><br>Bônus máximo por mês: ${R(mes)}.`:'Nenhum comportamento ativo.');
}

function bonusInput(e){
  const t=e.target; if(!$('items')) return;
  if(t.dataset.c!==undefined){ const c=B.conds[+t.dataset.c]; if(t.dataset.f==='on'){c.on=t.checked; t.closest('.crow').classList.toggle('off',!c.on);} else c.t=t.value; drawSum(); saveB(); return; }
  if(t.dataset.k!==undefined){
    const k=+t.dataset.k, it=B.items[k], f=t.dataset.f;
    if(f==='on'){ it.on=t.checked; t.closest('.bi').classList.toggle('off',!it.on); }
    else if(f==='qtd'||f==='valor'){ const v=parse(t.value); if(v!==null) it[f]=v; }
    else it[f]=t.value;
    const card=t.closest('.bi');
    card.querySelector('.bt b').textContent=it.nome;
    card.querySelector('.bt small').textContent=`${FREQ[it.freq].l} · ${CMP[it.cmp]} ${N(it.qtd)}${it.un==='%'?'%':' '+it.un}`;
    $('bv'+k).innerHTML=`${R(mensal(it))}<small>/mês</small>`;
    drawSum(); saveB(); return;
  }
  if(t.id==='simGate'){ B.sim.gate=t.checked; drawSum(); saveB(); return; }
  if(t.dataset.sim!==undefined){ B.sim.done[+t.dataset.sim]=t.checked; drawSum(); saveB(); }
}
document.addEventListener('input',bonusInput);
document.addEventListener('change',bonusInput);
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'); if(o){ const k=+o.dataset.open; openCard = openCard===k?-1:k; drawItems(); return; }
  const rc=e.target.closest('[data-rmc]'); if(rc){ B.conds.splice(+rc.dataset.rmc,1); drawConds(); drawSum(); saveB(); return; }
  const ri=e.target.closest('[data-rmi]'); if(ri){ B.items.splice(+ri.dataset.rmi,1); B.sim.done={}; openCard=-1; drawItems(); drawSum(); saveB(); }
});

/* ---------- Cuidados trabalhistas ---------- */
const LEG = {
  dsr:{ dias:25, desc:5 },
  cont:[
    {t:'Quanto custa de verdade cada R$ 100 de comissão?', w:'Comissão integra o salário (CLT, art. 457 §1º). Ela gera reflexo em férias + 1/3, 13º, FGTS, INSS e aviso prévio. O custo real é bem maior que o valor no holerite.'},
    {t:'O DSR sobre comissões está sendo calculado na folha?', w:'O vendedor comissionado tem direito ao descanso semanal remunerado sobre as comissões (Súmula 27 do TST e Lei 605/1949). É o direito que quase ninguém paga.'},
    {t:'O bônus comportamental pode ser lançado como prêmio?', w:'Prêmio por desempenho acima do esperado não integra o salário (CLT, art. 457 §2º e §4º). Mas, se for pago por meta comum, pode ser tratado como salário, com encargos.'},
    {t:'Qual o custo real da cadeira com o novo fixo (60/40)?', w:'Mudou o fixo, mudam os encargos. Refaça o custo da cadeira com o contador antes de fechar a meta reversa.'},
    {t:'Como entram as médias de variável em férias e 13º?', w:'Com variável na remuneração, férias e 13º são calculados pela média. Isso pesa no mês de pagamento: precisa estar no seu caixa.'}
  ],
  adv:[
    {t:'A mudança de plano pode reduzir a remuneração de alguém?', w:'Alteração que prejudica o empregado, mesmo com acordo, é vedada (CLT, art. 468). Precisa de aditivo assinado e de uma regra de transição que proteja quem bate meta.'},
    {t:'O "desconto do desperdício" está desenhado do jeito certo?', w:'A empresa não pode transferir o risco do negócio ao empregado (CLT, art. 2º). A regra deve definir a base de cálculo da comissão, e não descontar comissão depois de paga.'},
    {t:'Bônus e comissão estão separados na régua?', w:'Se o bônus for, na prática, comissão com outro nome, a Justiça pode reclassificar e cobrar os reflexos de anos para trás.'},
    {t:'A régua está escrita, assinada e com critérios objetivos?', w:'Diga quem apura, com qual fonte (CRM, sistema), quando paga e o que acontece em férias, afastamento e desligamento no meio do mês. Regra de boca vira processo.'},
    {t:'Quando a comissão é devida: venda fechada, faturada ou paga?', w:'A comissão é exigível depois de ultimada a transação (CLT, art. 466). Defina isso por escrito, inclusive para o caso de cancelamento.'},
    {t:'O que diz a convenção coletiva da categoria?', w:'Comerciários e vestuário podem ter regras próprias sobre comissão, DSR e prazos. A convenção pode valer mais do que a sua régua.'}
  ],
  docs:['Holerites dos últimos 12 meses','Plano de comissão atual (mesmo que de boca, escreva)','A régua nova: OTE, meta, gatilho, curva e bônus','Histórico de vendas por vendedor','Convenção coletiva da categoria'],
  done:{}
};
try{ const sv=JSON.parse(localStorage.getItem('unique_legal')||'null'); if(sv){ LEG.done=sv.done||{}; if(sv.dsr) LEG.dsr=sv.dsr; } }catch(e){}
const saveL=()=>{ try{ localStorage.setItem('unique_legal',JSON.stringify({done:LEG.done,dsr:LEG.dsr})); }catch(e){} };

function legal(){
  const o=calc2();
  const com = o.varAlvo; // variável no alvo como exemplo de comissão do mês
  const chk=(g,arr)=>arr.map((x,k)=>{const id=g+k;return `<label class="lck${LEG.done[id]?' ok':''}"><input type="checkbox" data-l="${id}"${LEG.done[id]?' checked':''}><div><b>${x.t}</b><p>${x.w}</p></div></label>`}).join('');
  screen.innerHTML = `<div class="step">Cuidados trabalhistas</div>
    <h1 style="font-size:clamp(2rem,6.5vw,3.4rem)">A régua errada<br><em class="amberTxt">vira processo.</em></h1>
    <p class="lead" style="margin-top:14px">E o processo chega depois que o vendedor sai, cobrando os últimos 5 anos. Antes de colocar a régua para rodar, leve este checklist ao seu contador e ao seu advogado trabalhista.</p>

    <h3 class="bsec">O direito que ninguém paga: DSR sobre comissão</h3>
    <p class="hint2">DSR é o Descanso Semanal Remunerado. Não é imposto, é um direito do vendedor. O fixo já paga o domingo dele. A comissão, não. Por isso, todo mês, a empresa deve um valor a mais, proporcional aos domingos e feriados.</p>
    <div class="dsr">
      <div class="dsrf"><label>Comissão do mês (R$)</label><input id="dsrC" inputmode="decimal" value="${com.toLocaleString('pt-BR',{maximumFractionDigits:2})}"></div>
      <div class="dsrf"><label>Dias úteis (seg. a sáb.)</label><input id="dsrD" inputmode="decimal" value="${LEG.dsr.dias}"></div>
      <div class="dsrf"><label>Domingos + feriados</label><input id="dsrF" inputmode="decimal" value="${LEG.dsr.desc}"></div>
    </div>
    <div class="dsrres" id="dsrRes"></div>
    <div class="acid"><small>Enquanto isso, na cabeça do dono…</small><p>"Eu já pago a comissão certinha." Paga a comissão. <b>O DSR em cima dela, quase ninguém paga.</b> E é exatamente o que aparece primeiro na reclamação trabalhista.</p></div>

    <h3 class="bsec">Leve para o contador</h3>
    <p class="hint2">Ele cuida da folha: quanto custa e como lançar.</p>
    ${chk('c',LEG.cont)}

    <h3 class="bsec">Leve para o advogado trabalhista</h3>
    <p class="hint2">Ele cuida da regra: o que pode, o que não pode e como escrever.</p>
    ${chk('a',LEG.adv)}

    <h3 class="bsec">Documentos para levar</h3>
    ${LEG.docs.map((t,k)=>{const id='d'+k;return `<label class="lck sm${LEG.done[id]?' ok':''}"><input type="checkbox" data-l="${id}"${LEG.done[id]?' checked':''}><div><b>${t}</b></div></label>`}).join('')}

    <div class="lprog" id="lprog"></div>
    <button class="ghost sm" id="copyL">Copiar checklist para mandar</button>
    <p class="legal">Este material é orientativo e não substitui a análise do seu contador e do seu advogado. Regras de convenção coletiva e decisões judiciais podem mudar o cálculo.</p>`;
  btn.textContent='Voltar ao início';
  $('kbd').style.display='none';
  drawDSR(); drawLProg();
  ['dsrC','dsrD','dsrF'].forEach(id=>$(id).addEventListener('input',drawDSR));
  $('copyL').onclick=async()=>{
    const linhas=['CHECKLIST TRABALHISTA — RÉGUA DE COMISSÃO E BÔNUS','','CONTADOR:',...LEG.cont.map(x=>'[ ] '+x.t),'','ADVOGADO TRABALHISTA:',...LEG.adv.map(x=>'[ ] '+x.t),'','DOCUMENTOS:',...LEG.docs.map(x=>'[ ] '+x)];
    try{ await navigator.clipboard.writeText(linhas.join('\n')); $('copyL').textContent='Checklist copiado ✓'; }catch(e){ $('copyL').textContent='Não deu para copiar aqui'; }
  };
}

function drawDSR(){
  const c=parse($('dsrC').value)||0, dd=parse($('dsrD').value)||0, f=parse($('dsrF').value)||0;
  LEG.dsr={dias:dd,desc:f}; saveL();
  const dsr = dd ? c/dd*f : 0, nv=d.vendedores||1;
  $('dsrRes').innerHTML = `<div class="dsrcalc">(${R(c)} ÷ ${N(dd)} dias úteis) × ${N(f)} domingos e feriados =</div>
    <div class="stats" style="margin-top:8px">
      <div class="stat"><span>DSR por vendedor no mês</span><b class="num amberTxt">${R(dsr)}</b><small>${P(c?dsr/c*100:0)} a mais sobre a comissão</small></div>
      <div class="stat"><span>Por vendedor no ano</span><b class="num">${R(dsr*12)}</b></div>
      <div class="stat"><span>Time inteiro no ano</span><b class="num neg">${R(dsr*12*nv)}</b><small>${N(nv)} vendedores, fora os reflexos</small></div>
    </div>`;
}

function drawLProg(){
  const tot=LEG.cont.length+LEG.adv.length+LEG.docs.length;
  const ok=Object.values(LEG.done).filter(Boolean).length;
  $('lprog').innerHTML=`<div class="lbar"><i style="width:${ok/tot*100}%"></i></div><span>${ok} de ${tot} itens resolvidos</span>`;
}

document.addEventListener('change',e=>{
  const t=e.target; if(t.dataset.l===undefined) return;
  LEG.done[t.dataset.l]=t.checked; t.closest('.lck').classList.toggle('ok',t.checked); drawLProg(); saveL();
});

/* ---------- Menu de seções ---------- */
const SECS=[['CAC','intro','cac'],['Comissão','cmp','comissao'],['Grande final','fin','final'],['OTE','p2','ote'],['Bonificação','bintro','bonificacao'],['Trabalhista','legal','trabalhista']];
const secIdx=t=>S.findIndex(s=>s.t===t);
function drawMenu(){
  const starts=SECS.map(x=>secIdx(x[1]));
  let cur=0; starts.forEach((st,k)=>{ if(i>=st) cur=k; });
  $('menu').innerHTML=SECS.map((x,k)=>`<button data-sec="${k}" class="${k===cur?'on':''}">${x[0]}</button>`).join('');
  const on=$('menu').querySelector('.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'});
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-sec]'); if(b){ const x=SECS[+b.dataset.sec]; history.replaceState(null,'','#'+x[2]); go(secIdx(x[1])); } });
function next(){
  const s=S[i];
  if(s.t==='q'){ if(!answered) return submitQ(); return go(i+1); }
  if(s.t==='fin' && !revealed) return reveal();
  if(s.t==='legal') return go(0);
  go(i+1);
}
btn.addEventListener('click',next);
$('back').addEventListener('click',()=>go(i-1));
$('prev').addEventListener('click',()=>go(i-1));
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && S[i].t!=='bonus' && S[i].t!=='legal'){ e.preventDefault(); next(); } });
{ const h=location.hash.slice(1); const x=SECS.find(z=>z[2]===h); if(x) i=secIdx(x[1]); }
render();
</script>
