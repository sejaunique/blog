<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="/assets/tema.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contrato · Unique Consultoria</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Contrato · Unique Consultoria">
<meta property="og:description" content="Contrato da Unique Consultoria Comercial para assinar pelo Gov.br.">
<meta property="og:image" content="https://sejaunique.com/assets/og-site.jpg">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
<link rel="stylesheet" href="/assets/casco.css">
<script src="/assets/rico.js"></script>
<style>
[hidden]{display:none!important}
.doc{max-width:860px;margin:0 auto;padding:48px 20px 96px}
.capa-c{border-radius:28px;background:var(--marinho);color:#fff;padding:36px 36px 30px;display:grid;gap:14px;position:relative;overflow:hidden}
.capa-c .rot{font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;opacity:.75}
.capa-c h1{font-size:clamp(1.8rem,4.6vw,2.9rem);line-height:1;letter-spacing:-.045em;margin:0;font-weight:800}
.capa-c h1 .leve{display:block;font-weight:200;font-style:italic;font-size:.6em;margin-top:8px}
.capa-c .I{position:absolute;right:32px;top:32px;width:20px;height:58px;background:var(--verde)}
.st{display:inline-flex;align-self:start;justify-self:start;font-size:.72rem;font-weight:800;border-radius:999px;padding:6px 12px;background:#fff;color:#000}
.st.ok{background:#00e676}
.passos{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:22px 0 0;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.passos div{padding:14px 16px;border-right:1px solid var(--line);display:grid;gap:3px;font-size:.8rem}
.passos div:last-child{border-right:0}
.passos b{font-size:.86rem}
.passos small{color:var(--muted)}
.passos .feito{background:var(--soft)}
.passos .feito b::before{content:"✓ ";color:var(--verde-txt,#078a46)}
.corpo{padding:36px 0 10px;font-size:1rem;line-height:1.75}
.corpo h3{font-size:1.5rem;text-align:center;margin:0 0 24px;letter-spacing:-.02em}
.corpo h4{font-size:1rem;margin:28px 0 6px;text-transform:none}
.corpo p{text-align:justify}
.ass{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin:56px 0 10px}
.ass div{border-top:1px solid currentColor;padding-top:10px;font-size:.84rem;line-height:1.5}
.ass small{color:var(--muted)}
.box{margin-top:36px;border-radius:26px;background:var(--soft);padding:28px;display:grid;gap:16px}
.box h2{margin:0;font-size:1.4rem;letter-spacing:-.03em}
.box h2 .leve{font-weight:200;font-style:italic}
.box ol{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:p}
.box ol li{counter-increment:p;display:grid;grid-template-columns:34px 1fr;gap:12px;line-height:1.55;font-size:.92rem}
.box ol li::before{content:counter(p);width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.box .bts{display:flex;flex-wrap:wrap;gap:10px}
.envio{display:grid;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px}
.envio label{font-size:.78rem;font-weight:700}
.envio input[type=text]{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--fg)}
.envio .msg{font-size:.84rem}
.feitos{display:grid;gap:8px}
.feitos a{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;color:inherit;text-decoration:none;font-size:.88rem}
.feitos a b{display:block}
.feitos a small{color:var(--muted)}
.feitos .pdf{width:34px;height:34px;border-radius:9px;background:#e0055e;color:#fff;display:grid;place-items:center;font-size:.6rem;font-weight:800;flex:none}
.estado{padding:120px 20px;text-align:center;color:var(--muted)}
@media (max-width:700px){.corpo p{text-align:left}.passos{grid-template-columns:1fr}.passos div{border-right:0;border-bottom:1px solid var(--line)}.passos div:last-child{border-bottom:0}.ass{grid-template-columns:1fr;gap:36px}.capa-c{padding:28px 22px}.box{padding:22px}}
@media print{
  header,footer,.box,.passos,.no-print,[class*="whats"]{display:none!important}
  body{background:#fff!important;color:#000!important}
  .doc{padding:0;max-width:none}
  .capa-c{display:none}
  .corpo{padding:0;font-size:11.5pt;line-height:1.55;color:#000}
  .corpo mark{background:none!important;color:#000!important}
  .corpo h4{break-after:avoid}
  .ass{break-inside:avoid;color:#000}
  @page{margin:22mm 20mm}
}
</style>
</head>
<body class="leitura" data-casco="area">
<script src="/assets/casco.js"></script>
<main class="doc">
  <div class="estado" id="estado">Carregando o contrato…</div>
  <article id="ct" hidden></article>
</main>
<script>
(function(){
  var t=new URLSearchParams(location.search).get('c')||'';
  var ST={rascunho:'Rascunho (só você vê)',enviado:'Aguardando assinatura','assinado-cliente':'Assinado pelo cliente',assinado:'Assinado pelas duas partes',cancelado:'Cancelado'};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function dt(s){ return s?new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}):''; }
  function hr(s){ return s?new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):''; }
  var C, ADMIN=false;
  function carrega(){
    return fetch('/api/area?a=contrato&c='+encodeURIComponent(t),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(r){
      if(!r.ok){ document.getElementById('estado').textContent='Contrato não encontrado. Confira o link com a Unique.'; return; }
      C=r.contrato; ADMIN=!!r.admin; desenha();
    }).catch(function(){ document.getElementById('estado').textContent='Sem conexão. Tente de novo.'; });
  }
  function envio(quem){
    var nome=quem==='unique'?'Carlos Ribeiro':(C.signatario||'');
    return '<form class="envio" data-quem="'+quem+'"><label for="f-'+quem+'">PDF assinado no Gov.br</label><input id="f-'+quem+'" type="file" accept="application/pdf,.pdf" required>'+
      '<label for="n-'+quem+'">Nome de quem assinou</label><input id="n-'+quem+'" type="text" value="'+esc(nome)+'" maxlength="80">'+
      '<div><button class="btn verde" type="submit">Enviar contrato assinado</button></div><div class="msg" role="status"></div></form>';
  }
  function desenha(){
    var A=C.assinaturas||{}, cli=A.cliente, uni=A.unique;
    document.title=C.titulo+' · '+C.empresa+' · Unique';
    var html='<header class="capa-c"><span class="I" aria-hidden="true"></span><span class="rot">Contrato · Unique Consultoria Comercial</span>'+
      '<h1>'+esc(C.empresa)+'<span class="leve">'+esc(C.titulo.replace(/^Contrato · /,''))+'</span></h1>'+
      '<span class="st'+(C.status==='assinado'?' ok':'')+'">'+ST[C.status]+'</span></header>';
    html+='<div class="passos"><div class="'+(C.status!=='rascunho'?'feito':'')+'"><b>Contrato enviado</b><small>'+(C.atualizado?dt(C.criado):'')+'</small></div>'+
      '<div class="'+(cli?'feito':'')+'"><b>Assinatura do cliente</b><small>'+(cli?esc(cli.nome||'')+' · '+hr(cli.em):'Pendente')+'</small></div>'+
      '<div class="'+(uni?'feito':'')+'"><b>Assinatura da Unique</b><small>'+(uni?esc(uni.nome||'')+' · '+hr(uni.em):'Pendente')+'</small></div></div>';
    html+='<div class="corpo rq-txt">'+(C.html||'')+'</div>';
    html+='<div class="ass"><div><b>'+esc(C.empresa)+'</b><br>'+esc(C.signatario||'')+'<br><small>CONTRATANTE</small></div><div><b>Unique Consultoria Comercial</b><br>Carlos Ribeiro<br><small>CONTRATADA</small></div></div>';
    // caixa de assinatura
    var feitos='';
    if(cli||uni){ feitos='<div class="feitos">'+[uni||cli].map(function(a){ return '<a href="'+esc(a.link)+'" target="_blank" rel="noopener"><span class="pdf">PDF</span><span><b>'+(uni?'Contrato assinado pelas duas partes':'Contrato assinado pelo cliente')+'</b><small>'+esc(a.arquivo||'')+'</small></span></a>'; }).join('')+
      (uni&&cli&&uni.link!==cli.link?'<a href="'+esc(cli.link)+'" target="_blank" rel="noopener"><span class="pdf">PDF</span><span><b>Via assinada pelo cliente</b><small>'+esc(cli.arquivo||'')+'</small></span></a>':'')+
      '<a href="https://validar.iti.gov.br/" target="_blank" rel="noopener"><span class="pdf" style="background:#1e2357">✓</span><span><b>Conferir as assinaturas</b><small>validar.iti.gov.br: envie o PDF e veja quem assinou</small></span></a></div>'; }
    var box='';
    if(C.status==='cancelado') box='<section class="box"><h2>Contrato <span class="leve">cancelado.</span></h2><p class="muted" style="margin:0">Fale com a Unique para uma nova versão.</p></section>';
    else if(C.status==='assinado') box='<section class="box"><h2>Tudo <span class="leve">assinado.</span></h2><p class="muted" style="margin:0">As duas partes assinaram pelo Gov.br. Guarde o PDF abaixo.</p>'+feitos+'</section>';
    else if(!cli){
      box='<section class="box"><h2>Como assinar <span class="leve">pelo Gov.br.</span></h2>'+
        '<ol><li><span><b>Baixe o contrato em PDF.</b> Clique em “Baixar PDF” e, na janela de impressão, escolha <b>Salvar como PDF</b>.</span></li>'+
        '<li><span><b>Assine no Gov.br.</b> Abra o assinador, entre com a sua conta Gov.br (nível prata ou ouro), envie o PDF, posicione a assinatura e baixe o arquivo assinado.</span></li>'+
        '<li><span><b>Envie o PDF assinado aqui.</b> A Unique recebe na hora, assina por último e o contrato completo fica nesta mesma página.</span></li></ol>'+
        '<div class="bts"><button class="btn" type="button" data-print><i class="ic" style="--i:var(--ic-download)"></i>Baixar PDF</button><a class="btn" href="https://assinador.iti.br/" target="_blank" rel="noopener">Abrir o assinador Gov.br ↗</a></div>'+
        (C.status==='rascunho'?'<p class="muted" style="margin:0">Este contrato ainda é rascunho. Mude para “Enviado” no painel para o cliente ver.</p>':envio('cliente'))+'</section>';
    } else {
      box='<section class="box"><h2>'+(ADMIN?'Falta a sua <span class="leve">assinatura.</span>':'Recebemos a sua <span class="leve">assinatura.</span>')+'</h2>'+
        (ADMIN?'<ol><li><span><b>Baixe o PDF que o cliente assinou</b> (abaixo). Assine em cima dele, para as duas assinaturas ficarem no mesmo arquivo.</span></li><li><span><b>Assine no Gov.br</b> e baixe o arquivo.</span></li><li><span><b>Envie aqui.</b> O contrato fica concluído e a empresa é avisada.</span></li></ol>'+feitos+
          '<div class="bts"><a class="btn" href="https://assinador.iti.br/" target="_blank" rel="noopener">Abrir o assinador Gov.br ↗</a></div>'+envio('unique')
        :'<p class="muted" style="margin:0">Agora a Unique assina por último. Você recebe o contrato completo nesta mesma página.</p>'+feitos)+'</section>';
    }
    html+=box;
    var a=document.getElementById('ct'); a.innerHTML=html; a.hidden=false; document.getElementById('estado').hidden=true;
    var pb=a.querySelector('[data-print]'); if(pb) pb.onclick=function(){ window.print(); };
    [].forEach.call(a.querySelectorAll('form.envio'),function(f){ f.onsubmit=function(ev){ ev.preventDefault();
      var arq=f.querySelector('input[type=file]').files[0], m=f.querySelector('.msg'), b=f.querySelector('button');
      if(!arq){ m.textContent='Escolha o PDF assinado.'; return; }
      if(!/pdf$/i.test(arq.type)&&!/\.pdf$/i.test(arq.name)){ m.textContent='Envie o arquivo em PDF.'; return; }
      if(arq.size>4.4e6){ m.textContent='O PDF passou de 4 MB. Mande pelo WhatsApp para a Unique.'; return; }
      b.disabled=true; m.textContent='Enviando…';
      fetch('/api/area?a=contrato-pdf&c='+encodeURIComponent(t)+'&quem='+f.dataset.quem+'&nome='+encodeURIComponent(f.querySelector('input[type=text]').value),{method:'POST',credentials:'same-origin',headers:{'content-type':'application/pdf'},body:arq})
        .then(function(r){return r.json();}).then(function(r){ if(!r.ok){ b.disabled=false; m.textContent=r.erro||'Não foi possível enviar.'; return; } C=r.contrato; desenha(); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); })
        .catch(function(){ b.disabled=false; m.textContent='Sem conexão. Tente de novo.'; }); }; });
  }
  carrega();
})();
</script>
</body>
</html>
