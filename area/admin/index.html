<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="/assets/tema.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workspace · Unique</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/area/admin/app.webmanifest">
<link rel="apple-touch-icon" href="/area/admin/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Unique">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
<link rel="stylesheet" href="/assets/casco.css">
<style>
:root{
  --T:'https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/';
  --ic-bell:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/bell.svg);
  --ic-home:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/layout-dashboard.svg);
  --ic-kanban:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/layout-kanban.svg);
  --ic-predio:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/building.svg);
  --ic-tabela:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/table.svg);
  --ic-proposta:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/file-dollar.svg);
  --ic-diag:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/stethoscope.svg);
  --ic-post:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/article.svg);
  --ic-aula:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/movie.svg);
  --ic-reuniao:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/calendar-event.svg);
  --ic-site:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/world.svg);
  --ic-alda:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/message-chatbot.svg);
  --ic-sair:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/logout.svg);
  --ic-mais:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/plus.svg);
  --ic-editar:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/pencil.svg);
  --ic-lixo:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/trash.svg);
  --ic-copiar:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/copy.svg);
  --ic-abrir:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/arrow-up-right.svg);
  --ic-busca:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/search.svg);
  --ic-chave:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/key.svg);
  --ws-bg:linear-gradient(135deg,#e8ebf5 0%,#eef0f3 45%,#eef3e6 100%);
  --ws-card:rgba(255,255,255,.72);--ws-card2:rgba(255,255,255,.5);--ws-line:rgba(15,15,20,.08);
  --ws-side:#111113;--ws-side-fg:#f5f5f5;--ws-chip:rgba(15,15,20,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ws-bg:linear-gradient(135deg,#07081a 0%,#050506 50%,#06120b 100%);--ws-card:rgba(22,22,26,.78);--ws-card2:rgba(30,30,36,.6);--ws-line:rgba(255,255,255,.07);--ws-side:#f5f5f5;--ws-side-fg:#0b0b0c;--ws-chip:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--ws-bg:linear-gradient(135deg,#07081a 0%,#050506 50%,#06120b 100%);--ws-card:rgba(22,22,26,.78);--ws-card2:rgba(30,30,36,.6);--ws-line:rgba(255,255,255,.07);--ws-side:#f5f5f5;--ws-side-fg:#0b0b0c;--ws-chip:rgba(255,255,255,.07)}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--ws-bg) fixed;color:var(--fg);font-family:var(--font);margin:0}
.login{max-width:420px;margin:12vh auto 0;padding:32px;border-radius:28px;background:var(--ws-card);backdrop-filter:blur(18px)}
.login h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:-.03em}
/* casca */
.side{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:30;background:var(--ws-side);color:var(--ws-side-fg);border-radius:40px;padding:10px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.side button{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ws-side-fg) 18%,transparent);background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;transition:background .2s}
.side button:hover{background:color-mix(in srgb,var(--ws-side-fg) 12%,transparent)}
.side button[aria-current="true"]{background:var(--ws-side-fg);color:var(--ws-side)}
.side button .ic{width:20px;height:20px}
.side button .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--magenta);box-shadow:0 0 0 2px var(--ws-side)}
.side button::after{content:attr(data-nome);position:absolute;left:58px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--fg);color:var(--bg);font-size:.74rem;font-weight:600;padding:6px 12px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s}
.side button:hover::after{opacity:1}
.side hr{border:0;border-top:1px solid color-mix(in srgb,var(--ws-side-fg) 15%,transparent);margin:4px 6px}
.ws{padding:24px 28px 60px 96px;max-width:1500px;margin:0 auto}
.wtop{display:flex;align-items:center;gap:20px;margin-bottom:22px}
.wtop .marca{font-weight:900;letter-spacing:-.04em;font-size:1.25rem;text-decoration:none;color:inherit}
.wtop .marca span{font-weight:300;font-style:italic;margin-left:6px;color:var(--muted)}
.wtop .esp{flex:1}
.redondo{width:42px;height:42px;border-radius:50%;border:1px solid var(--ws-line);background:var(--ws-card);display:grid;place-items:center;cursor:pointer;color:inherit;position:relative}
.redondo .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--magenta)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.85rem}
[data-tema-alvo] button{width:42px;height:42px}
.cab{display:flex;flex-wrap:wrap;align-items:center;gap:20px 34px;margin:6px 0 26px}
.cab h1{font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.02;letter-spacing:-.04em;margin:0;font-weight:700;min-width:220px}
.cab h1 .leve{display:block;font-weight:200;font-style:italic}
.kpis{display:flex;flex-wrap:wrap;gap:22px 30px;flex:1}
.kpi{display:flex;gap:12px;align-items:center}
.kpi .bola{width:42px;height:42px;border-radius:50%;background:var(--ws-chip);display:grid;place-items:center}
.kpi b{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.kpi small{display:block;color:var(--muted);font-size:.72rem;line-height:1.3}
.selo{font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:0}
.s-verde{background:var(--verde);color:#000}.s-mag{background:var(--magenta);color:#fff}.s-mar{background:var(--marinho);color:#fff}.s-neu{background:var(--ws-chip);color:var(--muted)}
/* blocos */
.grade{display:grid;gap:18px}
.g-2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2i{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.card{background:var(--ws-card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--ws-line);border-radius:28px;padding:22px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-h h2{font-size:.95rem;font-weight:700;margin:0;letter-spacing:-.01em;flex:1}
.card-h .muted{font-size:.78rem}
.cbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--ws-line);background:transparent;color:inherit;display:inline-grid;place-items:center;cursor:pointer;text-decoration:none;flex:none}
.cbtn:hover{background:var(--ws-chip)}
.cbtn .ic{width:17px;height:17px}
.pill{font:inherit;font-size:.76rem;font-weight:600;border-radius:999px;padding:9px 16px;border:1px solid var(--ws-line);background:var(--ws-card2);color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.pill:hover{border-color:var(--fg)}
.pill.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.verde{background:var(--verde);color:#000;border-color:var(--verde)}
.pill.perigo{color:var(--erro)}
.pill .ic{width:15px;height:15px}
.pill:disabled{opacity:.5}
.mini{font:inherit;font-size:.74rem;border:1px solid var(--ws-line);border-radius:999px;padding:7px 10px;background:var(--ws-card2);color:var(--fg)}
.vazio{border:1px dashed var(--ws-line);border-radius:20px;padding:22px;color:var(--muted);text-align:center;font-size:.86rem}
.muted{color:var(--muted)}
.app-c{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;justify-content:space-between;margin-bottom:18px;background:var(--marinho);color:#fff;border-color:transparent}
.app-c p{margin:4px 0 0;font-size:.82rem;opacity:.85;max-width:620px}
.app-c .pill{background:#fff;color:#000;border-color:#fff}
.app-c .pill.ghost{background:transparent;color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:.85rem;font-weight:600;z-index:80}
/* cards coloridos (movimento) */
.mov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mc{border-radius:22px;padding:16px 18px;min-height:128px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;background:var(--ws-card2);border:1px solid var(--ws-line);cursor:pointer;transition:transform .2s}
.mc:hover{transform:translateY(-2px)}
.mc small{font-size:.7rem;opacity:.75}
.mc span{font-size:.84rem;font-weight:500;line-height:1.3}
.mc b{margin-top:auto;font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
.mc.c-mar{background:var(--marinho);color:#fff;border-color:transparent}
.mc.c-mag{background:var(--magenta);color:#fff;border-color:transparent}
.mc.c-ver{background:var(--verde);color:#000;border-color:transparent}
.mc.c-pre{background:#0b0b0c;color:#fff;border-color:transparent}
/* funil */
.funil{display:grid;gap:10px;justify-items:center}
.funil div{width:var(--w);background:var(--ws-card2);border:1px solid var(--ws-line);border-radius:20px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
.funil b{font-size:1.15rem}
/* calendário */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-h b{flex:1;text-align:center;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dw{font-size:.62rem;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.cal .d{aspect-ratio:1;border-radius:12px;background:var(--ws-card2);font-size:.72rem;padding:5px;display:flex;flex-direction:column;justify-content:space-between;cursor:default;border:1px solid transparent}
.cal .d.fora{opacity:.3}
.cal .d.hoje{border-color:var(--fg)}
.cal .d.tem{background:var(--marinho);color:#fff;cursor:pointer}
.cal .d.atr{background:var(--magenta);color:#fff}
.cal .d.reu{background:var(--verde);color:#000}
.cal .d i{font-style:normal;font-weight:700;font-size:.66rem;align-self:flex-end}
/* lista */
.lst{display:grid;gap:8px}
.li{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--ws-card2);border:1px solid var(--ws-line)}
.li h4{margin:0;font-size:.9rem;font-weight:600}
.li p{margin:3px 0 0;font-size:.8rem;color:var(--muted);word-break:break-word}
.li .tag{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.li .bts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.li.lido{opacity:.55}
/* kanban */
.kb-filtro{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{font:inherit;font-size:.72rem;font-weight:600;border:1px solid var(--ws-line);border-radius:999px;padding:7px 13px;background:var(--ws-card2);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kb{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--ws-card);border:1px solid var(--ws-line);border-radius:28px;padding:12px;min-height:300px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(18px)}
.col.sobre{border-color:var(--verde)}
.col h3{margin:6px 8px;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.col h3 i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
.col h3 span{color:var(--muted)}
.kc{background:var(--ws-card2);border:1px solid var(--ws-line);border-radius:20px;padding:14px;display:grid;gap:8px;cursor:grab;font-size:.82rem}
.kc:hover{border-color:var(--fg)}
.kc.arrasta{opacity:.4}
.kc b{font-size:.96rem;line-height:1.2}
.kc .muted{font-size:.76rem;line-height:1.4}
.tg{display:flex;flex-wrap:wrap;gap:5px}
.tg span{font-size:.63rem;font-weight:700;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--magenta-txt) 15%,transparent);color:var(--magenta-txt)}
.ori{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--verde-txt);font-weight:700}
.kc details summary{font-size:.72rem;font-weight:600;cursor:pointer;color:var(--muted)}
.kc details label{display:flex;gap:6px;align-items:center;font-size:.76rem;margin-top:6px}
.kc .bts{display:flex;flex-wrap:wrap;gap:6px}
/* empresas */
.emp-lista{display:grid;gap:6px;max-height:70vh;overflow:auto;padding-right:4px}
.emp-lista button{font:inherit;text-align:left;border:1px solid transparent;background:transparent;color:inherit;border-radius:16px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.emp-lista button:hover{background:var(--ws-chip)}
.emp-lista button[aria-current="true"]{background:var(--fg);color:var(--bg)}
.emp-lista button small{font-size:.66rem;opacity:.7}
.busca{display:flex;align-items:center;gap:8px;border:1px solid var(--ws-line);border-radius:999px;padding:9px 14px;background:var(--ws-card2);margin-bottom:12px}
.busca input{border:0;background:none;font:inherit;font-size:.85rem;color:inherit;outline:none;flex:1;min-width:0}
.perfil{text-align:center;display:grid;justify-items:center;gap:8px;padding-top:6px}
.perfil .ini{width:92px;height:92px;border-radius:50%;background:var(--marinho);color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:800;letter-spacing:-.04em}
.perfil h3{margin:0;font-size:1.25rem;letter-spacing:-.02em}
.perfil .bts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.dados{display:grid;gap:12px}
.dados div{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center}
.dados small{display:block;font-size:.68rem;color:var(--muted)}
.dados b{font-weight:600;font-size:.92rem;word-break:break-word}
.form{display:grid;gap:10px}
.form .campo{margin:0}
.form .campo label{font-size:.72rem}
.form .campo input,.form .campo select,.form .campo textarea{background:var(--ws-card2);border-color:var(--ws-line);border-radius:14px;padding:10px 12px;font-size:.88rem}
.form .l2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .l3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.aviso{font-size:.82rem;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--erro) 12%,transparent);color:var(--erro)}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
/* tabela */
.tbl-w{overflow-x:auto;margin:0 -6px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:.82rem;min-width:1080px}
.tbl th{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:4px 10px}
.tbl td{background:var(--ws-card2);padding:10px;vertical-align:middle;border-top:1px solid var(--ws-line);border-bottom:1px solid var(--ws-line)}
.tbl td:first-child{border-radius:16px 0 0 16px;border-left:1px solid var(--ws-line)}
.tbl td:last-child{border-radius:0 16px 16px 0;border-right:1px solid var(--ws-line)}
.tbl input[type=text],.tbl input[type=date],.tbl input[type=datetime-local],.tbl select{font:inherit;font-size:.8rem;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:10px;padding:6px 8px;width:100%}
.tbl input:hover,.tbl select:hover,.tbl input:focus{border-color:var(--ws-line);background:var(--bg)}
.tbl .tit{font-weight:600;font-size:.86rem}
.tbl .det{color:var(--muted);font-size:.74rem;margin-top:2px}
.cli{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cli span{font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--ws-chip)}
.cli span.todos{background:var(--verde);color:#000}
.cli button{font:inherit;font-size:.7rem;border:1px dashed var(--ws-line);background:none;color:var(--muted);border-radius:999px;padding:3px 9px;cursor:pointer}
.barra{height:6px;border-radius:999px;background:var(--ws-chip);overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;background:var(--verde-txt)}
.tipo{font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.08em}
.t-acao{background:var(--ws-chip)}.t-post{background:var(--marinho);color:#fff}.t-video{background:var(--magenta);color:#fff}.t-reuniao{background:var(--verde);color:#000}.t-material{background:#0b0b0c;color:#fff}
tr.det-cli td{background:transparent;border:0;padding:0 10px 10px}
.and{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.and div{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;background:var(--ws-card2);border:1px solid var(--ws-line);border-radius:14px;padding:8px 10px;font-size:.78rem}
.pop{position:fixed;z-index:60;background:var(--bg);color:var(--fg);border:1px solid var(--ws-line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:14px;width:280px;max-height:60vh;overflow:auto}
.pop label{display:flex;gap:8px;align-items:center;font-size:.82rem;padding:5px 2px}
.pop .bts{display:flex;gap:8px;margin-top:10px;position:sticky;bottom:-14px;background:var(--bg);padding:8px 0}
/* propostas */
.prop-c{display:grid;gap:6px;padding:16px;border-radius:22px;background:var(--ws-card2);border:1px solid var(--ws-line)}
.prop-c b{font-size:1rem}
.st-rascunho{background:var(--ws-chip);color:var(--muted)}.st-enviada{background:var(--marinho);color:#fff}.st-aceita{background:var(--verde);color:#000}.st-recusada{background:var(--magenta);color:#fff}
.itens-p{display:grid;gap:6px}
.itens-p div{display:grid;grid-template-columns:1fr 130px 34px;gap:6px}
.itens-p input{font:inherit;font-size:.85rem;color:var(--fg);background:var(--ws-card2);border:1px solid var(--ws-line);border-radius:12px;padding:9px 11px;min-width:0}
.total{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.links-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lk{display:grid;gap:6px;padding:18px;border-radius:22px;background:var(--ws-card2);border:1px solid var(--ws-line);text-decoration:none;color:inherit;transition:transform .2s}
.lk:hover{transform:translateY(-2px);border-color:var(--fg)}
.lk .ic{width:22px;height:22px}
.lk b{font-size:.95rem}
.lk span{font-size:.78rem;color:var(--muted)}
@media (max-width:1100px){.g-2,.g-3,.g-2i{grid-template-columns:1fr}.mov{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .side{top:auto;bottom:12px;left:50%;transform:translateX(-50%);flex-direction:row;overflow-x:auto;max-width:calc(100vw - 24px);border-radius:999px}
  .side hr{display:none}.side button::after{display:none}
  .ws{padding:16px 16px 100px}
  .mov{grid-template-columns:1fr}
  .form .l2,.form .l3{grid-template-columns:1fr}
}

<body data-casco="area">
<form class="login" id="f-login" hidden>
  <span class="spaced muted">Workspace Unique</span>
  <h1>Entrar como Unique</h1>
  <div class="aviso" id="m-login" hidden></div>
  <div class="campo"><label for="l-senha">Senha do admin</label><input id="l-senha" type="password" autocomplete="current-password" required></div>
  <button class="btn solid" type="submit" style="width:100%">Entrar</button>
</form>

<nav class="side" id="side" aria-label="Menu" hidden></nav>

<div class="ws" id="ws" hidden>
  <div class="wtop">
    <a class="marca" href="/" target="_blank" rel="noopener">UNIQUE<span>workspace</span></a>
    <div class="esp"></div>
    <button class="redondo" type="button" id="b-sino" aria-label="Notificações"><i class="ic" style="--i:var(--ic-bell)"></i><span class="dot" id="sino-dot" hidden></span></button>
    <span data-tema-alvo></span>
    <div class="avatar" title="Carlos Ribeiro">CR</div>
    <button class="redondo" type="button" id="b-sair" aria-label="Sair"><i class="ic" style="--i:var(--ic-sair)"></i></button>
  </div>
  <div class="cab"><h1 id="titulo"></h1><div class="kpis" id="kpis"></div></div>
  <main id="vista"></main>
</div>

<script src="/blog/posts.js"></script>
<script>
(function(){
  var MENU=[
    ['painel','Painel','home'],['crm','CRM','kanban'],['notificacoes','Notificações','bell'],['empresas','Empresas','predio'],
    ['acoes','Ações','tabela'],['propostas','Propostas','proposta'],['diagnosticos','Diagnósticos','diag'],
    '-',['postagens','Postagens e blog','post'],['videoaulas','Videoaulas','aula'],['reunioes','Reuniões','reuniao'],
    '-',['site','Site','site'],['alda','Alda.CRM','alda']
  ];
  var ETAPA={lead:['Lead','var(--muted)'],qualificado:['Lead qualificado','#f0a020'],cliente:['Cliente','var(--verde-txt)'],finalizado:['Finalizado','var(--marinho-txt)']};
  var ST={a_fazer:'A fazer',fazendo:'Em andamento',feito:'Feito'};
  var USTATUS={convite:'Sem acesso ainda',pendente:'Pediu acesso',ativo:'Com acesso',bloqueado:'Bloqueado',recusado:'Recusado'};
  var TIPO={acao:'Ação',post:'Post',video:'Videoaula',reuniao:'Reunião',material:'Material'};
  var PST={rascunho:'Rascunho',enviada:'Enviada',aceita:'Aceita',recusada:'Recusada'};
  var R=null, AC=null, PROPS=null, DIAGS=null, VISTA='painel', EMP='', FILTRO='', CALM=new Date(), BLOB=false;
  var $=function(id){return document.getElementById(id);};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function ic(n){ return '<i class="ic" style="--i:var(--ic-'+n+')"></i>'; }
  function toast(t){ var d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(function(){d.remove();},2400); }
  function get(q){ return fetch('/api/area'+q,{credentials:'same-origin'}).then(function(r){return r.json();}); }
  function post(o){ return fetch('/api/area',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(function(r){return r.json();}); }
  function wa(n){ var d=String(n||'').replace(/\D/g,''); if(!d) return ''; if(d.length<=11) d='55'+d; return d; }
  function dt(s,h){ if(!s) return ''; var d=new Date(s.length===10?s+'T12:00':s); return d.toLocaleDateString('pt-BR',h?{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}:{day:'2-digit',month:'short'}); }
  function brl(v){ return (+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function hoje(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
  function nomeEmp(sl){ var e=(R.empresas||[]).filter(function(x){return x.slug===sl;})[0]; return e?e.nome:sl; }
  function emp(sl){ return (R.empresas||[]).filter(function(x){return x.slug===sl;})[0]; }
  function iniciais(n){ return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(function(p){return p[0];}).join('').toUpperCase(); }

  /* Google Agenda: abre o evento já preenchido */
  function agenda(o){
    var ini=o.inicio||o.prazo||hoje(), datas;
    if(ini.length>10){ var a=new Date(ini), b=new Date(a.getTime()+(o.min||60)*60000), f=function(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}; datas=f(a)+'/'+f(b); }
    else { var d=ini.replace(/-/g,''), n=new Date(ini+'T12:00'); n.setDate(n.getDate()+1); datas=d+'/'+n.toISOString().slice(0,10).replace(/-/g,''); }
    var u='https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=America/Sao_Paulo&text='+encodeURIComponent(o.titulo)+'&dates='+datas+'&details='+encodeURIComponent((o.detalhe||'')+(o.slug?'\n\nCliente: '+nomeEmp(o.slug)+'\nÁrea do cliente: '+location.origin+'/area/painel/?e='+o.slug:''));
    if(o.emails&&o.emails.length) u+='&add='+encodeURIComponent(o.emails.join(','));
    window.open(u,'_blank','noopener');
  }

  /* ---------- app (instalar e notificações) ---------- */
  var SWR=null, INST=null;
  var ehIOS=/iphone|ipad|ipod/i.test(navigator.userAgent), instalado=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/area/admin/sw.js',{scope:'/area/admin/'}).then(function(r){SWR=r;}).catch(function(){});
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); INST=e; if(VISTA==='notificacoes'||VISTA==='painel') desenha(); });
  function b64(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function pushLigado(){ return !!(SWR&&window.Notification&&Notification.permission==='granted'&&localStorage&&(function(){try{return localStorage.getItem('ws-push')==='1';}catch(e){return false;}})()); }
  function ligaPush(){
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){ toast(ehIOS&&!instalado?'No iPhone: instale o app primeiro (Compartilhar → Adicionar à Tela de Início) e ative por ele.':'Este navegador não recebe notificações.'); return; }
    Notification.requestPermission().then(function(p){
      if(p!=='granted'){ toast('Notificações bloqueadas. Libere nas configurações do navegador.'); return; }
      return navigator.serviceWorker.ready.then(function(reg){ SWR=reg; return get('?a=admin-push-chave').then(function(k){
        return reg.pushManager.getSubscription().then(function(sub){ return sub||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k.publica)}); });
      }); }).then(function(sub){ return post({a:'admin-push',sub:sub.toJSON()}); }).then(function(r){
        if(r&&r.ok){ try{localStorage.setItem('ws-push','1');}catch(e){} toast('Notificações ligadas neste aparelho.'); post({a:'admin-push-teste'}); desenha(); } else toast('Não foi possível ligar.');
      });
    }).catch(function(){ toast('Não foi possível ligar as notificações.'); });
  }
  function desligaPush(){ if(!SWR) return; SWR.pushManager.getSubscription().then(function(sub){ if(!sub) return; return post({a:'admin-push-sair',endpoint:sub.endpoint}).then(function(){ return sub.unsubscribe(); }); }).then(function(){ try{localStorage.removeItem('ws-push');}catch(e){} toast('Notificações desligadas neste aparelho.'); desenha(); }); }
  function cartaoApp(){
    if(pushLigado()) return '';
    var txt=ehIOS&&!instalado?'No iPhone: toque em Compartilhar → <b>Adicionar à Tela de Início</b>, abra o app pelo ícone e ative as notificações por ele.':
      !instalado?'Instale o Unique Workspace no celular ou no computador e ligue os avisos: novo diagnóstico, pedido de acesso, comentário, proposta aberta e ação concluída.':'Ligue os avisos para saber na hora quando chega um diagnóstico, um comentário ou quando o cliente abre a proposta.';
    return '<section class="card app-c"><div><b>Leve o workspace no bolso</b><p>'+txt+'</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+(INST?'<button class="pill" data-app="instalar">'+ic('download')+'Instalar app</button>':'')+((!ehIOS||instalado)?'<button class="pill'+(INST?' ghost':'')+'" data-app="push">'+ic('bell')+'Ligar notificações</button>':'')+'</div></section>';
  }
  document.addEventListener('click',function(ev){ var b=ev.target.closest('[data-app]'); if(!b) return;
    if(b.dataset.app==='instalar'&&INST){ INST.prompt(); INST.userChoice.then(function(){ INST=null; desenha(); }); }
    if(b.dataset.app==='push') ligaPush();
    if(b.dataset.app==='desliga') desligaPush();
    if(b.dataset.app==='teste') post({a:'admin-push-teste'}).then(function(){ toast('Aviso de teste enviado.'); }); });

  /* ---------- entrada ---------- */
  get('?a=eu').then(function(eu){
    if(eu.logado&&eu.admin) inicia();
    else if(eu.logado) location.replace('/area/painel/');
    else $('f-login').hidden=false;
  });
  $('f-login').onsubmit=function(ev){
    ev.preventDefault();
    post({a:'admin-entrar',senha:$('l-senha').value}).then(function(r){
      if(r.ok){ $('f-login').hidden=true; inicia(); } else { var m=$('m-login'); m.textContent=r.erro||'Não foi possível entrar.'; m.hidden=false; }
    });
  };
  $('b-sair').onclick=function(){ post({a:'sair'}).then(function(){ location.href='/area/'; }); };
  $('b-sino').onclick=function(){ vai('notificacoes'); };

  function inicia(){
    $('ws').hidden=false; $('side').hidden=false;
    $('side').innerHTML=MENU.map(function(m){ return m==='-'?'<hr>':'<button type="button" data-v="'+m[0]+'" data-nome="'+m[1]+'" aria-label="'+m[1]+'">'+ic(m[2])+(m[0]==='notificacoes'?'<span class="dot" id="side-dot" hidden></span>':'')+'</button>'; }).join('');
    $('side').onclick=function(ev){ var b=ev.target.closest('[data-v]'); if(b) vai(b.dataset.v); };
    window.addEventListener('hashchange',function(){ var h=location.hash.slice(1).split('/'); if(h[0]&&h[0]!==VISTA||h[1]!==EMP){ VISTA=h[0]||'painel'; EMP=h[1]||EMP; desenha(); atualiza(); } });
    var h=location.hash.slice(1).split('/'); VISTA=h[0]||'painel'; EMP=h[1]||'';
    carrega().then(desenha);
  }
  function carrega(){
    return Promise.all([get('?a=admin-resumo'),get('?a=admin-acoes'),get('?a=admin-propostas'),get('?a=admin-diagnosticos')]).then(function(x){
      R=x[0]; AC=x[1]; PROPS=(x[2].propostas||[]); DIAGS=(x[3].diagnosticos||[]); BLOB=R.blob;
      var n=notifCount(); $('sino-dot').hidden=!n; var sd=$('side-dot'); if(sd) sd.hidden=!n;
    });
  }
  var VIVAS={painel:1,crm:1,notificacoes:1,diagnosticos:1};
  function atualiza(){ var v=VISTA; if(VIVAS[v]) carrega().then(function(){ if(VISTA===v&&!document.querySelector('.pop')) desenha(); }); }
  function vai(v,e){ VISTA=v; if(e!==undefined) EMP=e; history.replaceState(null,'','#'+v+(v==='empresas'&&EMP?'/'+EMP:'')); desenha(); window.scrollTo({top:0}); atualiza(); }
  function recarrega(){ return carrega().then(desenha); }

  function notifCount(){ var c=(R.avisos||[]).filter(function(a){return !a.lido;}).length; return (R.pendentes||[]).length+c; }

  function cabecalho(t,leve,kp){
    $('titulo').innerHTML=esc(t)+(leve?'<span class="leve">'+esc(leve)+'</span>':'');
    $('kpis').innerHTML=(kp||[]).map(function(k){ return '<div class="kpi"><span class="bola">'+ic(k[0])+'</span><div><b>'+k[1]+(k[3]?' <span class="selo '+(k[4]||'s-neu')+'">'+k[3]+'</span>':'')+'</b><small>'+k[2]+'</small></div></div>'; }).join('');
    document.querySelectorAll('#side [data-v]').forEach(function(b){ b.setAttribute('aria-current',b.dataset.v===VISTA); });
  }
  function desenha(){
    var f={painel:vPainel,crm:vCrm,notificacoes:vNotif,empresas:vEmpresas,acoes:vAcoes,propostas:vPropostas,diagnosticos:vDiag,postagens:vPosts,videoaulas:vVideos,reunioes:vReunioes,site:vSite,alda:vAlda}[VISTA]||vPainel;
    f();
  }

  /* ---------- dados derivados ---------- */
  function linhas(){ // todas as ações da tabela única
    var L=[];
    (AC.modelos||[]).forEach(function(m){
      var dest=m.destino==='todos'?(R.empresas||[]).map(function(e){return e.slug;}):(m.destino||[]);
      var and=(AC.andamento||{})[m.id]||{};
      L.push(Object.assign({},m,{fonte:'biblioteca',clientes:dest,todos:m.destino==='todos',and:and}));
    });
    (AC.proprias||[]).forEach(function(a){
      var and={}; and[a.slug]={status:a.status,prazo:a.prazo};
      L.push(Object.assign({},a,{fonte:'propria',destino:[a.slug],clientes:[a.slug],and:and}));
    });
    // posts do blog que ainda não viraram ação
    var links={}; L.forEach(function(x){ if(x.link) links[x.link]=1; });
    (window.POSTS||[]).forEach(function(p){
      var l='/blog/#'+p.slug; if(links[l]) return;
      L.push({id:'',fonte:'post',slug_post:p.slug,titulo:String(p.titulo).replace(/==/g,''),detalhe:p.resumo||p.categoria||'',tipo:'post',dono:'cliente',link:l,inicio:p.data,prazo:'',clientes:[],and:{},destino:[]});
    });
    return L;
  }
  function pendencias(){ // por cliente: ações com prazo
    var out=[];
    linhas().forEach(function(l){
      l.clientes.forEach(function(sl){ var a=l.and[sl]||{}; var pz=a.prazo||l.prazo; if(pz) out.push({titulo:l.titulo,slug:sl,prazo:pz,status:a.status||'a_fazer',tipo:l.tipo,inicio:l.inicio}); });
    });
    return out;
  }

  /* ---------- PAINEL (controle e gestão) ---------- */
  function vPainel(){
    var E=R.empresas||[], cont={lead:0,qualificado:0,cliente:0,finalizado:0};
    E.forEach(function(e){ cont[e.etapa]=(cont[e.etapa]||0)+1; });
    var abertas=PROPS.filter(function(p){return p.status==='enviada';}), pipe=abertas.reduce(function(t,p){return t+(+p.total||0);},0);
    var ganhas=PROPS.filter(function(p){return p.status==='aceita';}).reduce(function(t,p){return t+(+p.total||0);},0);
    var P=pendencias(), h=hoje(), atras=P.filter(function(p){return p.status!=='feito'&&p.prazo<h;});
    var semana=new Date(Date.now()-7*864e5).toISOString();
    var novosD=DIAGS.filter(function(d){return d.data>semana;}).length;
    cabecalho('Controle','e gestão',[
      ['proposta',brl(pipe),'em propostas abertas',abertas.length?abertas.length+' abertas':'','s-mar'],
      ['users',(cont.lead+cont.qualificado),'leads no funil',novosD?'+'+novosD+' semana':'','s-verde'],
      ['alerta',atras.length,'entregas atrasadas',atras.length?'atenção':'','s-mag'],
      ['bell',notifCount(),'pedem você','', '']
    ]);
    // movimento recente
    var ev=[];
    DIAGS.slice(0,8).forEach(function(d){ ev.push({d:d.data,c:'c-mar',t:'Diagnóstico recebido',s:d.empresa,v:d.nome||'',go:['empresas',d.slug]}); });
    PROPS.slice(0,8).forEach(function(p){ ev.push({d:p.atualizado||p.criado,c:p.status==='aceita'?'c-ver':p.status==='recusada'?'c-mag':p.status==='enviada'?'c-pre':'',t:'Proposta '+PST[p.status].toLowerCase(),s:p.empresa,v:brl(p.total),go:['propostas',p.id]}); });
    (R.avisos||[]).slice(0,6).forEach(function(a){ ev.push({d:a.data,c:'',t:'Comentário de '+a.nome,s:nomeEmp(a.slug),v:'“'+String(a.texto).slice(0,40)+'”',go:['notificacoes']}); });
    ev.sort(function(a,b){return String(b.d).localeCompare(String(a.d));});
    var mov=ev.slice(0,6).map(function(e,i){ return '<a class="mc '+e.c+'" data-go="'+esc(e.go.join('|'))+'"><small>'+dt(e.d)+'</small><span>'+esc(e.t)+'<br><strong>'+esc(e.s)+'</strong></span><b>'+esc(e.v)+'</b></a>'; }).join('')||'<div class="vazio" style="grid-column:1/-1">Nada aconteceu ainda. Diagnósticos, propostas e comentários aparecem aqui.</div>';
    var tot=Math.max(1,E.length);
    var funil=['lead','qualificado','cliente','finalizado'].map(function(k,i){ return '<div style="--w:'+(100-i*12)+'%"><span>'+ETAPA[k][0]+'</span><b>'+cont[k]+'</b></div>'; }).join('');
    $('vista').innerHTML=cartaoApp()+
      '<div class="grade g-2">'+
        '<section class="card"><div class="card-h"><h2>Movimento recente</h2><button class="cbtn" data-go="notificacoes">'+ic('abrir')+'</button></div><div class="mov">'+mov+'</div></section>'+
        '<section class="card"><div class="card-h"><h2>Funil</h2><button class="cbtn" data-go="crm">'+ic('abrir')+'</button></div>'+
          '<div style="margin-bottom:14px"><span class="total">'+brl(pipe)+'</span><div class="muted" style="font-size:.74rem">em propostas abertas · '+brl(ganhas)+' fechado</div></div><div class="funil">'+funil+'</div></section>'+
      '</div>'+
      '<div class="grade g-2i" style="margin-top:18px">'+
        '<section class="card"><div class="card-h"><h2>Agenda de entregas</h2><button class="cbtn" data-cal="-1">←</button><button class="cbtn" data-cal="1">→</button></div><div id="cal"></div></section>'+
        '<section class="card"><div class="card-h"><h2>Atrasadas e próximas</h2><button class="cbtn" data-go="acoes">'+ic('abrir')+'</button></div><div class="lst" id="prox"></div></section>'+
      '</div>';
    calendario(P);
    var prox=P.filter(function(p){return p.status!=='feito';}).sort(function(a,b){return a.prazo.localeCompare(b.prazo);}).slice(0,8);
    $('prox').innerHTML=prox.length?prox.map(function(p){ var at=p.prazo<h; return '<div class="li"><div><span class="tag" style="'+(at?'color:var(--erro)':'')+'">'+(at?'Atrasada · ':'')+dt(p.prazo)+' · '+esc(nomeEmp(p.slug))+'</span><h4>'+esc(p.titulo)+'</h4></div><div class="bts"><span class="selo '+(p.status==='fazendo'?'s-mar':'s-neu')+'">'+ST[p.status]+'</span></div></div>'; }).join(''):'<div class="vazio">Nenhuma entrega com data. Defina datas na tabela de ações.</div>';
    $('vista').onclick=function(ev){
      var g=ev.target.closest('[data-go]'); if(g){ var p=g.dataset.go.split('|'); if(p[0]==='propostas'){ EDIT=p[1]; } vai(p[0],p[0]==='empresas'?p[1]:undefined); return; }
      var c=ev.target.closest('[data-cal]'); if(c){ CALM.setMonth(CALM.getMonth()+(+c.dataset.cal)); calendario(P); }
      var d=ev.target.closest('.d[data-dia]'); if(d){ FILTRO_DIA=d.dataset.dia; vai('acoes'); }
    };
  }
  var FILTRO_DIA='';
  function calendario(P){
    var y=CALM.getFullYear(), m=CALM.getMonth(), prim=new Date(y,m,1), ini=new Date(y,m,1-prim.getDay()), h=hoje(), mapa={};
    P.forEach(function(p){ (mapa[p.prazo]=mapa[p.prazo]||[]).push(p); if(p.tipo==='reuniao'&&p.inicio) (mapa[p.inicio.slice(0,10)]=mapa[p.inicio.slice(0,10)]||[]).push(p); });
    var out='<div class="cal-h"><b>'+prim.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</b></div><div class="cal">'+['D','S','T','Q','Q','S','S'].map(function(d){return '<span class="dw">'+d+'</span>';}).join('');
    for(var i=0;i<42;i++){
      var d=new Date(ini); d.setDate(ini.getDate()+i); var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      var L=mapa[k]||[], cls='d'+(d.getMonth()!==m?' fora':'')+(k===h?' hoje':'');
      if(L.length){ cls+=' tem'; if(L.some(function(x){return x.status!=='feito'&&k<h;})) cls+=' atr'; else if(L.some(function(x){return x.tipo==='reuniao';})) cls+=' reu'; }
      out+='<div class="'+cls+'"'+(L.length?' data-dia="'+k+'" title="'+esc(L.map(function(x){return x.titulo+' · '+nomeEmp(x.slug);}).join('\n'))+'"':'')+'>'+d.getDate()+(L.length?'<i>'+L.length+'</i>':'')+'</div>';
    }
    $('cal').innerHTML=out+'</div>';
  }

  /* ---------- CRM ---------- */
  function vCrm(){
    var E=R.empresas||[], c={}; E.forEach(function(e){c[e.etapa]=(c[e.etapa]||0)+1;});
    cabecalho('CRM','funil de clientes',[['users',c.lead||0,'leads'],['alvo',c.qualificado||0,'qualificados'],['check',c.cliente||0,'clientes'],['proposta',PROPS.filter(function(p){return p.status==='enviada';}).length,'propostas abertas']]);
    $('vista').innerHTML='<div class="kb-filtro" id="kb-filtro"></div><div class="kb" id="kb"></div>';

        '<div class="aviso" id="p-msg" hidden></div></form></section>'+
      '<section class="card"><div class="card-h"><h2>Todas as propostas</h2></div><div class="lst" id="p-lista"></div></section></div>';
    if(window.innerWidth<1100) $('vista').firstChild.style.gridTemplateColumns='1fr';
    var F=$('f-prop'), IT=(p.itens&&p.itens.length?p.itens:[{descricao:'',valor:''}]).map(function(i){return {descricao:i.descricao,valor:i.valor};});
    function itensP(){ $('p-itens').innerHTML=IT.map(function(i,k){return '<div><input data-i="'+k+'" data-c="descricao" placeholder="Descrição" value="'+esc(i.descricao)+'"><input data-i="'+k+'" data-c="valor" placeholder="Valor (R$)" inputmode="decimal" value="'+esc(i.valor)+'"><button type="button" class="cbtn" data-rm="'+k+'">'+ic('x')+'</button></div>';}).join(''); tot(); }
    function tot(){ $('p-total').textContent=brl(IT.reduce(function(t,i){return t+(+String(i.valor).replace(',','.')||0);},0)); }
    itensP();
    $('p-itens').oninput=function(ev){ var t=ev.target; if(t.dataset.i){ IT[+t.dataset.i][t.dataset.c]=t.value; tot(); } };
    $('p-itens').onclick=function(ev){ var b=ev.target.closest('[data-rm]'); if(b){ IT.splice(+b.dataset.rm,1); if(!IT.length) IT.push({descricao:'',valor:''}); itensP(); } };
    $('p-add').onclick=function(){ IT.push({descricao:'',valor:''}); itensP(); };
    F.slug.onchange=function(){ $('p-contato').hidden=!!this.value; };
    if($('p-nova')) $('p-nova').onclick=function(){ EDIT=''; NOVA_SLUG=''; vPropostas(); };
    function envia(enviar){
      var o={id:p.id||'',titulo:F.titulo.value,servico:F.servico.value,contato:F.contato?F.contato.value:p.contato,contexto:F.contexto.value,objetivos:F.objetivos.value,escopo:F.escopo.value,etapas:F.etapas.value,itens:IT,pagamento:F.pagamento.value,validade:F.validade.value,observacoes:F.observacoes.value,notas:F.notas.value,status:enviar&&F.status.value==='rascunho'?'enviada':F.status.value};
      var b={a:'admin-proposta',proposta:o};
      if(p.id||F.slug.value) b.slug=p.slug||F.slug.value; else b.contato={empresa:F.c_empresa.value,nome:F.c_nome.value,email:F.c_email.value,whatsapp:F.c_whatsapp.value};
      if(!o.contato&&b.contato) o.contato=b.contato.nome;
      post(b).then(function(r){
        if(!r.ok){ var m=$('p-msg'); m.textContent=r.erro||'Não foi possível salvar.'; m.hidden=false; return; }
        toast(r.novo?'Proposta salva. '+r.proposta.empresa+' entrou como lead qualificado.':'Proposta salva.');
        EDIT=r.proposta.id;
        carrega().then(function(){ vPropostas();
          if(enviar){ var e=emp(r.proposta.slug)||{usuarios:[]}, u=e.usuarios[0]||{}; try{navigator.clipboard.writeText(r.url);}catch(x){}
            var t='Olá, '+String(r.proposta.contato||u.nome||'').split(' ')[0]+'! Segue a proposta da Unique para a '+r.proposta.empresa+': '+r.url;
            if(wa(u.whatsapp)) window.open('https://wa.me/'+wa(u.whatsapp)+'?text='+encodeURIComponent(t),'_blank','noopener'); else prompt('Link da proposta (copiado):',r.url); } });
      });
    }
    F.onsubmit=function(ev){ ev.preventDefault(); envia(false); };
    $('p-enviar').onclick=function(){ envia(true); };
    $('p-lista').innerHTML=PROPS.length?PROPS.map(function(x){
      return '<div class="prop-c" style="'+(x.id===EDIT?'border-color:var(--fg)':'')+'"><div style="display:flex;justify-content:space-between;gap:8px"><span class="selo st-'+x.status+'">'+PST[x.status]+(x.vista?' · aberta '+dt(x.vista):'')+'</span><small class="muted">'+dt(x.atualizado||x.criado)+'</small></div><b>'+esc(x.empresa)+'</b><span class="muted" style="font-size:.8rem">'+esc(x.titulo)+(x.servico?' · '+esc(x.servico):'')+'</span><span class="total" style="font-size:1.1rem">'+brl(x.total)+'</span>'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="pill" data-ed="'+esc(x.id)+'">'+ic('editar')+'Editar</button><a class="pill" target="_blank" href="/proposta/?p='+esc(x.token)+'">'+ic('abrir')+'Abrir</a><button class="pill" data-cp="'+esc(x.token)+'">'+ic('copiar')+'Link</button><button class="cbtn" data-del="'+esc(x.id)+'">'+ic('lixo')+'</button></div></div>'; }).join(''):'<div class="vazio">Nenhuma proposta ainda.</div>';
    $('p-lista').onclick=function(ev){ var b=ev.target.closest('button'); if(!b) return;
      if(b.dataset.ed){ EDIT=b.dataset.ed; vPropostas(); window.scrollTo({top:0,behavior:'smooth'}); }
      if(b.dataset.cp){ var u=location.origin+'/proposta/?p='+b.dataset.cp; try{navigator.clipboard.writeText(u); toast('Link copiado.');}catch(e){prompt('Link:',u);} }
      if(b.dataset.del){ if(b.dataset.ok!=='1'){ b.dataset.ok='1'; b.style.background='var(--erro)'; toast('Clique de novo para excluir.'); return; } post({a:'admin-proposta-del',id:b.dataset.del}).then(function(){ if(EDIT===b.dataset.del) EDIT=''; carrega().then(vPropostas); }); } };
  }

  /* ---------- DIAGNÓSTICOS ---------- */
  function vDiag(){
    var s=new Date(Date.now()-30*864e5).toISOString();
    cabecalho('Diagnósticos','recebidos',[['diag',DIAGS.length,'no total'],['calendar',DIAGS.filter(function(d){return d.data>s;}).length,'nos últimos 30 dias']]);
    $('vista').innerHTML='<section class="card"><div class="card-h"><h2>Todos os diagnósticos</h2><a class="pill" href="/diagnostico/painel/" target="_blank">'+ic('abrir')+'Painel completo</a><a class="pill" href="/diagnostico/" target="_blank">'+ic('link')+'Formulário</a></div><div class="lst">'+
      (DIAGS.length?DIAGS.map(function(d){ var e=emp(d.slug);
        return '<div class="li"><div><span class="tag">'+dt(d.data,1)+(e?' · '+ETAPA[e.etapa][0]:'')+'</span><h4>'+esc(d.empresa)+'</h4><p>'+esc(d.nome||'')+(d.email?' · '+esc(d.email):'')+(d.whatsapp?' · '+esc(d.whatsapp):'')+'</p></div><div class="bts">'+
          (d.token?'<a class="pill" target="_blank" href="/diagnostico/relatorio/?r='+esc(d.token)+'">Relatório</a>':'')+(e?'<button class="pill solid" data-e="'+esc(d.slug)+'">Abrir empresa</button>':'')+'</div></div>'; }).join(''):'<div class="vazio">Nenhum diagnóstico ainda.</div>')+'</div></section>';
    $('vista').onclick=function(ev){ var b=ev.target.closest('[data-e]'); if(b) vai('empresas',b.dataset.e); };
  }

  /* ---------- POSTAGENS ---------- */
  function vPosts(){
    var P=(window.POSTS||[]).slice().sort(function(a,b){return a.data<b.data?1:-1;}), L=linhas();
    cabecalho('Postagens','e blog',[['post',P.length,'posts no blog'],['users',L.filter(function(l){return l.tipo==='post'&&l.clientes.length;}).length,'compartilhados com clientes']]);
    $('vista').innerHTML='<section class="card"><div class="card-h"><h2>Posts do blog</h2><a class="pill" href="/blog/" target="_blank">'+ic('abrir')+'Ver blog</a></div><p class="muted" style="font-size:.8rem;margin:-6px 0 14px">Cada post já é uma linha na tabela de ações. Escolha os clientes aqui ou lá.</p><div class="lst">'+
      P.map(function(p){ var l=L.filter(function(x){return x.link==='/blog/#'+p.slug;})[0]||{clientes:[]};
        return '<div class="li"><div><span class="tag">'+esc(p.categoria||'')+' · '+dt(p.data)+'</span><h4>'+esc(String(p.titulo).replace(/==/g,''))+'</h4><p>'+(l.clientes.length?'Compartilhado com '+(l.todos?'todos':l.clientes.map(nomeEmp).join(', ')):'Ainda não compartilhado')+'</p></div>'+
          '<div class="bts"><a class="pill" target="_blank" href="/blog/#'+esc(p.slug)+'">'+ic('abrir')+'</a><button class="pill solid" data-k="'+esc(chave(l.fonte?l:{fonte:'post',slug_post:p.slug}))+'">'+ic('users')+'Compartilhar</button></div></div>'; }).join('')+'</div></section>';
    $('vista').onclick=function(ev){ var b=ev.target.closest('[data-k]'); if(b){ var l=achar(b.dataset.k); if(l) escolhe(b,l); } };
  }

  /* ---------- VIDEOAULAS e REUNIÕES ---------- */
  function vVideos(){ listaTipo('video','Videoaulas','para os clientes','aula','Nova videoaula','Link do vídeo (YouTube)'); }
  function vReunioes(){ listaTipo('reuniao','Reuniões','e compromissos','reuniao','Nova reunião','Pauta ou link da chamada'); }
  function listaTipo(tp,t1,t2,i,novo,ph){
    var L=linhas().filter(function(l){return l.tipo===tp;}).sort(function(a,b){return String(b.inicio||'').localeCompare(String(a.inicio||''));});
    cabecalho(t1,t2,[[i,L.length,tp==='video'?'videoaulas':'reuniões'],['users',L.filter(function(l){return l.clientes.length;}).length,'com clientes']]);
    $('vista').innerHTML='<div class="grade" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)"><section class="card"><div class="card-h"><h2>'+novo+'</h2></div><form class="form" id="f-tp">'+
      '<div class="campo"><label>Título</label><input name="titulo" required></div><div class="campo"><label>'+ph+'</label><input name="link"></div><div class="campo"><label>Detalhe</label><textarea name="detalhe" style="min-height:70px"></textarea></div>'+
      '<div class="l2"><div class="campo"><label>'+(tp==='reuniao'?'Data e hora':'Data')+'</label><input name="inicio" type="'+(tp==='reuniao'?'datetime-local':'date')+'"></div><div class="campo"><label>Cliente</label><select name="cli"><option value="">Nenhum por enquanto</option><option value="*">Todos os clientes</option>'+(R.empresas||[]).map(function(e){return '<option value="'+esc(e.slug)+'">'+esc(e.nome)+'</option>';}).join('')+'</select></div></div>'+
      '<button class="pill solid">'+ic('mais')+'Criar'+(tp==='reuniao'?' e abrir no Google Agenda':'')+'</button></form></section>'+
      '<section class="card"><div class="card-h"><h2>'+t1+'</h2><button class="pill" data-tab>'+ic('tabela')+'Ver na tabela</button></div><div class="lst">'+(L.length?L.map(function(l){
        return '<div class="li"><div><span class="tag">'+(l.inicio?dt(l.inicio,tp==='reuniao'):'sem data')+' · '+(l.todos?'todos os clientes':l.clientes.map(nomeEmp).join(', ')||'sem cliente')+'</span><h4>'+esc(l.titulo)+'</h4>'+(l.link?'<p><a href="'+esc(l.link)+'" target="_blank">'+esc(l.link)+'</a></p>':'')+'</div>'+
          '<div class="bts"><button class="cbtn" data-ag="'+esc(chave(l))+'" title="Google Agenda">'+ic('reuniao')+'</button><button class="pill" data-cl="'+esc(chave(l))+'">Clientes</button></div></div>'; }).join(''):'<div class="vazio">Nada ainda.</div>')+'</div></section></div>';
    if(window.innerWidth<1100) $('vista').firstChild.style.gridTemplateColumns='1fr';
    $('f-tp').onsubmit=function(ev){ ev.preventDefault(); var f=this, d=f.cli.value;
      var m={titulo:f.titulo.value,link:f.link.value,detalhe:f.detalhe.value,inicio:f.inicio.value,tipo:tp,dono:'unique',destino:d==='*'?'todos':d?[d]:[]};
      post({a:'admin-modelo',modelo:m}).then(function(r){ if(!r.ok){toast(r.erro||'Erro.');return;} toast('Criado.');
        if(tp==='reuniao'){ var e=d&&d!=='*'?emp(d):null; agenda({titulo:m.titulo,detalhe:m.detalhe+(m.link?'\n'+m.link:''),inicio:m.inicio,slug:e?e.slug:'',emails:e?e.usuarios.map(function(u){return u.email;}):[]}); }
        recarregaAcoes(); }); };
    $('vista').onclick=function(ev){ var b=ev.target.closest('button'); if(!b) return;
      if(b.hasAttribute('data-tab')){ FT=tp; vai('acoes'); }
      if(b.dataset.ag){ var l=achar(b.dataset.ag), e=l.clientes.length===1?emp(l.clientes[0]):null; agenda({titulo:l.titulo,detalhe:l.detalhe,inicio:l.inicio,prazo:l.prazo,slug:e?e.slug:'',emails:e?e.usuarios.map(function(u){return u.email;}):[]}); }
      if(b.dataset.cl){ escolhe(b,achar(b.dataset.cl)); } };
  }
