<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaga · Recrutamento por propósito</title>
<meta name="description" content="Uma vaga para quem lê até o fim. Sem currículo: responda, grave o seu vídeo e mostre por que esta vaga deve ser sua.">
<meta property="og:type" content="website">
<meta property="og:title" content="Uma vaga para quem lê até o fim">
<meta property="og:description" content="Sem currículo: responda, grave o seu vídeo e mostre por que esta vaga deve ser sua.">
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&display=swap">
<style>
:root{--bg:#0b0b0f;--bg2:#121218;--bg3:#1a1a22;--line:rgba(255,255,255,.09);--tx:#f4f4f6;--tx2:#b4b4c0;--tx3:#7c7c8a;--acc:#ff5b1f;--acc-t:#fff;--r:18px;
  --f:'Montserrat',system-ui,sans-serif;--mola:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3{line-height:1.05;letter-spacing:-.035em;margin:0;font-weight:800}
b,strong{color:#fff;font-weight:700}
a{color:var(--acc)}
::selection{background:var(--acc);color:var(--acc-t)}
[hidden]{display:none!important}
.in{max-width:1120px;margin:0 auto;padding:0 22px}
.in.estreito{max-width:780px}
.carregando{min-height:100vh;display:grid;place-items:center;color:var(--tx3)}
.previa{position:sticky;top:0;z-index:60;background:#facc15;color:#111;text-align:center;font-weight:700;font-size:14px;padding:10px 16px}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(11,11,15,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .in{display:flex;align-items:center;gap:14px;height:64px}
.nav .emp{display:flex;align-items:center;gap:10px;font-weight:800;color:#fff;text-decoration:none;min-width:0}
.nav .emp img{height:34px;max-width:140px;object-fit:contain}
.nav .emp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .dir{margin-left:auto;display:flex;align-items:center;gap:16px}
.aberto{font-size:.78rem;color:var(--tx2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.aberto i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulsa 2s infinite}
.aberto.fechado i{background:var(--tx3);animation:none}
@keyframes pulsa{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:700;font-size:.9rem;border-radius:999px;padding:14px 24px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:transform .2s var(--mola),box-shadow .2s,background .2s;min-height:48px}
.bt:active{transform:scale(.97)}
.bt.acc{background:var(--acc);color:var(--acc-t);box-shadow:0 10px 30px -10px var(--acc)}
.bt.acc:hover{transform:translateY(-2px);box-shadow:0 16px 36px -10px var(--acc)}
.bt.lin{border-color:rgba(255,255,255,.28);color:#fff;background:rgba(255,255,255,.04)}
.bt.lin:hover{background:rgba(255,255,255,.1)}
.bt.sm{padding:9px 16px;font-size:.8rem;min-height:38px}
.bt:disabled{opacity:.55;cursor:not-allowed;transform:none}
/* hero */
.hero{position:relative;min-height:calc(100svh - 64px);display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero .foto{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2;transform:scale(1.08);animation:zoom 14s ease-out forwards}
@keyframes zoom{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,11,15,.35) 0%,rgba(11,11,15,.55) 45%,var(--bg) 100%),linear-gradient(90deg,rgba(11,11,15,.85),rgba(11,11,15,.1) 70%)}
.hero .in{padding-top:90px;padding-bottom:70px;width:100%}
.olho{display:flex;align-items:center;gap:12px;font-size:.72rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:20px}
.olho::before{content:"";width:28px;height:2px;background:var(--acc)}
.hero h1{font-size:clamp(2.7rem,8.6vw,6.4rem);font-weight:900;text-transform:uppercase;letter-spacing:-.045em;line-height:.92;max-width:12ch;text-wrap:balance}
.hero .sub{font-size:clamp(1.05rem,2.3vw,1.3rem);color:var(--tx2);margin:22px 0 30px;max-width:44ch;line-height:1.5}
.hero .bts{display:flex;gap:12px;flex-wrap:wrap}
.fichas{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.ficha{border:1px solid var(--line);background:rgba(18,18,24,.7);backdrop-filter:blur(8px);border-radius:12px;padding:10px 14px;font-size:.84rem;font-weight:700;line-height:1.35}
.ficha small{display:block;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.ficha.acc small{color:var(--acc)}
/* faixa */
.faixa-wrap{overflow:hidden;padding:26px 0;margin:-34px 0 -26px;position:relative;z-index:3}
.faixa{background:var(--acc);color:var(--acc-t);transform:rotate(-1.6deg);margin:-8px -20px 0;padding:14px 0;overflow:hidden;position:relative;z-index:3;box-shadow:0 20px 50px -20px var(--acc)}
.faixa .trilho{display:flex;width:max-content;animation:rola 32s linear infinite}
.faixa span{font-weight:900;font-size:clamp(.82rem,1.6vw,1rem);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding:0 22px;display:flex;align-items:center;gap:44px}
.faixa span::after{content:"✦"}
@keyframes rola{to{transform:translateX(-50%)}}
/* seções */
.sec{padding:110px 0;position:relative}
.sec.alt{background:var(--bg2)}
.rot{font-size:.72rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:16px;display:block}
.sec h2{font-size:clamp(2rem,4.6vw,3.2rem);margin-bottom:34px;text-wrap:balance}
.missao p{font-size:clamp(1.25rem,2.8vw,1.8rem);font-weight:700;line-height:1.4;letter-spacing:-.02em;color:var(--tx2);margin:0 0 26px}
.missao p:first-of-type{color:#fff}
.missao p b{color:var(--acc)}
.video-vaga{margin-top:40px}
.video-vaga iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:var(--r);background:#000}
.video-vaga small{display:block;color:var(--tx3);margin-top:10px;font-size:.85rem}
.pausa{position:relative;min-height:78vh;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.pausa .foto{position:absolute;inset:-10% 0;background-size:cover;background-position:center;z-index:-2;will-change:transform}
.pausa::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,var(--bg) 0%,rgba(11,11,15,.15) 30%,rgba(11,11,15,.4) 65%,var(--bg) 100%)}
.pausa .in{padding-bottom:90px;width:100%}
.pausa blockquote{margin:0;font-size:clamp(1.9rem,5vw,3.6rem);font-weight:900;letter-spacing:-.04em;line-height:1.02;max-width:15ch;text-wrap:balance;color:#fff}
.pausa blockquote::before{content:"";display:block;width:56px;height:4px;background:var(--acc);margin-bottom:22px}
.tarefas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:t}
.tarefa{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:24px;transition:border-color .25s,transform .25s}
.tarefa:hover{border-color:color-mix(in srgb,var(--acc) 55%,transparent);transform:translateY(-3px)}
.tarefa::before{counter-increment:t;content:counter(t,decimal-leading-zero);display:block;font-weight:900;color:var(--acc);font-size:.9rem;letter-spacing:.1em;margin-bottom:14px}
.tarefa p{margin:0;font-weight:600;line-height:1.5;font-size:.98rem}
.perfil{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:46px;align-items:start}
.perfil .txt p{color:var(--tx2);margin:0 0 20px}
.perfil .txt p b{color:#fff}
.perfil .dica{border-left:3px solid var(--acc);padding:4px 0 4px 18px;color:#fff!important;font-style:italic}
.sinais{background:var(--bg3);border:1px solid var(--line);border-radius:22px;overflow:hidden;position:sticky;top:90px}
.sinais .img{aspect-ratio:16/10;background-size:cover;background-position:center}
.sinais .cx{padding:26px}
.sinais h3{font-size:1.3rem;margin-bottom:18px}
.sinais ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.sinais li{display:flex;gap:12px;align-items:flex-start;font-size:.95rem;line-height:1.5;font-weight:600}
.sinais li i{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--acc);display:grid;place-items:center;margin-top:1px}
.sinais li i svg{width:13px;height:13px;stroke:var(--acc-t);stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .5s .2s}
.sinais.vis li i svg{stroke-dashoffset:0}
.detalhes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.detalhes div{background:var(--bg);padding:22px 24px}
.detalhes small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.detalhes b{font-size:1.05rem}
.sobre-emp{margin-top:34px;color:var(--tx2);max-width:68ch}
.sobre-emp p{margin:0 0 14px}
.ganhos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ganho{display:flex;gap:14px;align-items:flex-start;background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-weight:700;line-height:1.45;font-size:.97rem}
.ganho::before{content:"✦";color:var(--acc);font-size:1rem;line-height:1.4}
.remun{margin-top:22px;border-radius:22px;padding:30px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--bg3)),var(--bg3) 70%);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line))}
.remun small{font-size:.66rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--acc)}
.remun h3{font-size:clamp(1.4rem,3vw,2rem);margin:8px 0 6px}
.remun p{margin:0;color:var(--tx2);font-style:italic}
.escada{display:flex;align-items:flex-end;gap:12px;margin:26px 0 8px}
.escada .d{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.escada .bar{width:100%;border-radius:12px 12px 4px 4px;background:rgba(255,255,255,.16);height:0;transition:height .9s var(--mola)}
.escada .d.fim .bar{background:var(--acc)}
.escada b{font-size:.92rem;font-variant-numeric:tabular-nums}
.escada small{font-size:.6rem;letter-spacing:.14em;color:var(--tx3);white-space:nowrap}
/* processo (motion: linha que se desenha) */
.proc{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.proc svg.linha{position:absolute;left:0;top:27px;width:100%;height:4px;overflow:visible;pointer-events:none}
.proc svg.linha line{stroke-width:2}
.proc .base{stroke:rgba(255,255,255,.14);stroke-dasharray:6 8}
.proc .viva{stroke:var(--acc);stroke-dasharray:1000;stroke-dashoffset:1000;filter:drop-shadow(0 0 6px var(--acc))}
.passo{position:relative;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:78px 22px 24px;opacity:.35;transform:translateY(14px);transition:opacity .5s,transform .6s var(--mola)}
.passo.on{opacity:1;transform:none}
.passo .num{position:absolute;top:8px;left:22px;width:40px;height:40px;border-radius:50%;background:var(--bg);border:2px solid rgba(255,255,255,.2);display:grid;place-items:center;font-weight:900;transition:background .4s,border-color .4s,transform .4s var(--mola)}
.passo.on .num{background:var(--acc);border-color:var(--acc);color:var(--acc-t);transform:scale(1.08)}
.passo h3{font-size:1.15rem;margin-bottom:6px}
.passo p{margin:0;color:var(--tx2);font-size:.92rem;line-height:1.5}
.importante{margin-top:22px;border:1px solid rgba(250,204,21,.35);background:rgba(250,204,21,.07);border-radius:var(--r);padding:22px 24px}
.importante b{color:#facc15}
.importante ul{margin:10px 0 0;padding-left:20px;color:var(--tx2);font-size:.95rem}
.importante li:first-child{color:#fff;font-weight:700}
/* formulário */
.form-sec{background:radial-gradient(1200px 500px at 50% 0,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),var(--bg)}
.etapa-rot{display:inline-flex;align-items:center;gap:10px;font-size:.7rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.etapa-rot .pts{display:flex;gap:5px}.etapa-rot .pts i{width:22px;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}.etapa-rot .pts i.on{background:var(--acc)}
.form-sec h2{margin-bottom:12px}
.form-sec .lead{color:var(--tx2);margin:0 0 30px}
.caixa{background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:30px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.campo{display:grid;gap:7px;margin-bottom:18px}
.campo label{font-size:.82rem;font-weight:700}
.campo label .n{color:var(--acc);margin-right:4px}
.campo input,.campo textarea{font:inherit;font-size:1rem;color:#fff;background:var(--bg);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px 16px;width:100%;transition:border-color .2s,box-shadow .2s}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.campo textarea{min-height:130px;resize:vertical;line-height:1.6}
.cont{font-size:.78rem;color:var(--tx3);text-align:right;margin-top:-10px;margin-bottom:12px}
.cont.ok{color:#22c55e;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.92rem;margin:6px 0 22px;cursor:pointer;line-height:1.5}
.check input{width:20px;height:20px;accent-color:var(--acc);margin-top:2px;flex-shrink:0}
.msg{border-radius:14px;padding:13px 16px;font-size:.92rem;margin-bottom:16px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#fecaca}
.bt.full{width:100%;font-size:1rem;padding:17px}
.etapa2{margin-top:70px;position:relative}
.etapa2.trava .caixa{opacity:.45;filter:saturate(.3);pointer-events:none}
.infos{display:grid;gap:10px;margin:0 0 24px}
.info{display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:.92rem}
.info span{font-size:1.2rem}
.info b{margin-left:4px}
.cadeado{text-align:center;color:var(--acc);font-weight:700;font-size:.88rem;margin-top:16px}
.desafio{font-size:1.1rem;font-weight:700;line-height:1.5;margin:0 0 20px;color:#fff}
.arquivo{display:flex;align-items:center;gap:14px;border:2px dashed rgba(255,255,255,.18);border-radius:16px;padding:18px;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:14px}
.arquivo:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,transparent)}
.arquivo .ic{width:46px;height:46px;border-radius:12px;background:var(--acc);color:var(--acc-t);display:grid;place-items:center;font-size:1.3rem;flex-shrink:0}
.arquivo b{display:block}
.arquivo small{color:var(--tx3)}
.ou{text-align:center;color:var(--tx3);font-size:.8rem;margin:4px 0 14px;letter-spacing:.2em}
.barra-env{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:4px 0 16px}
.barra-env i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
/* sucesso (motion: botão vira check + confete) */
.sucesso{text-align:center;padding:30px 10px 10px;position:relative}
.sucesso .bola{width:92px;height:92px;border-radius:50%;margin:0 auto 22px;background:var(--acc);display:grid;place-items:center;animation:pop .6s var(--mola) both}
.sucesso .bola svg{width:44px;height:44px;stroke:var(--acc-t);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:risca .45s .35s forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes risca{to{stroke-dashoffset:0}}
.sucesso h3{font-size:clamp(1.6rem,4vw,2.2rem);margin-bottom:8px}
.sucesso p{color:var(--tx2);max-width:44ch;margin:0 auto}
.confete{position:fixed;inset:0;pointer-events:none;z-index:90}
/* final */
.final{text-align:center;padding:130px 0}
.final h2{font-size:clamp(2.2rem,6vw,4.2rem);font-weight:900;max-width:16ch;margin:0 auto 30px;letter-spacing:-.045em}
.rodape{border-top:1px solid var(--line);padding:26px 0;font-size:.8rem;color:var(--tx3)}
.rodape .in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rodape a{color:var(--tx2)}
.fechada{text-align:center;padding:40px 10px}
/* revelar ao rolar */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.vis{opacity:1;transform:none}
@media (max-width:860px){
  .tarefas{grid-template-columns:1fr 1fr}.perfil{grid-template-columns:1fr}.sinais{position:static}
  .ganhos{grid-template-columns:1fr}.proc{grid-template-columns:1fr}.proc svg.linha{display:none}.passo{opacity:1;transform:none}
}
@media (max-width:600px){
  body{font-size:16px}.sec{padding:76px 0}.hero .bts .bt{white-space:nowrap;padding:14px 16px;font-size:.86rem}.tarefas{grid-template-columns:1fr}.g2{grid-template-columns:1fr;gap:0}
  .caixa{padding:20px}.hero .in{padding-bottom:50px}.aberto{display:none}.hero .bts .bt{flex:1}
  .pausa{min-height:62vh}.final{padding:90px 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}.passo{opacity:1;transform:none}.hero .foto{transform:none}.sinais li i svg{stroke-dashoffset:0}
}
</style>
</head>
<body>
<div id="pg" class="carregando">Carregando a vaga…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/vagas/assets/vg.js"></script>
<script>
(async function(){
  var sb=VG.sb, esc=VG.esc, pg=document.getElementById('pg');
  var slug=(location.pathname.match(/\/vagas\/v\/([a-z0-9-]+)/)||[])[1]||new URLSearchParams(location.search).get('s')||'';
  var r=slug?await sb.from('vg_vagas').select('*').eq('slug',slug).maybeSingle():{data:null};
  var V=r.data;
  if(!V){ pg.innerHTML='<div class="in" style="text-align:center"><h1 style="font-size:2.4rem;margin-bottom:12px">Esta vaga não está disponível</h1><p>Ela pode ter sido encerrada. Obrigado pelo interesse!</p></div>'; return; }
  pg.className='';
  var an=VG.ANALOGIAS[V.analogia]||VG.ANALOGIAS.atleta;
  var acc=an.cor||'#ff5b1f';
  function luz(h){ var n=parseInt(h.slice(1),16), rr=n>>16&255, gg=n>>8&255, bb=n&255; return (0.299*rr+0.587*gg+0.114*bb)/255; }
  document.documentElement.style.setProperty('--acc',acc);
  document.documentElement.style.setProperty('--acc-t',luz(acc)>.62?'#0b0b0f':'#fff');
  var limpo=function(t){ return String(t||'').replace(/\*\*/g,'').replace(/\{empresa\}/gi,V.empresa_nome||'').replace(/\{cargo\}/gi,V.cargo_real||''); };
  document.title=limpo(V.titulo||'Vaga')+' · '+(V.empresa_nome||'');
  var aberta=V.status==='publicada';
  if(aberta) sb.rpc('vg_visita',{s:slug});
  var F=function(i){ return '/vagas/assets/fotos/'+(an.fotos||['atleta-1','atleta-2','atleta-3'])[i]+'.webp'; };
  function tx(t){ return VG.texto(t,V); }
  function par(t){ return String(t||'').split(/\n\s*\n/).filter(function(x){return x.trim();}).map(function(x){return '<p>'+tx(x.trim()).replace(/\n/g,'<br>')+'</p>';}).join(''); }
  var EMP=esc(V.empresa_nome||'');

    ((V.encerramento&&aberta)?'<section class="final" id="final"><div class="in"><h2 class="rv">'+tx(V.encerramento)+'</h2><a class="bt acc rv" href="#candidatura">Começar agora</a></div></section>':'')+

  /* ---------- motion ---------- */
  var reduz=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(!e.isIntersecting) return; e.target.classList.add('vis'); io.unobserve(e.target); }); },{threshold:.15,rootMargin:'0px 0px -40px 0px'});

      var t0=null; function anda(t){ if(!t0) t0=t; var k=Math.min(1,(t-t0)/2400), e=1-Math.pow(1-k,3);
        viva.style.strokeDashoffset=1000*(1-e); passos.forEach(function(p,i){ if(e>=i/2.05) p.classList.add('on'); }); if(k<1) requestAnimationFrame(anda); }
      requestAnimationFrame(anda); },{threshold:.35}).observe(proc); }
  // sinais: os checks se desenham
  var sn=document.querySelector('[data-sinais]'); if(sn) new IntersectionObserver(function(es,o){ if(es[0].isIntersecting){ sn.classList.add('vis'); o.disconnect(); } },{threshold:.3}).observe(sn);
  // parallax leve na foto de pausa
  var px=document.querySelector('[data-parallax]');
  if(px&&!reduz){ var tick=false; addEventListener('scroll',function(){ if(tick) return; tick=true; requestAnimationFrame(function(){ var r=px.parentNode.getBoundingClientRect(); var k=(r.top+r.height/2-innerHeight/2)/innerHeight; px.style.transform='translateY('+(k*-60)+'px)'; tick=false; }); },{passive:true}); }

  if(!aberta) return;

  $('f1').onsubmit=async function(ev){

    if(d.nome.length<2||!d.whatsapp) return erro('m1','Preencha seu nome e WhatsApp.');

    cand={id:res.data.id,token:res.data.token,nome:d.nome.split(' ')[0]}; try{ sessionStorage.setItem(CH,JSON.stringify(cand)); }catch(e){}
    libera(true);
  };

  /* ---------- etapa 2 ---------- */
  var arq=null;
  $('c-vid').onchange=function(){ arq=this.files[0]||null; $('arq-nome').textContent=arq?arq.name:'Escolher o vídeo do celular'; };
  $('b2').onclick=async function(){
    erro('m2','');
    if(!cand) return erro('m2','Responda a Etapa 1 primeiro.');

    var b=this; b.disabled=true; var caminho=null;
    try{
      if(arq){
        b.textContent='Enviando o vídeo… não feche a página'; var pr=$('prog'); pr.hidden=false; var pi=pr.firstChild, p=5;
        var falso=setInterval(function(){ p=Math.min(92,p+(92-p)*.06); pi.style.width=p+'%'; },400);
        var ext=(arq.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'mp4';
        caminho=V.id+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))+'.'+ext;

    var fn=$('final'); if(fn) fn.hidden=true;

  // confete com semente fixa (mesmo desenho sempre)
  function confete(){
    var c=document.createElement('canvas'); c.className='confete'; document.body.appendChild(c);
    var dpr=devicePixelRatio||1; c.width=innerWidth*dpr; c.height=innerHeight*dpr; var g=c.getContext('2d'); g.scale(dpr,dpr);
    var s=7; function rnd(){ s=(s*16807)%2147483647; return s/2147483647; }
    var bola=document.querySelector('.sucesso .bola').getBoundingClientRect(), ox=bola.left+bola.width/2, oy=bola.top+bola.height/2;
    var cores=[acc,'#ffffff','#22c55e','#facc15'], P=[];
    for(var i=0;i<44;i++){ var a=rnd()*Math.PI*2, v=4+rnd()*7; P.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:rnd()*6.28,vr:(rnd()-.5)*.4,w:6+rnd()*6,h:4+rnd()*4,c:cores[i%4]}); }
    var t0=performance.now();
    (function q(t){ var k=(t-t0)/1800; g.clearRect(0,0,innerWidth,innerHeight);
      P.forEach(function(p){ p.vy+=.28; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; g.save(); g.globalAlpha=Math.max(0,1-k); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); });
      if(k<1) requestAnimationFrame(q); else c.remove(); })(t0);
  }
})();
