<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="/assets/tema.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Relatório Comercial · Unique</title>
<meta name="description" content="Retrato comercial da sua empresa e plano de ação. Unique Consultoria Comercial.">
<meta property="og:title" content="Seu Diagnóstico Comercial · Unique">
<meta property="og:description" content="O retrato do seu comercial nos 4 pilares e um plano de ação prático.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:image" content="https://sejaunique.vercel.app/assets/og-site.jpg">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Relatório Unique: painel em cartões brancos sobre cinza-claro (mesmo visual do formulário); preto da marca só no topo e no fechamento; verde para o que está bom, âmbar para atenção, magenta para crítico, sempre com rótulo. */
:root{
  --bg:#efede8;--card:#ffffff;--t-papel:#efede8;--t-amarelo:#fbf0d2;--t-azul:#e2ecf8;--t-verde:#e0f2e7;--t-rosa:#f9e3e5;--t-lilas:#ebe7f6;--t-laranja:#fde9d6;--pontos:#1d1d1f;--fg:#18181b;--resp:#4f4f57;--muted:#8e8e96;--line:#e6e6ea;--soft:#f7f7f9;
  --marca:#000000;--marca-fg:#f5f5f5;--grifo:#8ef5c0;
  --dado:#12a65a;--dado-fill:rgba(18,166,90,.14);--grade:#e3e3e8;
  --alto:#12a65a;--alto-bg:#e8f8ef;--medio:#a86b00;--medio-bg:#fff4d6;--baixo:#c2185b;--baixo-bg:#fde8f0;
  --focus:#c2185b;--sombra:0 1px 2px rgba(20,20,30,.04),0 8px 24px rgba(20,20,30,.05);
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111113;--t-papel:#111113;--t-amarelo:#221d10;--t-azul:#111b27;--t-verde:#10201a;--t-rosa:#24141a;--t-lilas:#1a1726;--t-laranja:#241a10;--pontos:#f2f2f4;--card:#141417;--fg:#f2f2f4;--resp:#b9b9c0;--muted:#7c7c84;--line:#26262b;--soft:#1a1a1e;--grifo:#0e7a45;
  --dado:#3ddc84;--dado-fill:rgba(61,220,132,.16);--grade:#2a2a30;
  --alto:#3ddc84;--alto-bg:#0f2a1c;--medio:#f2c14e;--medio-bg:#2e2410;--baixo:#ff6b9d;--baixo-bg:#33131f;--focus:#ff6b9d;--sombra:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113;--t-papel:#111113;--t-amarelo:#221d10;--t-azul:#111b27;--t-verde:#10201a;--t-rosa:#24141a;--t-lilas:#1a1726;--t-laranja:#241a10;--pontos:#f2f2f4;--card:#141417;--fg:#f2f2f4;--resp:#b9b9c0;--muted:#7c7c84;--line:#26262b;--soft:#1a1a1e;--grifo:#0e7a45;
  --dado:#3ddc84;--dado-fill:rgba(61,220,132,.16);--grade:#2a2a30;
  --alto:#3ddc84;--alto-bg:#0f2a1c;--medio:#f2c14e;--medio-bg:#2e2410;--baixo:#ff6b9d;--baixo-bg:#33131f;--focus:#ff6b9d;--sombra:none;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.eyebrow{font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.3em;color:var(--muted)}
.grifo{background:none;color:inherit;padding:0;text-decoration:underline;text-decoration-color:var(--grifo);text-decoration-thickness:max(2px,.06em);text-underline-offset:.16em;text-decoration-skip-ink:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sombra)}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--marca);color:var(--marca-fg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:58px}
.top .brand{display:flex}.top .brand svg{height:15px;width:auto}
.top .tag{font-size:.66rem;font-weight:500;text-transform:uppercase;letter-spacing:.3em;opacity:.65}
.navsec{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navsec .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.navsec a{flex:none;text-decoration:none;font-size:.8rem;font-weight:500;color:var(--resp);padding:7px 14px;border-radius:999px;border:1px solid transparent}
.navsec a:hover,.navsec a.on{background:var(--card);border-color:var(--line);color:var(--fg)}

main{display:block}
#app>.estado{margin:28px 16px}
section{display:grid;gap:16px}
.sec-head{display:grid;gap:6px;margin-top:12px}
.sec-head h2{margin:0;font-size:clamp(1.4rem,3.6vw,1.85rem);font-weight:700;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.sec-head p{margin:0;color:var(--muted);font-style:italic;max-width:62ch}

/* abertura */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px}
.hero-txt{padding:30px 30px 28px;display:grid;gap:18px;align-content:start}
.hero-txt h1{margin:0;font-size:clamp(1.8rem,4.6vw,2.6rem);font-weight:700;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.score{display:flex;gap:22px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .v b{font-size:2.6rem;font-weight:800;letter-spacing:-.04em}
.ring .v small{display:block;font-size:.72rem;color:var(--muted);margin-top:4px}
.estagio{display:grid;gap:6px}
.estagio strong{font-size:1.1rem}
.estagio p{margin:0;color:var(--resp);font-size:.93rem;line-height:1.55}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.alto{color:var(--alto);background:var(--alto-bg)}
.chip.medio{color:var(--medio);background:var(--medio-bg)}
.chip.baixo{color:var(--baixo);background:var(--baixo-bg)}
.meta-emp{display:flex;flex-wrap:wrap;gap:8px}
.meta-emp span{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.radar-card{padding:20px 16px 14px;display:grid;gap:4px;position:relative}
.radar-card .eyebrow{padding-left:8px}
#radar{width:100%;height:auto;display:block;max-width:440px;margin:0 auto;overflow:visible}
#radar .eixo{cursor:pointer}
#radar text{font-family:var(--font)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--card);font-size:.78rem;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .12s;z-index:3}
.tip.on{opacity:1}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{padding:18px 18px 16px;display:grid;gap:4px;align-content:start}
.kpi .k{font-size:.74rem;color:var(--muted);font-weight:500}
.kpi .v{font-size:1.6rem;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.kpi .v.txt{font-size:1.15rem;line-height:1.3;letter-spacing:-.01em}
.kpi .v small{font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi .s{font-size:.78rem;color:var(--resp);line-height:1.4}

/* barras dos pilares */
.barras{padding:22px 24px;display:grid;gap:14px}
.barra{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:14px;align-items:center;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;border-radius:8px}
.barra:hover .trilho{background:var(--line)}
.barra .n{font-size:.92rem;font-weight:600}
.barra .n small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.trilho{height:10px;border-radius:6px;background:var(--soft);position:relative;overflow:hidden;transition:background .15s}
.trilho i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--dado);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.trilho i.baixo{background:var(--baixo)}.trilho i.medio{background:var(--medio)}
.barra .val{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-weight:700;font-size:.95rem}

/* leitura */
.leitura{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lt{padding:20px 22px;display:grid;gap:8px;align-content:start}
.lt .eyebrow{display:flex;align-items:center;gap:8px}
.lt h3{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.lt p{margin:0;color:var(--resp);font-size:.9rem;line-height:1.55}
.consultor{padding:22px 24px;display:grid;gap:12px}
.consultor ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.consultor li{display:flex;gap:12px;color:var(--resp);font-size:.95rem;line-height:1.55}
.consultor li svg{color:var(--muted);margin-top:3px}

/* pilares (abas) */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-size:.84rem;font-weight:500;color:var(--resp);cursor:pointer}
.tab b{font-weight:700;color:var(--fg)}
.tab[aria-selected="true"]{background:var(--fg);border-color:var(--fg);color:var(--card)}
.tab[aria-selected="true"] b{color:var(--card)}
.painel{padding:26px 26px 22px;display:grid;gap:22px}
.p-cab{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-start}
.p-cab h3{margin:0 0 4px;font-size:1.5rem;font-weight:700;letter-spacing:-.025em}
.p-cab p{margin:0;color:var(--muted);font-style:italic;max-width:56ch}
.p-nota{text-align:right}
.p-nota b{font-size:2.2rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.p-nota small{color:var(--muted)}
.itens{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line)}
.item button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:14px;align-items:center;background:none;border:0;padding:13px 2px;text-align:left;cursor:pointer;font-size:.93rem}
.item button[disabled]{cursor:default}
.item .seta{color:var(--muted);transition:transform .2s}
.item.aberto .seta{transform:rotate(90deg)}
.item .cons{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--soft);color:var(--resp);font-size:.88rem;line-height:1.55}
.resp{font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.resp.ok{color:var(--alto);background:var(--alto-bg)}
.resp.parte{color:var(--medio);background:var(--medio-bg)}
.resp.falta{color:var(--baixo);background:var(--baixo-bg)}
.resp.info{color:var(--resp);background:var(--soft)}
.duas-acoes h4{margin:0 0 10px;font-size:.78rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.duas-acoes .grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acao-mini{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px;align-content:start;background:var(--soft)}
.acao-mini strong{font-size:.96rem}
.acao-mini span{font-size:.82rem;color:var(--resp)}
.acao-mini a{font-size:.8rem;font-weight:600;color:var(--fg);text-underline-offset:3px}

/* travando x funcionando */
.dois{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lista{padding:22px 24px;display:grid;gap:14px;align-content:start}
.lista h3{margin:0;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.lista ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.lista li{display:grid;gap:2px;padding-left:18px;position:relative;font-size:.9rem;color:var(--resp);line-height:1.5}
.lista li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--cor)}
.lista li strong{color:var(--fg);font-weight:600}
.lista li small{color:var(--muted);font-size:.74rem}
.lista.ruim{--cor:var(--baixo)}.lista.bom{--cor:var(--alto)}
.vazio{color:var(--muted);font-style:italic;font-size:.9rem}

/* autoavaliação */
.auto{padding:22px 24px;display:grid;gap:18px}
.av{display:grid;gap:8px}
.av .l{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;font-weight:600}
.av .l span{font-weight:500;color:var(--muted);font-size:.82rem}
.escala10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.escala10 i{height:10px;border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.escala10 i.on{background:var(--fg);border-color:var(--fg)}
.av p{margin:0;font-size:.84rem;color:var(--resp);font-style:italic}
.palavras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fala{padding:22px 24px;display:grid;gap:10px;align-content:start}
.fala blockquote{margin:0;font-size:1.02rem;line-height:1.55;color:var(--fg);font-style:italic}
.fala blockquote::before{content:"“";display:block;font-size:2.4rem;line-height:.6;color:var(--dado);font-style:normal;font-weight:700;margin-bottom:6px}

/* plano */
.plano-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtro{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.8rem;font-weight:500;color:var(--resp);cursor:pointer}
.filtro[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--card)}
.progresso{display:flex;align-items:center;gap:12px;font-size:.84rem;color:var(--resp)}
.progresso .trilho{width:140px}
.acoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acao{padding:20px 22px;display:grid;gap:12px;align-content:start;transition:opacity .2s}
.acao.feita{opacity:.6}
.acao.feita h3{text-decoration:line-through;text-decoration-thickness:1px}
.acao .a-cab{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.acao .area{font-size:.68rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.acao h3{margin:2px 0 0;font-size:1.08rem;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.acao .porque{margin:0;font-size:.84rem;color:var(--muted);font-style:italic}
.acao ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.9rem;color:var(--resp);line-height:1.5}
.acao .rodape{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.acao .tags{display:flex;flex-wrap:wrap;gap:6px}
.etq{font-size:.74rem;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--resp);border:1px solid var(--line)}
.feito{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;cursor:pointer;user-select:none}
.feito input{width:18px;height:18px;accent-color:var(--dado);cursor:pointer}

/* fechamento */
.cta{background:var(--marca);color:var(--marca-fg);border-radius:24px;padding:36px 32px;display:grid;gap:14px}
.cta h2{margin:0;font-size:clamp(1.5rem,4vw,2.1rem);font-weight:700;letter-spacing:-.03em;line-height:1.12;max-width:24ch;text-wrap:balance}
.cta p{margin:0;color:#a1a1a8;max-width:56ch}
.cta .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:14px 24px;font-size:.88rem;font-weight:600;text-decoration:none;border:1px solid currentColor;cursor:pointer;background:none}
.btn.solid{background:#f5f5f5;color:#000;border-color:#f5f5f5}
.cta .btn:not(.solid){color:#f5f5f5;border-color:#3a3a40}
.assina{color:var(--muted);font-size:.78rem;text-align:center}

.estado{padding:48px 28px;text-align:center;display:grid;gap:10px;justify-items:center}
.estado h1{margin:0;font-size:1.4rem}
.estado p{margin:0;color:var(--muted);max-width:44ch}



/* oferta Alda.CRM: identidade da marca Alda (amarelo do pato, laranja do bico, grafite, Poppins) */
.alda{--a-amarelo:#fdd015;--a-laranja:#f49f1c;--a-grafite:#2e2e2e;--a-texto:#4a4a4a;
  font-family:"Poppins",var(--font);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;background:#ffffff;color:var(--a-grafite);border-radius:24px;padding:38px 36px 84px 40px;position:relative;overflow:hidden;margin-bottom:20px;isolation:isolate}
.alda::before{content:"";position:absolute;z-index:-1;right:-120px;top:-140px;width:520px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(253,208,21,.55),rgba(253,208,21,0))}
.alda::after{content:"";position:absolute;z-index:-1;right:10%;bottom:-180px;width:460px;height:300px;border-radius:50%;background:radial-gradient(closest-side,rgba(253,208,21,.35),rgba(253,208,21,0))}
.alda-caco{position:absolute;z-index:-1;left:0;bottom:0;width:74px;height:70px;background:linear-gradient(160deg,var(--a-amarelo) 0 45%,var(--a-laranja) 45% 60%,#ffc21a 60%);clip-path:polygon(0 18%,22% 0,100% 100%,0 100%)}
.alda-cab{display:grid;gap:14px;align-content:start;position:relative}
.alda-selo{justify-self:start;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--a-grafite);background:var(--a-amarelo);padding:6px 14px;border-radius:6px}
.alda-logo{width:190px;height:auto;display:block;margin:2px 0}
.alda h2{margin:0;font-family:"Poppins",var(--font);font-size:clamp(1.35rem,3vw,1.8rem);font-weight:700;letter-spacing:-.01em;line-height:1.18;color:var(--a-grafite);text-wrap:balance;max-width:20ch}
.alda p{margin:0;color:var(--a-texto);max-width:44ch;font-size:.98rem;line-height:1.6}
.alda .alda-assina{font-size:.8rem;color:#8a8a8a}
.alda-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.alda .btn{font-family:"Poppins",var(--font);font-weight:600;border-radius:10px}
.alda .btn.alda-btn{background:var(--a-amarelo);border-color:var(--a-amarelo);color:var(--a-grafite);box-shadow:0 6px 0 #e3b800}
.alda .btn.alda-btn:hover{opacity:1;transform:translateY(-2px);box-shadow:0 8px 0 #e3b800}
.alda .btn.alda-link{color:var(--a-grafite);border-color:#e2e2e2;background:#fff}
.alda-lista{display:grid;gap:12px;align-content:start;position:relative}
.alda-eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8a8a8a}
.alda-lista ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}

.vis .entra{opacity:0;transform:translateY(26px) scale(.985);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}

.arte .traca polyline{stroke-dasharray:1;stroke-dashoffset:1}
.arte .traca polygon,.arte .tique{opacity:0}
.arte.viva .traca polyline{animation:desenha 1.1s .2s cubic-bezier(.6,.1,.2,1) forwards}
.arte.viva .traca polygon{animation:aparece .3s 1.2s forwards}
.arte .tique{stroke-dasharray:1;stroke-dashoffset:1}
.arte.viva .tique{animation:desenha .45s calc(.5s + var(--i)*.35s) ease forwards,aparece .01s calc(.5s + var(--i)*.35s) forwards}
.arte .gira{transform-box:fill-box;transform-origin:center;animation:gira 14s linear infinite}
.arte .gira-r>g,.arte .gira-r>path{transform-box:fill-box;transform-origin:center;animation:gira 9s linear infinite reverse}
.arte .pulsa{transform-box:fill-box;transform-origin:center;animation:pulsa 4s ease-in-out infinite}
.arte .sobe rect{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}
.arte.viva .sobe rect{animation:sobe .8s cubic-bezier(.2,.8,.2,1) forwards}
.arte.viva .sobe rect:nth-child(2){animation-delay:.12s}.arte.viva .sobe rect:nth-child(3){animation-delay:.24s}.arte.viva .sobe rect:nth-child(4){animation-delay:.36s}
.arte .cai{animation:cai 2.6s ease-in infinite}
.arte .pinga{animation:pinga 2.6s ease-in infinite}
.arte .lupa{transform-box:fill-box;transform-origin:80% 20%;animation:lupa 5s ease-in-out infinite}
.arte .lapis{animation:lapis 3s ease-in-out infinite}
.arte .bandeira path:last-child{transform-box:fill-box;transform-origin:left;animation:bandeira 1.6s ease-in-out infinite}
.arte .foguete{animation:flutua 3s ease-in-out infinite}
.arte .fogo{transform-box:fill-box;transform-origin:top;animation:fogo .25s ease-in-out infinite alternate}
.arte .balanca{transform-box:fill-box;transform-origin:bottom;animation:balanca 2.4s ease-in-out infinite}
@keyframes desenha{to{stroke-dashoffset:0}}
@keyframes aparece{to{opacity:1}}
@keyframes gira{to{transform:rotate(360deg)}}

@keyframes fogo{to{transform:scaleY(1.35)}}

    /* autoavaliação e palavras */

    var ICA={funil:'<path d="M4 5h16l-6 8v6l-4 2v-8z"/>',auto:'<path d="M4 12a8 8 0 0 1 14-5.3M20 4v4h-4M20 12a8 8 0 0 1-14 5.3M4 20v-4h4"/>',disparo:'<path d="M4 12l16-8-6 16-3-7z"/>',central:'<path d="M5 18v-6a7 7 0 0 1 14 0v6"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/>',ia:'<rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/>'};
    var txtAlda='Olá, Carlos! Vi o relatório do diagnóstico da '+A.empresa+' e quero conhecer o Alda.CRM.';
    h+='<section class="alda" aria-labelledby="alda-t"><div class="alda-cab"><span class="alda-selo">'+esc(ALDA.selo)+'</span>'+
      '<img class="alda-logo" src="/diagnostico/relatorio/alda-logo.png" alt="Alda CRM" width="520" height="203"><h2 id="alda-t">Atendimento e CRM em um só lugar para tirar este plano do papel</h2>'+
      '<p>'+esc(ALDA.oferta)+'</p><p class="alda-assina">Implantado pela Unique Consultoria Comercial</p><div class="alda-acts"><a class="btn alda-btn" href="https://wa.me/'+WHATS+'?text='+encodeURIComponent(txtAlda)+'" target="_blank" rel="noopener">'+esc(ALDA.botao)+'</a><a class="btn alda-link" href="'+ALDA.site+'" target="_blank" rel="noopener">Ver o site</a></div></div>'+
      '<div class="alda-lista"><span class="alda-eyebrow">No seu diagnóstico, o Alda ajuda em</span><ul>'+resolve.slice(0,4).map(function(x){ return '<li><span class="alda-ic"><svg class="icon" viewBox="0 0 24 24">'+ICA[x[0]]+'</svg></span><div><strong>'+esc(x[1])+'</strong><span>'+esc(x[2])+'</span></div></li>'; }).join('')+'</ul></div><img class="alda-pato" src="/diagnostico/relatorio/alda-pato.png" alt="" aria-hidden="true" width="134" height="238"><span class="alda-caco" aria-hidden="true"></span></section>';

    /* fechamento */
    var txt='Olá, Carlos! Vi o relatório do diagnóstico da '+A.empresa+' e quero conversar sobre o plano de ação.';
    h+='<section class="cta"><div class="cta-txt"><span class="eyebrow" style="color:#8e8e96">Próximo passo</span><h2>Quer colocar esse plano em prática com a Unique?</h2>'+

      '<figure class="cta-foto"><img src="/assets/carlos-hero.jpg" alt="Carlos Ribeiro, fundador da Unique" width="880" height="1020" loading="lazy"><figcaption><strong>Carlos Ribeiro</strong>Fundador da Unique · criador do Método CRM</figcaption></figure></section>'+
      '<p class="assina">Relatório gerado pela Unique Inteligência Comercial a partir das respostas do diagnóstico. As notas refletem as respostas, e não uma auditoria da operação.</p>';

    $('#app').innerHTML=h; $('#navsec').hidden=false;
    radar(todos);

    if(window.UniqueVisual) try{ window.UniqueVisual.montar(); }catch(e){ console.error(e); }
    (function(){ setTimeout(function(){
      if(!window.UniqueVisual) document.querySelectorAll('.trilho i[data-w]').forEach(function(i){ i.style.width=i.dataset.w+'%'; });

    /* interações */

    $('.tabs').addEventListener('keydown',function(e){ if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return; var t=document.querySelectorAll('.tab'), i=[].indexOf.call(t,document.activeElement); if(i<0) return; i=(i+(e.key==='ArrowRight'?1:-1)+t.length)%t.length; t[i].focus(); painel(todos,i); });
    document.querySelectorAll('.filtro').forEach(function(b){ b.onclick=function(){ filtrar(b.dataset.f); }; });

    progresso();
    var links=[].slice.call(document.querySelectorAll('.navsec a'));
    if('IntersectionObserver' in window){ var io=new IntersectionObserver(function(en){ en.forEach(function(x){ if(x.isIntersecting){ links.forEach(function(l){ l.classList.toggle('on',l.getAttribute('href')==='#'+x.target.id); }); } }); },{rootMargin:'-40% 0px -55% 0px'}); document.querySelectorAll('main section[id]').forEach(function(s){ io.observe(s); }); }
  }

  function kpi(k,v,s){ var txt=!/class="num"/.test(v) && v.replace(/<[^>]+>/g,'').length>8; return '<div class="card kpi"><span class="k">'+k+'</span><span class="v'+(txt?' txt':'')+'">'+v+'</span>'+(s?'<span class="s">'+s+'</span>':'')+'</div>'; }
  function lt(ic,t,v,p){ return '<div class="card lt"><span class="eyebrow">'+ic+esc(t)+'</span><h3>'+esc(v)+'</h3><p>'+esc(p)+'</p></div>'; }

  function painel(todos,i){
    var p=todos[i], est=p.id==='estrutura';
    document.querySelectorAll('.tab').forEach(function(t,k){ t.setAttribute('aria-selected',String(k===i)); t.tabIndex=k===i?0:-1; });
    $('#painel').setAttribute('aria-labelledby','tab-'+i);
    var h='<div class="p-cab"><div><h3>'+esc(p.nome)+'</h3><p>'+esc(p.def)+'</p>'+(p.id==='prospeccao'&&p.quem?'<p style="font-style:normal;margin-top:8px;color:var(--resp)">Quem prospecta hoje: <strong>'+esc(p.quem)+'</strong></p>':'')+'</div><div class="p-nota"><b class="num">'+p.nota+'</b><small>/100</small><div>'+chip(p.nivel)+'</div></div></div>'+
      '<ul class="itens">'+p.itens.map(function(it,k){
        var fraco=est?it.pts<2:it.pts<20;
        return '<li class="item"><button type="button" aria-expanded="false"'+(fraco?' data-cons="'+k+'"':' disabled')+'><span>'+esc(it.t)+(est?'<small style="display:block;color:var(--muted);font-size:.76rem">'+esc(it.resp)+'</small>':'')+'</span>'+respChip(it,est)+(fraco?ICON.seta:'<span></span>')+'</button>'+(fraco?'<p class="cons" hidden>'+esc(it.c)+'</p>':'')+'</li>';
      }).join('')+'</ul>'+
      '<div class="duas-acoes"><h4>Ações para este pilar</h4><div class="grade">'+p.acoes.map(function(a){ return '<div class="acao-mini"><strong>'+esc(a.titulo)+'</strong><span>Prazo: '+esc(a.prazo)+' · Medir: '+esc(a.medir)+'</span><a href="#plano" data-filtro="'+p.id+'">Ver passo a passo</a></div>'; }).join('')+'</div></div>';
    $('#painel').innerHTML=h;
    $('#painel').querySelectorAll('[data-cons]').forEach(function(b){ b.onclick=function(){ var li=b.parentNode, c=li.querySelector('.cons'), ab=c.hidden; c.hidden=!ab; li.classList.toggle('aberto',ab); b.setAttribute('aria-expanded',String(ab)); }; });
    $('#painel').querySelectorAll('[data-filtro]').forEach(function(a){ a.onclick=function(){ filtrar(a.dataset.filtro); }; });
    radarDestaque(i);

  function abrir(todos,i){ painel(todos,i); document.getElementById('pilar-detalhe').scrollIntoView({behavior:'smooth'}); }
  function filtrar(f){
    document.querySelectorAll('.filtro').forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.f===f)); });
    document.querySelectorAll('.acao').forEach(function(a){ a.hidden=!!f && a.dataset.area!==f; });
  }
  function marcar(c){ c.closest('.acao').classList.toggle('feita',c.checked); }
  function progresso(){
    var t=document.querySelectorAll('.feito input'), n=[].filter.call(t,function(c){return c.checked;}).length;
    $('#prog-txt').textContent=n+' de '+t.length+' concluídas'; $('#prog-bar').style.width=(n/t.length*100)+'%';
  }

  /* radar: 5 eixos, anéis em 25/50/75/100, uma série (as notas), ponto clicável com dica */
  var RD={};
  function radar(todos){
    var svg=$('#radar'), cx=220, cy=192, r=118, n=todos.length, ns='http://www.w3.org/2000/svg', h='';
    function pt(i,v){ var ang=-Math.PI/2+i*2*Math.PI/n; return [cx+Math.cos(ang)*r*v/100, cy+Math.sin(ang)*r*v/100]; }
    [25,50,75,100].forEach(function(v){ h+='<polygon points="'+todos.map(function(_,i){return pt(i,v).join(',');}).join(' ')+'" fill="none" stroke="var(--grade)" stroke-width="1"/>'; });
    todos.forEach(function(_,i){ var p=pt(i,100); h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--grade)" stroke-width="1"/>'; });
    [50,100].forEach(function(v){ var p=pt(0,v); h+='<text x="'+(p[0]+6)+'" y="'+(p[1]+4)+'" font-size="10" fill="var(--muted)">'+v+'</text>'; });
    h+='<polygon id="rd-area" points="'+todos.map(function(_,i){return pt(i,0).join(',');}).join(' ')+'" fill="var(--dado-fill)" stroke="var(--dado)" stroke-width="2" stroke-linejoin="round"/>';
    todos.forEach(function(p,i){
      var e=pt(i,128), anc=Math.abs(e[0]-cx)<10?'middle':(e[0]>cx?'start':'end');
      var dy=e[1]<cy-60?-6:e[1]>cy+40?16:4;
      h+='<g class="eixo" data-i="'+i+'" tabindex="0" role="button" aria-label="'+esc(p.nome)+': '+p.nota+' de 100">'+
        '<text x="'+e[0]+'" y="'+(e[1]+dy)+'" text-anchor="'+anc+'" font-size="13" font-weight="600" fill="var(--fg)">'+esc(p.id==='estrutura'?'Estrutura':p.nome)+'</text>'+
        '<text x="'+e[0]+'" y="'+(e[1]+dy+16)+'" text-anchor="'+anc+'" font-size="12" fill="var(--muted)">'+p.nota+'/100</text>'+
        '<circle class="rd-pt" cx="'+pt(i,0)[0]+'" cy="'+pt(i,0)[1]+'" r="5" fill="var(--dado)" stroke="var(--card)" stroke-width="2"/>'+
        '<circle class="rd-hit" cx="'+pt(i,Math.max(p.nota,8))[0]+'" cy="'+pt(i,Math.max(p.nota,8))[1]+'" r="16" fill="transparent"/></g>';
    });
    svg.innerHTML=h;
    RD={svg:svg,todos:todos,pt:pt};
    // anima de 0 até a nota
    var t0=null, area=$('#rd-area'), pts=svg.querySelectorAll('.rd-pt');
    function passo(ts){ if(!t0) t0=ts; var k=Math.min(1,(ts-t0)/900), e=1-Math.pow(1-k,3);
      area.setAttribute('points',todos.map(function(p,i){return pt(i,p.nota*e).join(',');}).join(' '));
      pts.forEach(function(c,i){ var q=pt(i,todos[i].nota*e); c.setAttribute('cx',q[0]); c.setAttribute('cy',q[1]); });
      if(k<1) requestAnimationFrame(passo); }
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ area.setAttribute('points',todos.map(function(p,i){return pt(i,p.nota).join(',');}).join(' ')); pts.forEach(function(c,i){ var q=pt(i,todos[i].nota); c.setAttribute('cx',q[0]); c.setAttribute('cy',q[1]); }); }
    else requestAnimationFrame(passo);
    // garante o estado final mesmo se a aba abrir em segundo plano (sem animação)
    setTimeout(function(){ area.setAttribute('points',todos.map(function(p,i){return pt(i,p.nota).join(',');}).join(' ')); pts.forEach(function(c,i){ var q=pt(i,todos[i].nota); c.setAttribute('cx',q[0]); c.setAttribute('cy',q[1]); }); },1100);
    var tip=$('#tip'), card=svg.parentNode;
    svg.querySelectorAll('.eixo').forEach(function(g){
      var i=+g.dataset.i, p=todos[i];
      function mostra(){ var q=pt(i,p.nota), b=svg.getBoundingClientRect(), cb=card.getBoundingClientRect(), s=b.width/500;
        tip.innerHTML='<strong>'+esc(p.nome)+'</strong> · '+p.nota+'/100 · '+p.nivel.nome; tip.style.left=(b.left-cb.left+(q[0]+30)*s)+'px'; tip.style.top=(b.top-cb.top+q[1]*s)+'px'; tip.classList.add('on'); }
      g.addEventListener('mouseenter',mostra); g.addEventListener('focus',mostra);
      g.addEventListener('mouseleave',function(){tip.classList.remove('on');}); g.addEventListener('blur',function(){tip.classList.remove('on');});
      g.addEventListener('click',function(){ abrir(todos,i); });
      g.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); abrir(todos,i); } });
    });
  }
  function radarDestaque(i){ if(!RD.svg) return; RD.svg.querySelectorAll('.rd-pt').forEach(function(c,k){ c.setAttribute('r',k===i?7:5); }); }
  comecar();
})();
