<style>
:root{
  --T:'https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/';
  --ic-bell:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/bell.svg);
  --ic-home:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/layout-dashboard.svg);
  --ic-kanban:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/layout-kanban.svg);--ic-menu:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/layout-sidebar-left-expand.svg);--ic-pasta:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/folder.svg);--ic-upload:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/upload.svg);
  --ic-predio:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/building.svg);
  --ic-tabela:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/table.svg);
  --ic-proposta:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/file-dollar.svg);
  --ic-diag:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/stethoscope.svg);
  --ic-mail:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/mail.svg);--ic-send:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/send.svg);
  --ic-post:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/article.svg);
  --ic-aula:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/movie.svg);
  --ic-reuniao:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/calendar-event.svg);
  --ic-site:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/world.svg);
  --ic-alda:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/message-chatbot.svg);
  --ic-sair:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/logout.svg);
  --ic-mais:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/plus.svg);
  --ic-editar:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/pencil.svg);
  --ic-lixo:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/trash.svg);
  --ic-copiar:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/copy.svg);
  --ic-abrir:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/arrow-up-right.svg);
  --ic-busca:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/search.svg);
  --ic-chave:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/key.svg);
  --ws-bg:linear-gradient(135deg,#e8ebf5 0%,#eef0f3 45%,#eef3e6 100%);
  --ws-card:rgba(255,255,255,.72);--ws-card2:rgba(255,255,255,.5);--ws-line:rgba(15,15,20,.08);
  --ws-side:#111113;--ws-side-fg:#f5f5f5;--ws-chip:rgba(15,15,20,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ws-bg:linear-gradient(135deg,#07081a 0%,#050506 50%,#06120b 100%);--ws-card:rgba(22,22,26,.78);--ws-card2:rgba(30,30,36,.6);--ws-line:rgba(255,255,255,.07);--ws-side:#f5f5f5;--ws-side-fg:#0b0b0c;--ws-chip:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--ws-bg:linear-gradient(135deg,#07081a 0%,#050506 50%,#06120b 100%);--ws-card:rgba(22,22,26,.78);--ws-card2:rgba(30,30,36,.6);--ws-line:rgba(255,255,255,.07);--ws-side:#f5f5f5;--ws-side-fg:#0b0b0c;--ws-chip:rgba(255,255,255,.07)}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--ws-bg) fixed;color:var(--fg);font-family:var(--font);margin:0}
.login{max-width:420px;margin:12vh auto 0;padding:32px;border-radius:28px;background:var(--ws-card);backdrop-filter:blur(18px)}
.login h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:-.03em}
/* casca */
.side{position:fixed;left:0;top:0;bottom:0;z-index:30;width:76px;background:var(--ws-side);color:var(--ws-side-fg);border-radius:0 28px 28px 0;padding:14px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 20px 50px rgba(0,0,0,.18);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;transition:width .22s ease}
.side.aberto{width:236px}
.side .s-topo{display:flex;align-items:center;gap:10px;padding:2px 2px 10px;margin-bottom:4px;border-bottom:1px solid color-mix(in srgb,var(--ws-side-fg) 15%,transparent)}
.side .s-marca{font-weight:900;letter-spacing:-.02em;font-size:.95rem;white-space:nowrap;overflow:hidden;opacity:0;transition:opacity .15s}
.side.aberto .s-marca{opacity:1}
.side button{position:relative;width:100%;min-height:44px;border-radius:14px;border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:12px;padding:0 13px;cursor:pointer;transition:background .2s;font:inherit;font-size:.86rem;font-weight:600;text-align:left;flex:none}
.side button:hover{background:color-mix(in srgb,var(--ws-side-fg) 12%,transparent)}
.side button[aria-current="true"]{background:var(--ws-side-fg);color:var(--ws-side)}
.side button .ic{width:20px;height:20px;flex:none}
.side button .s-nome{white-space:nowrap;opacity:0;transition:opacity .15s}
.side.aberto button .s-nome{opacity:1}
.side .s-alterna{width:44px;min-height:44px;justify-content:center;padding:0;border:1px solid color-mix(in srgb,var(--ws-side-fg) 18%,transparent);border-radius:50%}
.side.aberto .s-alterna{margin-left:auto}
.side button .dot{position:absolute;top:8px;left:30px;width:8px;height:8px;border-radius:50%;background:var(--magenta);box-shadow:0 0 0 2px var(--ws-side)}
.side:not(.aberto) button:not(.s-alterna)::after{content:attr(data-nome);position:fixed;left:84px;margin-top:0;white-space:nowrap;background:var(--fg);color:var(--bg);font-size:.74rem;font-weight:600;padding:6px 12px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s;transform:translateY(0)}
.side:not(.aberto) button:hover::after{opacity:1}
.side hr{border:0;border-top:1px solid color-mix(in srgb,var(--ws-side-fg) 15%,transparent);margin:6px 4px;flex:none}
body.side-aberto .ws{padding-left:266px}
.ws{transition:padding-left .22s ease}
.ws{padding:24px 28px 60px 106px;max-width:1500px;margin:0 auto;width:100%;box-sizing:border-box}
.wtop{display:flex;align-items:center;gap:20px;margin-bottom:22px}
.wtop .marca{font-weight:900;letter-spacing:-.04em;font-size:1.25rem;text-decoration:none;color:inherit}
.wtop .marca span{font-weight:300;font-style:italic;margin-left:6px;color:var(--muted)}
.wtop .esp{flex:1}
.redondo{width:42px;height:42px;border-radius:50%;border:1px solid var(--ws-line);background:var(--ws-card);display:grid;place-items:center;cursor:pointer;color:inherit;position:relative}
.redondo .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--magenta)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.85rem}
[data-tema-alvo] button{width:42px;height:42px}
.cab{display:flex;flex-wrap:wrap;align-items:center;gap:20px 34px;margin:6px 0 26px}
.cab h1{font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.02;letter-spacing:-.04em;margin:0;font-weight:700;min-width:220px}
.cab h1 .leve{display:block;font-weight:200;font-style:italic}
.kpis{display:flex;flex-wrap:wrap;gap:22px 30px;flex:1}
.kpi{display:flex;gap:12px;align-items:center}
.kpi .bola{width:42px;height:42px;border-radius:50%;background:var(--ws-chip);display:grid;place-items:center}
.kpi b{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.kpi small{display:block;color:var(--muted);font-size:.72rem;line-height:1.3}
.selo{font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:0}
.s-verde{background:var(--verde);color:#000}.s-mag{background:var(--magenta);color:#fff}.s-mar{background:var(--marinho);color:#fff}.s-neu{background:var(--ws-chip);color:var(--muted)}
/* blocos */
.grade{display:grid;gap:18px}
.g-2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2i{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.card{background:var(--ws-card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--ws-line);border-radius:28px;padding:22px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-h h2{font-size:.95rem;font-weight:700;margin:0;letter-spacing:-.01em;flex:1}
.card-h .muted{font-size:.78rem}
.cbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--ws-line);background:transparent;color:inherit;display:inline-grid;place-items:center;cursor:pointer;text-decoration:none;flex:none}
.cbtn:hover{background:var(--ws-chip)}
.cbtn .ic{width:17px;height:17px}
.pill{font:inherit;font-size:.76rem;font-weight:600;border-radius:999px;padding:9px 16px;border:1px solid var(--ws-line);background:var(--ws-card2);color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.pill:hover{border-color:var(--fg)}
.pill.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.verde{background:var(--verde);color:#000;border-color:var(--verde)}
.pill.perigo{color:var(--erro)}
.pill .ic{width:15px;height:15px}
.pill:disabled{opacity:.5}
.mini{font:inherit;font-size:.74rem;border:1px solid var(--ws-line);border-radius:999px;padding:7px 10px;background:var(--ws-card2);color:var(--fg)}
.vazio{border:1px dashed var(--ws-line);border-radius:20px;padding:22px;color:var(--muted);text-align:center;font-size:.86rem}
.muted{color:var(--muted)}
.app-c{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;justify-content:space-between;margin-bottom:18px;background:var(--marinho);color:#fff;border-color:transparent}
.app-c p{margin:4px 0 0;font-size:.82rem;opacity:.85;max-width:620px}
.app-c .pill{background:#fff;color:#000;border-color:#fff}
.app-c .pill.ghost{background:transparent;color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:.85rem;font-weight:600;z-index:80}
/* cards coloridos (movimento) */
.mov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mc{border-radius:22px;padding:16px 18px;min-height:128px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;background:var(--ws-card2);border:1px solid var(--ws-line);cursor:pointer;transition:transform .2s}
.mc:hover{transform:translateY(-2px)}
.mc small{font-size:.7rem;opacity:.75}
.mc span{font-size:.84rem;font-weight:500;line-height:1.3}
.mc b{margin-top:auto;font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
.mc.c-mar{background:var(--marinho);color:#fff;border-color:transparent}
.mc.c-mag{background:var(--magenta);color:#fff;border-color:transparent}
.mc.c-ver{background:var(--verde);color:#000;border-color:transparent}
.mc.c-pre{background:#0b0b0c;color:#fff;border-color:transparent}
/* funil */
.funil{display:grid;gap:10px;justify-items:center}
.funil div{width:var(--w);background:var(--ws-card2);border:1px solid var(--ws-line);border-radius:20px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
.funil b{font-size:1.15rem}
/* calendário */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-h b{flex:1;text-align:center;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dw{font-size:.62rem;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.cal .d{aspect-ratio:1;border-radius:12px;background:var(--ws-card2);font-size:.72rem;padding:5px;display:flex;flex-direction:column;justify-content:space-between;cursor:default;border:1px solid transparent}
.cal .d.fora{opacity:.3}
.cal .d.hoje{border-color:var(--fg)}
.cal .d.tem{background:var(--marinho);color:#fff;cursor:pointer}
.cal .d.atr{background:var(--magenta);color:#fff}
.cal .d.reu{background:var(--verde);color:#000}
.cal .d i{font-style:normal;font-weight:700;font-size:.66rem;align-self:flex-end}
/* lista */
.lst{display:grid;gap:8px}
.li{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--ws-card2);border:1px solid var(--ws-line)}
.li h4{margin:0;font-size:.9rem;font-weight:600}
.li p{margin:3px 0 0;font-size:.8rem;color:var(--muted);word-break:break-word}
.li .tag{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.li .bts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.li.lido{opacity:.55}
/* kanban */
.kb-filtro{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{font:inherit;font-size:.72rem;font-weight:600;border:1px solid var(--ws-line);border-radius:999px;padding:7px 13px;background:var(--ws-card2);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kb{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--ws-card);border:1px solid var(--ws-line);border-radius:28px;padding:12px;min-height:300px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(18px)}
.col.sobre{border-color:var(--verde)}
.col h3{margin:6px 8px;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.col h3 i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
.col h3 span{color:var(--muted)}
.kc{background:var(--ws-card2);border:1px solid var(--ws-line);border-radius:20px;padding:14px;display:grid;gap:8px;cursor:grab;font-size:.82rem}
.kc:hover{border-color:var(--fg)}
.kc.arrasta{opacity:.4}
.kc b{font-size:.96rem;line-height:1.2}
.kc .muted{font-size:.76rem;line-height:1.4}
.tg{display:flex;flex-wrap:wrap;gap:5px}
.tg span{font-size:.63rem;font-weight:700;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--magenta-txt) 15%,transparent);color:var(--magenta-txt)}
.ori{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--verde-txt);font-weight:700}
.kc details summary{font-size:.72rem;font-weight:600;cursor:pointer;color:var(--muted)}
.kc details label{display:flex;gap:6px;align-items:center;font-size:.76rem;margin-top:6px}
.kc .bts{display:flex;flex-wrap:wrap;gap:6px}
/* empresas */
.emp-lista{display:grid;gap:6px;max-height:70vh;overflow:auto;padding-right:4px}
.emp-lista button{font:inherit;text-align:left;border:1px solid transparent;background:transparent;color:inherit;border-radius:16px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.emp-lista button:hover{background:var(--ws-chip)}
.emp-lista button[aria-current="true"]{background:var(--fg);color:var(--bg)}
.emp-lista button small{font-size:.66rem;opacity:.7}
.busca{display:flex;align-items:center;gap:8px;border:1px solid var(--ws-line);border-radius:999px;padding:9px 14px;background:var(--ws-card2);margin-bottom:12px}
.busca input{border:0;background:none;font:inherit;font-size:.85rem;color:inherit;outline:none;flex:1;min-width:0}
.perfil{text-align:center;display:grid;justify-items:center;gap:8px;padding-top:6px}
.tem-foto{overflow:hidden}
.tem-foto img{width:100%;height:100%;object-fit:cover;display:block}
.mini-av{width:34px;height:34px;border-radius:50%;background:var(--marinho);color:#fff;display:inline-grid;place-items:center;font-size:.7rem;font-weight:800;flex:none;letter-spacing:0}
.mini-av.grande{width:64px;height:64px;font-size:1.1rem}
.foto-acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.foto-acoes .pill{font-size:.72rem;padding:6px 11px}
.perfil .ini{width:96px;height:96px;border-radius:24px;background:var(--marinho);color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:800;letter-spacing:-.04em}
.perfil h3{margin:0;font-size:1.25rem;letter-spacing:-.02em}
.perfil .bts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.dados{display:grid;gap:12px}
.dados div{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center}
.dados small{display:block;font-size:.68rem;color:var(--muted)}
.dados b{font-weight:600;font-size:.92rem;word-break:break-word}
.form{display:grid;gap:10px}
.form .campo{margin:0}
.form .campo label{font-size:.72rem}
.form .campo input,.form .campo select,.form .campo textarea{background:var(--ws-card2);border-color:var(--ws-line);border-radius:14px;padding:10px 12px;font-size:.88rem}
.form .l2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .l3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.multi label{display:inline-flex;align-items:center;gap:6px;font-size:.76rem!important;border:1px solid var(--ws-line);border-radius:999px;padding:5px 10px;background:var(--ws-card2);cursor:pointer;color:var(--fg)}
.multi label:has(:checked){background:var(--fg);color:var(--bg)}
.multi input{display:none}
.dica{display:block;font-size:.68rem;color:var(--muted);margin-top:4px;min-height:0}
.dica.ok{color:var(--verde-txt);font-weight:600}
.dica.erro{color:var(--erro);font-weight:600}
.form .campo .auto{box-shadow:0 0 0 2px var(--verde) inset;transition:box-shadow .3s}
.grp{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;font-weight:700}
.ficha{display:grid;gap:4px 14px;grid-template-columns:1fr 1fr;font-size:.78rem;margin-top:8px}
.ficha span small{display:block;font-size:.64rem;color:var(--muted)}
.hist{font-size:.74rem;display:grid;gap:6px;margin-top:8px;color:var(--muted)}
.hist b{color:var(--fg);font-weight:600}
.kb.neg{grid-template-columns:repeat(11,minmax(230px,1fr))}
.aviso{font-size:.82rem;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--erro) 12%,transparent);color:var(--erro)}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
/* tabela */
.tbl-w{overflow-x:auto;margin:0 -6px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:.82rem;min-width:1080px}
.tbl th{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:4px 10px}
.tbl td{background:var(--ws-card2);padding:10px;vertical-align:middle;border-top:1px solid var(--ws-line);border-bottom:1px solid var(--ws-line)}

.nl-grupo.vd .nl-tit b,.nl-grupo.vm .nl-tit b{color:var(--muted)}.nl-grupo.vm .nl-tit b{text-decoration:line-through}
.nl-row:hover,.nl-row:focus-visible{box-shadow:0 6px 22px rgba(10,10,30,.08);transform:translateY(-1px);outline:none}
.nl-row:hover .nl-abrir,.nt-row:hover .nl-abrir{opacity:1}
.nl-tit{display:flex;flex-direction:column;gap:3px;min-width:0}
.nl-tit b{font-weight:650;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl-tit small{color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl-ic{margin-right:8px;font-size:.72rem}
.nl-dono{font-size:.72rem;font-weight:600;border-radius:999px;padding:3px 9px;background:#111;color:#fff}.nl-dono.cli{background:var(--ws-chip);color:var(--fg);border:1px solid var(--ws-line)}
.nl-tipo{font-size:.7rem;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap;background:#ececf1;color:#333}
.nl-tipo.t-post{background:#dbeafe;color:#1e40af}.nl-tipo.t-video{background:#ede9fe;color:#5b21b6}.nl-tipo.t-reuniao{background:#ffedd5;color:#9a3412}.nl-tipo.t-material{background:#ccfbf1;color:#115e59}
.nv-pz{font-size:.74rem;font-weight:600;white-space:nowrap;color:var(--fg);background:var(--ws-chip);border-radius:999px;padding:3px 9px}
.nv-pz.atr{background:#fee2e2;color:#b91c1c}.nv-pz.hj{background:#fef3c7;color:#92400e}.nv-pz.am{background:#e0f2fe;color:#075985}.nv-pz.nada{background:none;color:var(--muted);font-weight:500;padding:0}
.nl-abrir{font-size:.74rem;font-weight:700;color:var(--muted);opacity:0;transition:opacity .15s;text-align:right;white-space:nowrap}
.nl-vz{font-size:.78rem;color:var(--muted);margin:0;padding:10px 14px;border:1px dashed var(--ws-line);border-radius:12px}
.nt .nt-row{cursor:pointer}.nt .nt-row:hover td{background:var(--ws-chip)}
.nt td{vertical-align:middle}.nt-dt{font-size:.8rem;color:var(--muted);white-space:nowrap}
.nt-cli{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.nt-mais{font-size:.72rem;color:var(--muted);font-weight:700}
.nt-and{display:flex;flex-direction:column;gap:4px;font-size:.74rem;font-weight:700}.nt-comp{font-size:.74rem;font-weight:700;color:var(--muted)}
@media (max-width:1100px){.nl-cab{display:none}.nl-row{grid-template-columns:22px minmax(0,1fr) auto;row-gap:6px}.nl-row>div:nth-child(3),.nl-row>div:nth-child(4),.nl-row>div:nth-child(5){display:none}.nl-abrir{display:none}}
.nt-plano{border-top:1px solid var(--ws-line);margin-top:14px;padding-top:14px}
.nt-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px}
.nt-b{border:1px solid var(--ws-line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.82rem}
.nt-b b{font-size:.9rem;margin-bottom:2px}
.nt-det{font-size:.8rem;margin:6px 0}.nt-det summary{cursor:pointer;font-weight:600}.nt-det p{color:var(--muted);line-height:1.6;margin:6px 0 0}
.nt-erro{color:var(--erro);font-size:.86rem;margin:12px 0 0}
</style>

<body data-casco="area">
<form class="login" id="f-login" hidden>
  <span class="spaced muted">Workspace Unique</span>
  <h1>Entrar como Unique</h1>
  <div class="aviso" id="m-login" hidden></div>
  <div class="campo"><label for="l-senha">Senha do admin</label><input id="l-senha" type="password" autocomplete="current-password" required></div>
  <button class="btn solid" type="submit" style="width:100%">Entrar</button>
</form>

<nav class="side" id="side" aria-label="Menu" hidden></nav>

<div class="ws" id="ws" hidden>
  <div class="wtop">
    <a class="marca" href="/" target="_blank" rel="noopener">UNIQUE<span>workspace</span></a>
    <div class="esp"></div>
    <button class="redondo" type="button" id="b-sino" aria-label="Notificações"><i class="ic" style="--i:var(--ic-bell)"></i><span class="dot" id="sino-dot" hidden></span></button>
    <span data-tema-alvo></span>
    <div class="avatar" title="Carlos Ribeiro">CR</div>
    <button class="redondo" type="button" id="b-sair" aria-label="Sair"><i class="ic" style="--i:var(--ic-sair)"></i></button>
  </div>
  <div class="cab"><h1 id="titulo"></h1><div class="kpis" id="kpis"></div></div>
  <main id="vista"></main>
</div>

<script src="/blog/posts.js"></script>
<script src="/area/admin/crm-form.js"></script>
<script>
(function(){
  var MENU=[
    ['painel','Painel','home'],['crm','CRM','kanban'],['notificacoes','Notificações','bell'],['empresas','Empresas','predio'],['contatos','Contatos','users'],
    ['acoes','Ações','tabela'],['propostas','Propostas','proposta'],['diagnosticos','Diagnósticos','diag'],
    '-',['postagens','Postagens e blog','post'],['newsletter','Newsletter','mail'],['videoaulas','Videoaulas','aula'],['reunioes','Reuniões','reuniao'],
    '-',['site','Site','site'],['alda','Alda.CRM','alda']
  ];
  var ETAPA={lead:['Lead','var(--muted)'],qualificado:['Lead qualificado','#f0a020'],cliente:['Cliente','var(--verde-txt)'],finalizado:['Finalizado','var(--marinho-txt)']};
  var ST={a_fazer:'A fazer',fazendo:'Em andamento',feito:'Feito',cancelado:'Cancelado',arquivado:'Arquivado'};
  function fechado(st){ return st==='feito'||st==='arquivado'||st==='cancelado'; }
  var USTATUS={convite:'Sem acesso ainda',pendente:'Pediu acesso',ativo:'Com acesso',bloqueado:'Bloqueado',recusado:'Recusado'};
  var TIPO={acao:'Ação',post:'Post',video:'Videoaula',reuniao:'Reunião',material:'Material'};
  var PST={rascunho:'Rascunho',enviada:'Enviada',aceita:'Aceita',recusada:'Recusada'};
  var R=null, AC=null, PROPS=null, DIAGS=null, VISTA='painel', EMP='', FILTRO='', CALM=new Date(), BLOB=false;
  var $=function(id){return document.getElementById(id);};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function ic(n){ return '<i class="ic" style="--i:var(--ic-'+n+')"></i>'; }
  function toast(t){ var d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(function(){d.remove();},2400); }
  function get(q){ return fetch('/api/area'+q,{credentials:'same-origin'}).then(function(r){return r.json();}); }
  function post(o){ return fetch('/api/area',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(function(r){return r.json();}); }
  function wa(n){ var d=String(n||'').replace(/\D/g,''); if(!d) return ''; if(d.length<=11) d='55'+d; return d; }
  // WhatsApp Business: no Android abre direto o app Business (com.whatsapp.w4b); se não tiver, cai no wa.me
  var ANDROID=/android/i.test(navigator.userAgent);
  function zap(n,t){ var d=wa(n), q=t?'&text='+encodeURIComponent(t):'';
    if(ANDROID) return 'intent://send/?phone='+d+q+'#Intent;scheme=whatsapp;package=com.whatsapp.w4b;S.browser_fallback_url='+encodeURIComponent('https://wa.me/'+d+(t?'?text='+encodeURIComponent(t):''))+';end';
    return 'https://wa.me/'+d+(t?'?text='+encodeURIComponent(t):''); }
  document.addEventListener('click',function(ev){ var l=ev.target.closest&&ev.target.closest('a[href^="intent:"]'); if(l){ ev.preventDefault(); location.href=l.href; } },true);
  function abreZap(n,t){ var u=zap(n,t); if(u.indexOf('intent:')===0) location.href=u; else window.open(u,'_blank','noopener'); }
  function dt(s,h){ if(!s) return ''; var d=new Date(s.length===10?s+'T12:00':s); return d.toLocaleDateString('pt-BR',h?{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}:{day:'2-digit',month:'short'}); }
  function brl(v){ return (+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function hoje(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
  function nomeEmp(sl){ var e=(R.empresas||[]).filter(function(x){return x.slug===sl;})[0]; return e?e.nome:sl; }
  function emp(sl){ return (R.empresas||[]).filter(function(x){return x.slug===sl;})[0]; }
  function iniciais(n){ return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(function(p){return p[0];}).join('').toUpperCase(); }

  /* Google Agenda: abre o evento já preenchido */
  var GS={}, GEV=[];
  function gpost(o){ return fetch('/api/agenda',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(function(r){return r.json();}); }
  function gget(q){ return fetch('/api/agenda'+q,{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return {};}); }
  function agenda(o){
    if(GS.conectado&&o.id){ gpost({a:'sync',id:o.id}).then(function(r){ toast(r.ok?'Está no seu Google Agenda.':'Defina uma data para enviar à agenda.'); if(r.link) window.open(r.link,'_blank','noopener'); }); return; }
    if(GS.conectado&&o.inicio){ gpost({a:'evento',titulo:o.titulo,detalhe:o.detalhe,inicio:o.inicio,emails:o.emails||[],convidar:false}).then(function(r){ toast(r.ok?'Criado no seu Google Agenda.':(r.erro||'Erro.')); if(r.link) window.open(r.link,'_blank','noopener'); }); return; }
    agendaLink(o);
  }
  function agendaLink(o){
    var ini=o.inicio||o.prazo||hoje(), datas;
    if(ini.length>10){ var a=new Date(ini), b=new Date(a.getTime()+(o.min||60)*60000), f=function(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}; datas=f(a)+'/'+f(b); }
    else { var d=ini.replace(/-/g,''), n=new Date(ini+'T12:00'); n.setDate(n.getDate()+1); datas=d+'/'+n.toISOString().slice(0,10).replace(/-/g,''); }
    var u='https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=America/Sao_Paulo&text='+encodeURIComponent(o.titulo)+'&dates='+datas+'&details='+encodeURIComponent((o.detalhe||'')+(o.slug?'\n\nCliente: '+nomeEmp(o.slug)+'\nÁrea do cliente: '+location.origin+'/area/painel/?e='+o.slug:''));
    if(o.emails&&o.emails.length) u+='&add='+encodeURIComponent(o.emails.join(','));
    window.open(u,'_blank','noopener');
  }

  /* ---------- app (instalar e notificações) ---------- */
  var SWR=null, INST=null;
  var ehIOS=/iphone|ipad|ipod/i.test(navigator.userAgent), instalado=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/area/admin/sw.js',{scope:'/area/admin/'}).then(function(r){SWR=r;}).catch(function(){});
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); INST=e; if(VISTA==='notificacoes'||VISTA==='painel') desenha(); });
  function b64(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function pushLigado(){ return !!(SWR&&window.Notification&&Notification.permission==='granted'&&localStorage&&(function(){try{return localStorage.getItem('ws-push')==='1';}catch(e){return false;}})()); }
  function ligaPush(){
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){ toast(ehIOS&&!instalado?'No iPhone: instale o app primeiro (Compartilhar → Adicionar à Tela de Início) e ative por ele.':'Este navegador não recebe notificações.'); return; }
    Notification.requestPermission().then(function(p){
      if(p!=='granted'){ toast('Notificações bloqueadas. Libere nas configurações do navegador.'); return; }
      return navigator.serviceWorker.ready.then(function(reg){ SWR=reg; return get('?a=admin-push-chave').then(function(k){
        return reg.pushManager.getSubscription().then(function(sub){ return sub||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k.publica)}); });
      }); }).then(function(sub){ return post({a:'admin-push',sub:sub.toJSON()}); }).then(function(r){
        if(r&&r.ok){ try{localStorage.setItem('ws-push','1');}catch(e){} toast('Notificações ligadas neste aparelho.'); post({a:'admin-push-teste'}); desenha(); } else toast('Não foi possível ligar.');
      });
    }).catch(function(){ toast('Não foi possível ligar as notificações.'); });
  }
  function desligaPush(){ if(!SWR) return; SWR.pushManager.getSubscription().then(function(sub){ if(!sub) return; return post({a:'admin-push-sair',endpoint:sub.endpoint}).then(function(){ return sub.unsubscribe(); }); }).then(function(){ try{localStorage.removeItem('ws-push');}catch(e){} toast('Notificações desligadas neste aparelho.'); desenha(); }); }
  function cartaoApp(){
    if(pushLigado()) return '';
    var txt=ehIOS&&!instalado?'No iPhone: toque em Compartilhar → <b>Adicionar à Tela de Início</b>, abra o app pelo ícone e ative as notificações por ele.':
      !instalado?'Instale o Unique Workspace no celular ou no computador e ligue os avisos: novo diagnóstico, pedido de acesso, comentário, proposta aberta e ação concluída.':'Ligue os avisos para saber na hora quando chega um diagnóstico, um comentário ou quando o cliente abre a proposta.';
    return '<section class="card app-c"><div><b>Leve o workspace no bolso</b><p>'+txt+'</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+(INST?'<button class="pill" data-app="instalar">'+ic('download')+'Instalar app</button>':'')+((!ehIOS||instalado)?'<button class="pill'+(INST?' ghost':'')+'" data-app="push">'+ic('bell')+'Ligar notificações</button>':'')+'</div></section>';
  }
  document.addEventListener('click',function(ev){ var b=ev.target.closest('[data-app]'); if(!b) return;
    if(b.dataset.app==='instalar'&&INST){ INST.prompt(); INST.userChoice.then(function(){ INST=null; desenha(); }); }
    if(b.dataset.app==='push') ligaPush();
    if(b.dataset.app==='desliga') desligaPush();
    if(b.dataset.app==='teste') post({a:'admin-push-teste'}).then(function(){ toast('Aviso de teste enviado.'); }); });

  /* ---------- entrada ---------- */
  get('?a=eu').then(function(eu){
    if(eu.logado&&eu.admin) inicia();
    else if(eu.logado) location.replace('/area/painel/');
    else $('f-login').hidden=false;
  });
  $('f-login').onsubmit=function(ev){
    ev.preventDefault();
    post({a:'admin-entrar',senha:$('l-senha').value}).then(function(r){
      if(r.ok){ $('f-login').hidden=true; inicia(); } else { var m=$('m-login'); m.textContent=r.erro||'Não foi possível entrar.'; m.hidden=false; }
    });
  };
  $('b-sair').onclick=function(){ post({a:'sair'}).then(function(){ location.href='/area/'; }); };
  $('b-sino').onclick=function(){ vai('notificacoes'); };

  if(/[?&]google=ok/.test(location.search)) setTimeout(function(){ toast('Google Agenda conectado.'); },800);
  if(/[?&]google=erro/.test(location.search)) setTimeout(function(){ toast('Não foi possível conectar o Google Agenda. Tente de novo.'); },800);
  function inicia(){
    $('ws').hidden=false; $('side').hidden=false;
    var ABERTO=false; try{ ABERTO=localStorage.getItem('side-aberto')==='1'; }catch(x){}
    $('side').innerHTML='<div class="s-topo"><button type="button" class="s-alterna" data-alterna aria-label="Expandir ou recolher o menu">'+ic('menu')+'</button><span class="s-marca">UNIQUE</span></div>'+MENU.map(function(m){ return m==='-'?'<hr>':'<button type="button" data-v="'+m[0]+'" data-nome="'+m[1]+'" aria-label="'+m[1]+'">'+ic(m[2])+'<span class="s-nome">'+m[1]+'</span>'+(m[0]==='notificacoes'?'<span class="dot" id="side-dot" hidden></span>':'')+'</button>'; }).join('');
    function lado(v){ ABERTO=v; $('side').classList.toggle('aberto',v); document.body.classList.toggle('side-aberto',v&&window.innerWidth>900); try{ localStorage.setItem('side-aberto',v?'1':'0'); }catch(x){} }
    lado(ABERTO);
    $('side').addEventListener('click',function(ev){ if(ev.target.closest('[data-alterna]')) lado(!ABERTO); });
    $('side').onclick=function(ev){ var b=ev.target.closest('[data-v]'); if(b){ if(b.dataset.v==='contatos') CT.sel=''; vai(b.dataset.v,b.dataset.v==='empresas'?'':undefined); } };
    window.addEventListener('hashchange',function(){ var h=location.hash.slice(1).split('/'); if(h[0]&&h[0]!==VISTA||h[1]!==EMP){ VISTA=h[0]||'painel'; if(VISTA==='contatos'){ CT.sel=decodeURIComponent(h[1]||''); } else EMP=h[1]||''; desenha(); atualiza(); } });
    var h=location.hash.slice(1).split('/'); VISTA=h[0]||'painel'; EMP=h[1]||''; if(VISTA==='contatos'){ CT.sel=decodeURIComponent(h[1]||''); EMP=''; }
    carrega().then(desenha);
  }
  function carrega(){
    return Promise.all([get('?a=admin-resumo'),get('?a=admin-acoes'),get('?a=admin-propostas'),get('?a=admin-diagnosticos'),get('?a=admin-meta'),get('?a=admin-notion')]).then(function(x){
      META=x[4]||null; NS=x[5]||{}; puxaNotion();
      R=x[0]; AC=x[1]; PROPS=(x[2].propostas||[]); DIAGS=(x[3].diagnosticos||[]); BLOB=R.blob;
      var n=notifCount(); $('sino-dot').hidden=!n; var sd=$('side-dot'); if(sd) sd.hidden=!n;
      return gget('?a=status').then(function(st){ GS=st||{}; if(!GS.conectado){ GEV=[]; return; } return gget('?a=eventos').then(function(e){ GEV=(e&&e.eventos)||[]; }); });
    });
  }
  var VIVAS={painel:1,crm:1,notificacoes:1,diagnosticos:1};
  // Notion: depois de carregar, traz em segundo plano o que mudou lá (no máximo 1 vez por minuto)
  var NS={}, NPUXA=0, NPLANO=null;
  function puxaNotion(forca){
    if(!NS.carga||!NS.token) return; if(!forca&&Date.now()-NPUXA<60000) return; NPUXA=Date.now();
    post({a:'admin-notion-puxar'}).then(function(r){ if(r&&r.ok&&r.total){ carrega().then(function(){ if(!document.querySelector('.pop,.nv-peek,.crop-veu')&&!document.querySelector('#vista form :focus')) desenha(); }); } });
  }
  function atualiza(){ var v=VISTA; if(VIVAS[v]) carrega().then(function(){ if(VISTA===v&&!document.querySelector('.pop')) desenha(); }); }
  document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'&&document.querySelector('.nv-peek')) nvFecha(); });
  function vai(v,e){ nvFecha(); VISTA=v; if(e!==undefined) EMP=e; history.replaceState(null,'','#'+v+(v==='empresas'&&EMP?'/'+EMP:'')); desenha(); window.scrollTo({top:0}); atualiza(); }
  function recarrega(){ return carrega().then(desenha); }

  function notifCount(){ var c=(R.avisos||[]).filter(function(a){return !a.lido;}).length; return (R.pendentes||[]).length+c; }

  function mailV(u){ return u&&!u.semEmail&&!/@contato\.notion$/.test(u.email||'')?u.email:''; }
  function cabecalho(t,leve,kp){
    $('titulo').innerHTML=esc(t)+(leve?'<span class="leve">'+esc(leve)+'</span>':'');
    $('kpis').innerHTML=(kp||[]).map(function(k){ return '<div class="kpi"><span class="bola">'+ic(k[0])+'</span><div><b>'+k[1]+(k[3]?' <span class="selo '+(k[4]||'s-neu')+'">'+k[3]+'</span>':'')+'</b><small>'+k[2]+'</small></div></div>'; }).join('');
    document.querySelectorAll('#side [data-v]').forEach(function(b){ b.setAttribute('aria-current',b.dataset.v===VISTA); });
  }
  function desenha(){
    var f={painel:vPainel,crm:vCrm,notificacoes:vNotif,empresas:vEmpresas,contatos:vContatos,acoes:vAcoes,propostas:vPropostas,diagnosticos:vDiag,postagens:vPosts,newsletter:vNews,videoaulas:vVideos,reunioes:vReunioes,site:vSite,alda:vAlda}[VISTA]||vPainel;
    f();
  }

  /* ---------- dados derivados ---------- */
  var VER_ARQ=false;
  function arquivadaL(l){ return l.clientes.length>0&&l.clientes.every(function(s){ return ((l.and||{})[s]||{}).status==='arquivado'; }); }
  function linhas(){ // todas as ações da tabela única
    var L=[];
    (AC.modelos||[]).forEach(function(m){
      var dest=m.destino==='todos'?(R.empresas||[]).map(function(e){return e.slug;}):(m.destino||[]);
      var and=(AC.andamento||{})[m.id]||{};
      L.push(Object.assign({},m,{fonte:'biblioteca',clientes:dest,todos:m.destino==='todos',and:and}));
    });
    (AC.proprias||[]).forEach(function(a){
      var and={}; and[a.slug]={status:a.status,prazo:a.prazo,pessoa:a.pessoa||'',dono:a.dono,tipo:a.tipo};
      L.push(Object.assign({},a,{fonte:'propria',destino:[a.slug],clientes:[a.slug],and:and}));
    });
    // posts do blog que ainda não viraram ação
    var links={}; L.forEach(function(x){ if(x.link) links[x.link]=1; });
    (window.POSTS||[]).forEach(function(p){
      var l='/blog/#'+p.slug; if(links[l]) return;

  function calendario(P){

    P.forEach(function(p){ (mapa[p.prazo]=mapa[p.prazo]||[]).push(p); if(p.tipo==='reuniao'&&p.inicio) (mapa[p.inicio.slice(0,10)]=mapa[p.inicio.slice(0,10)]||[]).push(p); });
    GEV.forEach(function(e){ if(e.unique) return; var k=String(e.inicio).slice(0,10); (mapa[k]=mapa[k]||[]).push({titulo:e.titulo,slug:'',tipo:'reuniao',status:'a_fazer',prazo:k,google:1}); });
    var out='<div class="cal-h"><b>'+prim.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</b></div><div class="cal">'+['D','S','T','Q','Q','S','S'].map(function(d){return '<span class="dw">'+d+'</span>';}).join('');
    for(var i=0;i<42;i++){
      var d=new Date(ini); d.setDate(ini.getDate()+i); var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      var L=mapa[k]||[], cls='d'+(d.getMonth()!==m?' fora':'')+(k===h?' hoje':'');
      if(L.length){ cls+=' tem'; if(L.some(function(x){return !fechado(x.status)&&k<h;})) cls+=' atr'; else if(L.some(function(x){return x.tipo==='reuniao';})) cls+=' reu'; }
      out+='<div class="'+cls+'"'+(L.length?' data-dia="'+k+'" title="'+esc(L.map(function(x){return x.titulo+(x.slug?' · '+nomeEmp(x.slug):x.google?' · Google Agenda':'');}).join('\n'))+'"':'')+'>'+d.getDate()+(L.length?'<i>'+L.length+'</i>':'')+'</div>';
    }
    $('cal').innerHTML=out+'</div>';
  }

      '<p style="font-size:.86rem;margin:0 0 12px">Antes de ligar, veja o que vai acontecer com as empresas, contatos e negócios dos dois lados.</p><button class="pill solid" id="nt-plano">Ver o que vai acontecer</button>')+plano+'</section>';
  }
  function ligaNotion(){
    var b=$('nt-plano'); if(b) b.onclick=function(){ b.disabled=true; b.textContent='Lendo o Notion…'; get('?a=admin-notion-plano').then(function(r){ NPLANO=r||{ok:false}; vSite(); var n=$('notion'); if(n) n.scrollIntoView({block:'start'}); }); };
    var a=$('nt-aplica'); if(a) a.onclick=function(){
      if(a.dataset.ok!=='1'){ a.dataset.ok='1'; a.textContent='Clique de novo para confirmar'; return; }
      a.disabled=true; a.textContent='Aplicando… (pode levar até 1 minuto)';
      (function vai1(){ post({a:'admin-notion-aplicar'}).then(function(r){
        if(!r||!r.ok){ a.disabled=false; a.textContent='Aplicar a carga inicial'; a.dataset.ok=''; toast((r&&r.erro)||'Não deu certo. Tente de novo.'); return; }
        if(r.parcial){ a.textContent='Continuando… ('+(r.cont.empresas+r.cont.pessoas+r.cont.negocios)+' registros até agora)'; vai1(); return; }
        toast('Pronto: '+r.cont.empresas+' empresas, '+r.cont.pessoas+' contatos e '+r.cont.negocios+' negócios ligados ao Notion.');
        NPLANO=null; carrega().then(vSite); }); })(); };
    var p=$('nt-puxa'); if(p) p.onclick=function(){ p.disabled=true; post({a:'admin-notion-puxar'}).then(function(r){ toast(r.ok?(r.total?r.total+' alteração(ões) trazida(s) do Notion.':'Tudo em dia.'):(r.erro||'Erro.')); carrega().then(vSite); }); };
    var t=$('nt-tudo'); if(t) t.onclick=function(){ t.disabled=true; t.textContent='Conferindo…'; post({a:'admin-notion-puxar',tudo:true}).then(function(r){ toast(r.ok?'Conferência completa feita.':(r.erro||'Erro.')); carrega().then(vSite); }); };
  }

  function ligaMeta(){
    var f=$('meta-f'); if(f) f.onsubmit=function(ev){ ev.preventDefault(); var bt=f.querySelector('button'); bt.disabled=true; bt.textContent='Conectando…';
      post({a:'admin-meta-conecta',app:f.app.value,segredo:f.segredo.value,token:f.token.value}).then(function(r){ bt.disabled=false; bt.textContent='Conectar';
        if(!r.ok){ toast(r.erro||'Não foi possível conectar.'); return; } toast('Instagram conectado: @'+r.igUser+'.'); get('?a=admin-meta').then(function(m){ META=m; vSite(); }); }); };
    var sa=$('meta-sair'); if(sa) sa.onclick=function(){ post({a:'admin-meta-sair'}).then(function(){ META={conectado:false}; vSite(); toast('Instagram desconectado.'); }); };
