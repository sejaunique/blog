<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="/assets/tema.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas vagas · Unique Consultoria</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
<link rel="stylesheet" href="/assets/casco.css">
<link rel="stylesheet" href="/vagas/assets/vg.css">
<style>
.topo{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.topo h1{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:700;letter-spacing:-.03em;margin:4px 0 0;line-height:1.1}
.topo .spaced{color:var(--muted)}
.vagas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.vaga h3{margin:10px 0 4px;font-size:1.1rem;line-height:1.3}
.vaga .meta{color:var(--muted);font-size:.84rem}
.vaga .nums{display:flex;gap:18px;margin:14px 0;font-size:.82rem;color:var(--muted)}
.vaga .nums b{display:block;font-size:1.4rem;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.1}
.vaga .vg-row .btn{flex:1}
/* editor */
.ed{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
.etapas{position:sticky;top:96px;display:grid;gap:4px}
.etapas button{font:inherit;text-align:left;font-size:.86rem;border:0;background:none;color:var(--muted);padding:10px 12px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.etapas button span{font-size:.62rem;letter-spacing:.2em;font-variant-numeric:tabular-nums;width:22px}
.etapas button[aria-current="step"]{background:var(--fg);color:var(--bg)}
.etapas button.feito{color:var(--fg)}
.passo h2{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.passo .ajuda{color:var(--muted);margin:0 0 22px;font-size:.93rem;max-width:62ch}
.passo .ajuda b{color:var(--fg)}
.analogias{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.analogia{border:2px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;background:var(--bg);text-align:left;font:inherit;color:inherit}
.analogia .e{font-size:1.8rem}
.analogia b{display:block;font-size:1.05rem;margin-top:6px}
.analogia small{color:var(--muted)}
.analogia[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 15%,transparent)}
.opcoes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.opcoes button{font:inherit;font-size:.84rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:9px 16px;background:none;color:var(--muted);cursor:pointer}
.opcoes button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.nav-ed{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.sug button{font:inherit;font-size:.76rem;border:1px dashed var(--line);border-radius:999px;padding:6px 12px;background:none;color:var(--muted);cursor:pointer}
.sug button:hover{color:var(--fg);border-color:var(--fg)}
.titulo-prev{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;padding:16px 18px;border-radius:16px;background:var(--soft);margin-bottom:16px}
.logo-up{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo-prev{width:140px;height:84px;border:1px dashed var(--line);border-radius:14px;display:grid;place-items:center;background:repeating-conic-gradient(var(--soft) 0 25%,var(--bg) 0 50%) 0 0/16px 16px;overflow:hidden;flex-shrink:0}
.logo-prev img{max-width:90%;max-height:70px;object-fit:contain}
.logo-prev span{font-size:.75rem;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:999px}
.logo-ac{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1;min-width:200px}
.logo-ac small{flex-basis:100%;font-size:.75rem}
.logo-ac label.btn{cursor:pointer}
/* candidatos */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.cands{display:grid;gap:12px}
.cand{display:grid;grid-template-columns:1fr 300px;gap:20px}
.cand h3{margin:0;font-size:1.1rem}
.cand .resp{white-space:pre-wrap;font-size:.93rem;line-height:1.6;margin:12px 0 0;max-height:220px;overflow:auto;padding-right:6px}
.cand video{width:100%;border-radius:14px;background:#000;max-height:360px}
.cand .lado{display:grid;gap:10px;align-content:start}
.estrelas button{font-size:1.3rem;background:none;border:0;cursor:pointer;color:var(--line);padding:0 2px}
.estrelas button.on{color:#ffb020}
.cand select,.cand textarea{font:inherit;font-size:.88rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 11px;width:100%;box-sizing:border-box}
.cand textarea{min-height:70px;resize:vertical}
.estado{max-width:560px;margin:60px auto;text-align:center}
.estado h1{font-size:2rem;letter-spacing:-.03em}
@media (max-width:860px){.ed{grid-template-columns:1fr}.etapas{position:static;grid-auto-flow:column;overflow-x:auto;grid-auto-columns:max-content}.cand{grid-template-columns:1fr}.analogias{grid-template-columns:1fr}}
</style>
</head>
<body data-casco="area">
<script src="/assets/casco.js"></script>
<main class="vg-wrap" id="app"><p class="muted">Carregando…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/vagas/assets/vg.js"></script>
<script>
(function(){
var sb=VG.sb, esc=VG.esc, A=VG.ANALOGIAS, app=document.getElementById('app');
var U=null, EMP=null, ADMIN=false, VAGAS=[], CONT={};

function h(s){ app.innerHTML=s; window.scrollTo(0,0); }
function sair(){ sb.auth.signOut().then(function(){ location.replace('/vagas/'); }); }

/* ---------- início ---------- */
sb.auth.getSession().then(async function(r){
  if(/nova-senha/.test(location.search)) return telaNovaSenha();
  if(!r.data.session) return location.replace('/vagas/');
  U=r.data.session.user;
  var a=await sb.rpc('vg_is_admin'); ADMIN=!!a.data;
  var e=await sb.from('vg_empresas').select('*').eq('owner',U.id).maybeSingle();
  EMP=e.data;
  if(!EMP){
    var md=U.user_metadata||{};
    try{ var lc=JSON.parse(localStorage.getItem('vg_cadastro')||'null'); if(lc&&lc.empresa&&!md.empresa) md=lc; }catch(x){}
    var ins=await sb.from('vg_empresas').insert({owner:U.id,nome:md.empresa||'Minha empresa',responsavel:md.nome||'',whatsapp:md.whatsapp||'',cidade:md.cidade||''}).select().single();
    EMP=ins.data;
  }
  if(!EMP) return h('<div class="estado"><h1>Não foi possível abrir sua conta</h1><p class="muted">Tente sair e entrar de novo.</p><button class="btn" id="bs">Sair</button></div>'), document.getElementById('bs').onclick=sair;
  if(EMP.status!=='aprovada') return telaPendente();
  window.addEventListener('hashchange',rota); rota();
});

function telaNovaSenha(){
  h('<div class="estado vg-card" style="text-align:left"><h2>Crie uma nova senha</h2><div class="campo"><label>Nova senha</label><input id="ns" type="password" minlength="8" autocomplete="new-password"></div><button class="btn solid" id="bns">Salvar</button></div>');
  document.getElementById('bns').onclick=function(){
    var s=document.getElementById('ns').value; if(s.length<8) return VG.toast('Mínimo de 8 caracteres','erro');
    sb.auth.updateUser({password:s}).then(function(r){ if(r.error) return VG.toast(VG.erroPt(r.error),'erro'); location.replace('/vagas/painel/'); });
  };
}
function telaPendente(){
  var bloq=EMP.status==='bloqueada';
  var wa='https://wa.me/5562996007574?text='+encodeURIComponent('Olá, Carlos! Criei a conta da '+EMP.nome+' no Vagas por Propósito e quero liberar o acesso.');
  h('<div class="estado"><span class="vg-pill '+(bloq?'mag':'warn')+'">'+(bloq?'Acesso suspenso':'Aguardando liberação')+'</span>'+
    '<h1>'+(bloq?'O acesso da '+esc(EMP.nome)+' está suspenso.':'Recebemos o cadastro da '+esc(EMP.nome)+'.')+'</h1>'+
    '<p class="muted">'+(bloq?'Fale com a Unique para entender o que aconteceu.':'A Unique confere e libera o seu acesso. Enquanto isso, assista aos vídeos do método: eles explicam cada filtro que você vai usar.')+'</p>'+
    '<div class="vg-row" style="justify-content:center;margin-top:20px"><a class="btn verde" href="'+wa+'" target="_blank" rel="noopener">Avisar no WhatsApp</a><a class="btn" href="/vagas/metodo/">Ver o método</a><button class="btn" id="bs">Sair</button></div></div>');
  document.getElementById('bs').onclick=sair;
}

/* ---------- rotas ---------- */
function rota(){
  var p=location.hash.replace(/^#\/?/,'').split('/');
  if(p[0]==='nova') return editor(null);
  if(p[0]==='editar'&&p[1]) return editor(p[1]);
  if(p[0]==='candidatos'&&p[1]) return candidatos(p[1]);
  if(p[0]==='empresa') return telaEmpresa();
  lista();
}

/* ---------- lista de vagas ---------- */
async function lista(){
  h('<p class="muted">Carregando vagas…</p>');
  var r=await sb.from('vg_vagas').select('id,slug,status,titulo,cargo_real,analogia,views,updated_at').eq('empresa_id',EMP.id).order('updated_at',{ascending:false});
  VAGAS=r.data||[];
  var ids=VAGAS.map(function(v){return v.id;}); CONT={};
  if(ids.length){
    var c=await sb.from('vg_candidatos').select('vaga_id,atento').in('vaga_id',ids);
    (c.data||[]).forEach(function(x){ var o=CONT[x.vaga_id]||(CONT[x.vaga_id]={t:0,a:0}); o.t++; if(x.atento) o.a++; });
  }
  var ST={rascunho:['Rascunho',''],publicada:['No ar','ok'],pausada:['Pausada','warn'],encerrada:['Encerrada','dark']};
  var cards=VAGAS.map(function(v){
    var s=ST[v.status]||ST.rascunho, c=CONT[v.id]||{t:0,a:0}, an=A[v.analogia];
    return '<article class="vg-card vaga"><div class="vg-row"><span class="vg-pill '+s[1]+'">'+s[0]+'</span>'+(an?'<span class="vg-pill">'+an.emoji+' '+an.nome+'</span>':'')+'</div>'+
      '<h3>'+esc(v.titulo||v.cargo_real||'Vaga sem título')+'</h3><div class="meta">sejaunique.com/vagas/v/'+esc(v.slug)+'</div>'+
      '<div class="nums"><span><b>'+(v.views||0)+'</b>visitas</span><span><b>'+c.t+'</b>candidatos</span><span><b>'+c.a+'</b>✓ atentos</span></div>'+
      '<div class="vg-row"><a class="btn sm solid" href="#/candidatos/'+v.id+'">Candidatos</a><a class="btn sm" href="#/editar/'+v.id+'">Editar</a>'+
      '<button class="btn sm" data-link="'+esc(v.slug)+'">Copiar link</button></div></article>';
  }).join('');
  h('<div class="topo"><div><span class="spaced">'+esc(EMP.nome)+'</span><h1>Suas vagas</h1></div><div class="vg-row">'+
    (ADMIN?'<a class="btn sm" href="/vagas/admin/">Admin Unique</a>':'')+
    '<a class="btn sm" href="/vagas/metodo/">Método</a><a class="btn sm" href="#/empresa">Empresa</a><button class="btn sm" id="bs">Sair</button><a class="btn verde" href="#/nova">+ Nova vaga</a></div></div>'+
    (cards?'<div class="vagas">'+cards+'</div>':'<div class="vg-vazio"><h2 style="margin:0 0 8px">Crie a sua primeira vaga</h2><p>Leva poucos minutos: escolha a analogia e o criador escreve os textos com você.</p><a class="btn verde" href="#/nova">+ Nova vaga</a></div>'));
  document.getElementById('bs').onclick=sair;
  app.querySelectorAll('[data-link]').forEach(function(b){ b.onclick=function(){ copiar(location.origin+'/vagas/v/'+b.dataset.link); }; });
}
function copiar(t){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){VG.toast('Link copiado');},function(){prompt('Copie o link:',t);}); }

/* ---------- empresa ---------- */
function telaEmpresa(){
  h('<div class="topo"><div><span class="spaced">Configurações</span><h1>Sua empresa</h1></div><a class="btn sm" href="#/">← Voltar</a></div>'+
    '<div class="vg-card" style="max-width:640px">'+
    campo('Nome da empresa','em-nome',EMP.nome)+campo('Responsável','em-resp',EMP.responsavel)+
    '<div class="vg-grid2">'+campo('WhatsApp','em-whats',EMP.whatsapp)+campo('Cidade','em-cid',EMP.cidade)+'</div>'+
    campoLogo('Logo da empresa','em-logo',EMP.logo_url)+
    area('Sobre a empresa e o propósito','em-sobre',EMP.sobre,'O que vocês fazem, por que existem e o que acreditam.')+
    '<button class="btn solid" id="bse">Salvar</button></div>');
  ligaLogo('em-logo');
  document.getElementById('bse').onclick=async function(){
    var d={nome:val('em-nome'),responsavel:val('em-resp'),whatsapp:val('em-whats'),cidade:val('em-cid'),logo_url:val('em-logo'),sobre:val('em-sobre')};
    var r=await sb.from('vg_empresas').update(d).eq('id',EMP.id).select().single();
    if(r.error) return VG.toast(VG.erroPt(r.error),'erro'); EMP=r.data; VG.toast('Empresa salva'); location.hash='#/';
  };
}
function campoLogo(l,id,v){
  return '<div class="campo"><label>'+l+'</label><input type="hidden" id="'+id+'" value="'+esc(v||'')+'">'+
    '<div class="logo-up" id="'+id+'-box"><div class="logo-prev" id="'+id+'-prev">'+(v?'<img src="'+esc(v)+'" alt="">':'<span>Sem logo</span>')+'</div>'+
    '<div class="logo-ac"><label class="btn sm solid" for="'+id+'-arq">'+(v?'Trocar imagem':'Anexar imagem')+'</label>'+
    '<input type="file" id="'+id+'-arq" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>'+
    '<button type="button" class="btn sm" id="'+id+'-rm"'+(v?'':' hidden')+'>Remover</button>'+
    '<small class="muted">PNG, JPG, WEBP ou SVG · até 5 MB. Fundo transparente fica melhor.</small></div></div></div>';
}
function reduz(arq){
  return new Promise(function(ok){
    if(/svg|gif/.test(arq.type)) return ok(arq);
    var img=new Image(), u=URL.createObjectURL(arq);
    img.onload=function(){
      var m=800, w=img.width, hh=img.height; if(w<=m&&hh<=m){ URL.revokeObjectURL(u); return ok(arq); }
      var k=Math.min(m/w,m/hh), c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(hh*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
      var tipo=arq.type==='image/png'?'image/png':'image/webp';
      c.toBlob(function(b){ ok(b?new File([b],'logo.'+(tipo==='image/png'?'png':'webp'),{type:tipo}):arq); },tipo,.9);
    };
    img.onerror=function(){ ok(arq); }; img.src=u;
  });
}
function ligaLogo(id){
  var inp=document.getElementById(id), arq=document.getElementById(id+'-arq'), prev=document.getElementById(id+'-prev'), rm=document.getElementById(id+'-rm'), lb=document.querySelector('label[for="'+id+'-arq"]');
  function mostra(u){ inp.value=u||''; prev.innerHTML=u?'<img src="'+esc(u)+'" alt="">':'<span>Sem logo</span>'; rm.hidden=!u; lb.textContent=u?'Trocar imagem':'Anexar imagem'; }
  rm.onclick=function(){ mostra(''); };
  arq.onchange=async function(){
    var f=arq.files[0]; arq.value=''; if(!f) return;
    if(!/^image\//.test(f.type)) return VG.toast('Escolha um arquivo de imagem','erro');
    if(f.size>5*1024*1024) return VG.toast('A imagem passou de 5 MB','erro');
    lb.textContent='Enviando…'; prev.innerHTML='<span>Enviando…</span>';
    try{
      f=await reduz(f);
      var ext=(f.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,4)||'png';
      var cam=EMP.id+'/'+Date.now().toString(36)+'.'+ext;
      var up=await sb.storage.from('vagas-logos').upload(cam,f,{contentType:f.type,upsert:false,cacheControl:'31536000'});
      if(up.error) throw up.error;
      var url=sb.storage.from('vagas-logos').getPublicUrl(cam).data.publicUrl;
      mostra(url);
      if(!EMP.logo_url){ var r=await sb.from('vg_empresas').update({logo_url:url}).eq('id',EMP.id).select().single(); if(r.data) EMP=r.data; }
      VG.toast('Logo anexado');
    }catch(e){ mostra(inp.value); VG.toast(VG.erroPt(e),'erro'); }
  };
}
function campo(l,id,v,ph,tipo){ return '<div class="campo"><label for="'+id+'">'+l+'</label><input id="'+id+'" type="'+(tipo||'text')+'" value="'+esc(v||'')+'" placeholder="'+esc(ph||'')+'"></div>'; }
function area(l,id,v,ph){ return '<div class="campo"><label for="'+id+'">'+l+'</label><textarea id="'+id+'" placeholder="'+esc(ph||'')+'">'+esc(v||'')+'</textarea></div>'; }
function val(id){ var e=document.getElementById(id); return e?e.value.trim():''; }

/* ---------- editor (criador) ---------- */
var ETAPAS=[
  ['empresa','Empresa'],['analogia','Analogia'],['promessa','Promessa'],['tarefas','Tarefas'],['perfil','Perfil'],
  ['rotina','Rotina'],['beneficios','Benefícios'],['remuneracao','Remuneração'],['filtros','Filtros'],['publicar','Publicar']
];
var V=null, PAL='', EI=0;

async function editor(id){
  h('<p class="muted">Abrindo o criador…</p>');
  if(id){
    var r=await sb.from('vg_vagas').select('*').eq('id',id).single();
    if(r.error) { VG.toast('Vaga não encontrada','erro'); location.hash='#/'; return; }
    V=r.data; var s=await sb.from('vg_segredos').select('palavra').eq('vaga_id',id).maybeSingle(); PAL=(s.data&&s.data.palavra)||'';
  } else {
    V={empresa_id:EMP.id,status:'rascunho',empresa_nome:EMP.nome,empresa_sobre:EMP.sobre||'',empresa_logo:EMP.logo_url||'',cidade:EMP.cidade||'',
      analogia:'',cargo_real:'',titulo:'',promessa:'',tarefas:[],perfil:'',perfil_lista:[],local:EMP.cidade||'',horario:'',modelo:'Presencial',
      beneficios:[],remun_tipo:'combinar',remun_texto:'',escadinha:[1500,1600,1700],remun_final:5000,video_url:'',desafio_video:'',palavra_onde:'perfil',min_caracteres:300,slug:''};
    PAL='';
  }
  EI=0; desenha();
}
function desenha(){
  var nav=ETAPAS.map(function(e,i){ return '<button type="button" data-i="'+i+'"'+(i===EI?' aria-current="step"':'')+(i<EI?' class="feito"':'')+'><span>'+String(i+1).padStart(2,'0')+'</span>'+e[1]+'</button>'; }).join('');
  h('<div class="topo"><div><span class="spaced">'+(V.id?'Editando vaga':'Nova vaga')+'</span><h1>'+esc(V.titulo||'Criador de vaga')+'</h1></div>'+
    '<div class="vg-row"><a class="btn sm" href="#/">← Minhas vagas</a>'+(V.id?'<a class="btn sm" target="_blank" href="/vagas/v/'+esc(V.slug)+'">Ver página</a>':'')+'<button class="btn sm" id="bsalva">Salvar rascunho</button></div></div>'+
    '<div class="ed"><nav class="etapas">'+nav+'</nav><section class="vg-card passo" id="passo"></section></div>');
  app.querySelectorAll('.etapas button').forEach(function(b){ b.onclick=function(){ coleta(); EI=+b.dataset.i; desenha(); }; });
  document.getElementById('bsalva').onclick=function(){ coleta(); salvar(); };
  PASSOS[ETAPAS[EI][0]](document.getElementById('passo'));
  var p=document.getElementById('passo');
  p.insertAdjacentHTML('beforeend','<div class="nav-ed">'+(EI>0?'<button class="btn" id="bant">← Voltar</button>':'<span></span>')+
    (EI<ETAPAS.length-1?'<button class="btn solid" id="bprox">Continuar →</button>':'')+'</div>');
  var ba=document.getElementById('bant'), bp=document.getElementById('bprox');
  if(ba) ba.onclick=function(){ coleta(); EI--; desenha(); };
  if(bp) bp.onclick=function(){ coleta(); if(!valida()) return; EI++; desenha(); };
}
var COL=function(){};
function coleta(){ COL(); }
function valida(){
  var k=ETAPAS[EI][0];
  if(k==='analogia'&&(!V.analogia||!V.cargo_real)){ VG.toast('Escolha a analogia e diga o cargo real','erro'); return false; }
  return true;
}

function listaEd(id,itens,ph){
  return '<div class="vg-lista-ed" id="'+id+'">'+(itens.length?itens:['']).map(function(t){ return '<div class="it"><input value="'+esc(t)+'" placeholder="'+esc(ph)+'"><button type="button" class="vg-x" title="Remover">×</button></div>'; }).join('')+
    '</div><button type="button" class="btn sm" data-add="'+id+'">+ Adicionar</button>';
}
function ligaLista(id,ph){
  var box=document.getElementById(id);
  box.addEventListener('click',function(e){ if(e.target.classList.contains('vg-x')){ e.target.parentNode.remove(); if(!box.children.length) addIt(box,'',ph); } });
  document.querySelector('[data-add="'+id+'"]').onclick=function(){ addIt(box,'',ph).querySelector('input').focus(); };
}

async function salvar(fim){
  if(!V.slug) V.slug=VG.slugify((V.empresa_nome||'')+'-'+(V.cargo_real||V.titulo||'vaga'))||('vaga-'+Date.now().toString(36));
  V.palavra_dica=(V.palavra_onde==='perfil'&&PAL)?'Se você leu até aqui, escreva a palavra '+PAL+' em algum lugar da sua resposta.':'';
  var d={}; ['empresa_id','slug','status','empresa_nome','empresa_sobre','empresa_logo','cidade','cargo_real','analogia','titulo','promessa','tarefas','perfil','perfil_lista','local','horario','modelo','beneficios','remun_tipo','remun_texto','escadinha','remun_final','video_url','desafio_video','palavra_onde','palavra_dica','min_caracteres'].forEach(function(k){ d[k]=V[k]; });
  if(!d.titulo) d.titulo=V.analogia?A[V.analogia].titulo(V.cargo_real):(V.cargo_real||'Nova vaga');
  if(!V.id){
    var livre=await sb.rpc('vg_slug_livre',{s:d.slug});
    if(livre.data===false){ d.slug=d.slug+'-'+Math.random().toString(36).slice(2,6); }
  }
  var r=V.id?await sb.from('vg_vagas').update(d).eq('id',V.id).select().single():await sb.from('vg_vagas').insert(d).select().single();
  if(r.error) return VG.toast(VG.erroPt(r.error),'erro');
  V=r.data;
  var s=await sb.from('vg_segredos').upsert({vaga_id:V.id,palavra:V.palavra_onde==='nenhuma'?null:(PAL||null)});
  if(s.error) VG.toast('A vaga foi salva, mas a palavra secreta não: '+VG.erroPt(s.error),'erro');
  if(fim){
    VG.toast(V.status==='publicada'?'Vaga no ar!':'Vaga salva');
    var url=location.origin+'/vagas/v/'+V.slug;
    h('<div class="estado"><span class="vg-pill '+(V.status==='publicada'?'ok':'')+'">'+(V.status==='publicada'?'No ar':'Salva')+'</span><h1>'+esc(V.titulo)+'</h1>'+
      '<p class="muted">Divulgue este link no Instagram, nos grupos e no WhatsApp:</p><p><a href="'+url+'" target="_blank" style="font-weight:700;word-break:break-all">'+url+'</a></p>'+
      '<div class="vg-row" style="justify-content:center;margin-top:18px"><button class="btn solid" id="bcp">Copiar link</button>'+
      '<a class="btn verde" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(V.titulo+' · '+url)+'">Enviar no WhatsApp</a><a class="btn" href="#/">Minhas vagas</a></div></div>');
    document.getElementById('bcp').onclick=function(){ copiar(url); };
    history.replaceState(null,'','#/editar/'+V.id);
  } else {
    VG.toast('Rascunho salvo');
    if(location.hash!=='#/editar/'+V.id) history.replaceState(null,'','#/editar/'+V.id);
    desenha();
  }
}

  h('<p class="muted">Carregando candidatos…</p>');
  var v=await sb.from('vg_vagas').select('id,slug,titulo,status,palavra_onde').eq('id',id).single();
  if(v.error){ location.hash='#/'; return; }
  var r=await sb.from('vg_candidatos').select('*').eq('vaga_id',id).order('created_at',{ascending:false});
  var C=r.data||[];
  var paths=C.filter(function(c){return c.video_path;}).map(function(c){return c.video_path;}), URLS={};
  if(paths.length){ var su=await sb.storage.from('vagas-videos').createSignedUrls(paths,3600); (su.data||[]).forEach(function(x){ if(x.signedUrl) URLS[x.path]=x.signedUrl; }); }
  var n={todos:C.length,atentos:C.filter(function(c){return c.atento;}).length,video:C.filter(function(c){return c.video_path||c.video_link;}).length};
  ['novo','triagem','entrevista','aprovado','recusado'].forEach(function(s){ n[s]=C.filter(function(c){return c.status===s;}).length; });
  var NOMES={todos:'Todos',atentos:'✓ Atentos',video:'Com vídeo',novo:'Novos',triagem:'Triagem',entrevista:'Entrevista',aprovado:'Aprovados',recusado:'Recusados'};
  function render(){
    var L=C.filter(function(c){ return FILTRO==='todos'||(FILTRO==='atentos'&&c.atento)||(FILTRO==='video'&&(c.video_path||c.video_link))||c.status===FILTRO; });
    document.getElementById('lista-c').innerHTML=L.length?L.map(card).join(''):'<div class="vg-vazio">Nenhum candidato '+(FILTRO==='todos'?'ainda. Divulgue o link da vaga!':'neste filtro.')+'</div>';
    document.querySelectorAll('.filtros button').forEach(function(b){ b.setAttribute('aria-pressed',b.dataset.f===FILTRO); });
  }
  function card(c){
    var yt=VG.ytId(c.video_link), vid=c.video_path&&URLS[c.video_path]?'<video controls preload="metadata" src="'+esc(URLS[c.video_path])+'"></video>':

    var data=new Date(c.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    return '<article class="vg-card cand" data-id="'+c.id+'"><div><div class="vg-row">'+(c.atento?'<span class="vg-pill ok">✓ Atento</span>':(v.data.palavra_onde!=='nenhuma'?'<span class="vg-pill">Não achou a palavra</span>':''))+'<span class="muted" style="font-size:.8rem">'+data+'</span></div>'+
      '<h3 style="margin-top:10px">'+esc(c.nome)+'</h3><div class="vg-row" style="font-size:.86rem;margin-top:4px">'+
      (c.whatsapp?'<a target="_blank" rel="noopener" href="'+VG.zap(c.whatsapp)+'">WhatsApp '+esc(c.whatsapp)+'</a>':'')+(c.email?'<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':'')+(c.cidade?'<span class="muted">'+esc(c.cidade)+'</span>':'')+'</div>'+
      '<p class="resp">'+esc(c.resposta)+'</p></div>'+
      '<div class="lado">'+vid+'<select data-k="status">'+['novo','triagem','entrevista','aprovado','recusado'].map(function(s){return '<option value="'+s+'"'+(c.status===s?' selected':'')+'>'+{novo:'Novo',triagem:'Triagem',entrevista:'Entrevista',aprovado:'Aprovado',recusado:'Recusado'}[s]+'</option>';}).join('')+'</select>'+
      '<div class="estrelas">'+[1,2,3,4,5].map(function(i){return '<button type="button" data-nota="'+i+'" class="'+((c.nota||0)>=i?'on':'')+'">★</button>';}).join('')+'</div>'+
      '<textarea data-k="obs" placeholder="Anotações sobre este candidato">'+esc(c.obs||'')+'</textarea></div></article>';
  }
  h('<div class="topo"><div><span class="spaced">Candidatos</span><h1>'+esc(v.data.titulo)+'</h1></div><div class="vg-row"><a class="btn sm" href="#/">← Minhas vagas</a><a class="btn sm" href="#/editar/'+id+'">Editar vaga</a><a class="btn sm" target="_blank" href="/vagas/v/'+esc(v.data.slug)+'">Ver página</a><button class="btn sm" id="bcsv">Baixar planilha</button></div></div>'+
    '<div class="filtros opcoes">'+Object.keys(NOMES).filter(function(k){return k==='todos'||n[k];}).map(function(k){return '<button type="button" data-f="'+k+'">'+NOMES[k]+' · '+n[k]+'</button>';}).join('')+'</div><div class="cands" id="lista-c"></div>');
  document.querySelectorAll('.filtros button').forEach(function(b){ b.onclick=function(){ FILTRO=b.dataset.f; render(); }; });
  if(!n[FILTRO]&&FILTRO!=='todos') FILTRO='todos';
  render();
  var lc=document.getElementById('lista-c');
  async function atualiza(cid,d){ var r=await sb.from('vg_candidatos').update(d).eq('id',cid); if(r.error) VG.toast(VG.erroPt(r.error),'erro'); else { var c=C.find(function(x){return x.id===cid;}); Object.assign(c,d); VG.toast('Salvo'); } }
  lc.addEventListener('change',function(e){ var a=e.target.closest('.cand'); if(!a) return; var k=e.target.dataset.k; if(k) atualiza(a.dataset.id,(function(){var o={};o[k]=e.target.value;return o;})()); });
  lc.addEventListener('click',function(e){ var b=e.target.closest('[data-nota]'); if(!b) return; var a=b.closest('.cand'), nt=+b.dataset.nota;
    a.querySelectorAll('[data-nota]').forEach(function(x){ x.classList.toggle('on',+x.dataset.nota<=nt); }); atualiza(a.dataset.id,{nota:nt}); });
  document.getElementById('bcsv').onclick=function(){
    var cols=['nome','whatsapp','email','cidade','atento','status','nota','resposta','video_link','obs','created_at'];
    var q=function(s){ return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'; };
    var csv='﻿'+cols.join(';')+'\n'+C.map(function(c){ return cols.map(function(k){ return q(k==='atento'?(c.atento?'sim':'não'):c[k]); }).join(';'); }).join('\n');
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='candidatos-'+v.data.slug+'.csv'; a.click();
  };
}
})();
</script>
</body>
</html>
