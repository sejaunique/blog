<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">

<link rel="manifest" href="/area/admin/app.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --I:https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/;
  --a-bg:#f2f2f4;--a-card:#ffffff;--a-line:rgba(0,0,0,.07);--a-chip:#ececef;--a-bar:rgba(255,255,255,.92);--a-sub:#6b6b73;
  --ic-home:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/home.svg);
  --ic-kanban:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/layout-kanban.svg);
  --ic-bell:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/bell.svg);
  --ic-predio:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/building.svg);
  --ic-menu:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/dots.svg);
  --ic-voltar:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/chevron-left.svg);
  --ic-dir:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/chevron-right.svg);
  --ic-mais:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/plus.svg);
  --ic-tabela:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/list-check.svg);
  --ic-proposta:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/file-dollar.svg);
  --ic-diag:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/stethoscope.svg);
  --ic-post:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/article.svg);
  --ic-aula:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/movie.svg);
  --ic-reuniao:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/calendar-event.svg);
  --ic-site:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/world.svg);
  --ic-alda:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/message-chatbot.svg);
  --ic-sair:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/logout.svg);
  --ic-lua:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/moon.svg);
  --ic-desk:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/device-desktop.svg);
  --ic-busca:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/search.svg);
  --ic-lixo:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/trash.svg);
  --ic-chave:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/key.svg);
  --ic-copiar:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/copy.svg);
  --ic-ok:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/checks.svg);
  --ic-resp:url(https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/message-reply.svg);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--a-bg:#000;--a-card:#141416;--a-line:rgba(255,255,255,.07);--a-chip:#232327;--a-bar:rgba(12,12,14,.92);--a-sub:#9a9aa2}}
:root[data-theme="dark"]{--a-bg:#000;--a-card:#141416;--a-line:rgba(255,255,255,.07);--a-chip:#232327;--a-bar:rgba(12,12,14,.92);--a-sub:#9a9aa2}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--a-bg);color:var(--fg);font-family:var(--font);font-size:15px;overscroll-behavior-y:none}
body{min-height:100dvh;display:block;line-height:1.45}
.tela{width:100%}
.f>*,.f label,.f input,.f select,.f textarea,.l2>*{min-width:0}
.f .l2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.f{grid-template-columns:minmax(0,1fr)}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:22px;height:22px}
/* barra de cima */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;gap:4px;background:var(--a-bar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--a-line)}
.bar h1{flex:1;margin:0 8px;font-size:1.06rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative;flex:none;color:inherit;text-decoration:none}
.ib:active{background:var(--a-chip)}
.ib .bd{position:absolute;top:6px;right:5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--magenta);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center}
/* conteúdo */
.tela{padding:calc(56px + env(safe-area-inset-top) + 12px) 14px calc(160px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
/* abas de baixo */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--a-bar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--a-line)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.66rem;font-weight:600;color:var(--a-sub);cursor:pointer;position:relative}
.tabs button .pil{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tabs button[aria-current="true"]{color:var(--fg)}
.tabs button[aria-current="true"] .pil{background:var(--a-chip)}
.tabs .bd{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--magenta);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center}
/* blocos */
.sec{margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between}
.sec h2{margin:0;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--a-sub);font-weight:700}
.sec button{border:0;background:none;color:var(--fg);font-size:.8rem;font-weight:600;cursor:pointer;padding:6px 0}
.cartao{background:var(--a-card);border-radius:18px;border:1px solid var(--a-line);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--a-line);text-decoration:none;color:inherit;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{background:var(--a-chip)}
.item .tx{flex:1;min-width:0}
.item b{display:block;font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--a-sub);font-size:.8rem;margin-top:2px;line-height:1.35}
.item .tx p{margin:6px 0 0;font-size:.86rem;line-height:1.45}
.item .dir{color:var(--a-sub);width:18px;height:18px}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:.86rem;background:var(--marinho);color:#fff}
.av.mag{background:var(--magenta)}.av.ver{background:var(--verde);color:#000}.av.pre{background:#0b0b0c;color:#fff}.av.neu{background:var(--a-chip);color:var(--fg)}
.av .ic{width:20px;height:20px}
.acoes-i{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vazio{padding:26px 16px;text-align:center;color:var(--a-sub);font-size:.88rem}
/* kpis */
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kp div{background:var(--a-card);border:1px solid var(--a-line);border-radius:18px;padding:14px}
.kp b{display:block;font-size:1.35rem;font-weight:800;letter-spacing:-.03em}
.kp small{color:var(--a-sub);font-size:.76rem}
.kp .d1{background:var(--marinho);color:#fff;border-color:transparent}.kp .d1 small{color:rgba(255,255,255,.75)}
.kp .d2{background:var(--verde);color:#000;border-color:transparent}.kp .d2 small{color:rgba(0,0,0,.6)}
.ola{margin:4px 2px 14px}
.ola h2{margin:0;font-size:1.6rem;letter-spacing:-.04em;line-height:1.05}
.ola h2 span{display:block;font-weight:200;font-style:italic}
.rolo{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none}
.rolo::-webkit-scrollbar{display:none}
.mc{flex:0 0 72%;scroll-snap-align:start;border-radius:18px;padding:14px;min-height:118px;display:flex;flex-direction:column;gap:2px;background:var(--a-card);border:1px solid var(--a-line);color:inherit;text-align:left;cursor:pointer}
.mc small{font-size:.7rem;opacity:.7}.mc span{font-size:.86rem;line-height:1.3}.mc b{margin-top:auto;font-size:1.15rem}
.mc.c-mar{background:var(--marinho);color:#fff;border:0}.mc.c-mag{background:var(--magenta);color:#fff;border:0}.mc.c-ver{background:var(--verde);color:#000;border:0}.mc.c-pre{background:#0b0b0c;color:#fff;border:0}
/* segmentos e chips */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 12px;padding:0 14px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--a-line);background:var(--a-card);border-radius:999px;padding:9px 14px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--a-sub);display:flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button i{font-style:normal;font-size:.7rem;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--a-chip);white-space:nowrap}
.chip.mag{background:color-mix(in srgb,var(--magenta-txt) 15%,transparent);color:var(--magenta-txt)}
.chip.ver{background:color-mix(in srgb,var(--verde-txt) 16%,transparent);color:var(--verde-txt)}
.chip.mar{background:var(--marinho);color:#fff}
.tgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
/* botões */
.bt{border:1px solid var(--a-line);background:var(--a-card);border-radius:999px;padding:10px 16px;font-size:.84rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit;justify-content:center}
.bt:active{transform:scale(.98)}
.bt .ic{width:18px;height:18px}
.bt.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bt.ver{background:var(--verde);color:#000;border-color:var(--verde)}
.bt.per{color:var(--erro)}
.bt.cheio{width:100%;padding:14px}
.bt.peq{padding:7px 12px;font-size:.78rem}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:19;width:58px;height:58px;border-radius:18px;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);cursor:pointer}
.fab .ic{width:26px;height:26px}
.busca{display:flex;align-items:center;gap:8px;background:var(--a-card);border:1px solid var(--a-line);border-radius:14px;padding:11px 14px;margin-bottom:12px}
.busca input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:.95rem}
.busca .ic{width:18px;height:18px;color:var(--a-sub)}
/* empresa */
.perfil{text-align:center;padding:10px 0 4px}
.perfil .av{width:76px;height:76px;font-size:1.6rem;margin:0 auto 10px}
.perfil h2{margin:0;font-size:1.35rem;letter-spacing:-.03em}
.perfil small{color:var(--a-sub)}
.rapidos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 4px}
.rapidos a,.rapidos button{border:0;background:var(--a-card);border:1px solid var(--a-line);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.66rem;font-weight:600;color:inherit;text-decoration:none;cursor:pointer}
.rapidos .ic{width:20px;height:20px}
select.inl,input.inl{border:1px solid var(--a-line);background:var(--a-bg);border-radius:10px;padding:7px 8px;font-size:.8rem;max-width:150px}
.barra{height:5px;border-radius:9px;background:var(--a-chip);overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--verde-txt)}
/* folha (bottom sheet) */
.veu{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s}
.veu.on{opacity:1}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92dvh;overflow-y:auto;background:var(--a-card);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease;max-width:560px;margin:0 auto}
.folha.on{transform:none}
.folha .fecha{position:absolute;top:8px;right:8px}
.folha .puxa{width:40px;height:5px;border-radius:3px;background:var(--a-chip);margin:4px auto 12px}
.folha h3{margin:0 0 14px;font-size:1.12rem;letter-spacing:-.02em}
.f{display:grid;gap:12px}
.f label{display:grid;gap:5px;font-size:.76rem;font-weight:600;color:var(--a-sub)}
.f input,.f select,.f textarea{border:1px solid var(--a-line);background:var(--a-bg);border-radius:12px;padding:12px;font-size:16px;color:var(--fg);width:100%}
.f textarea{min-height:90px;resize:vertical}
.f .l2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex!important;grid-template-columns:none;align-items:center;gap:10px;font-size:.92rem!important;color:var(--fg)!important;font-weight:500!important;padding:8px 0;border-bottom:1px solid var(--a-line)}
.chk input{width:20px;height:20px;flex:none}
.mch{display:flex;flex-wrap:wrap;gap:6px}
.mch label{display:inline-flex!important;align-items:center;gap:0;border:1px solid var(--a-line);border-radius:999px;padding:8px 12px;font-size:.82rem!important;color:var(--fg)!important;font-weight:500!important;background:var(--a-bg);cursor:pointer}
.mch label:has(:checked){background:var(--fg);color:var(--bg)!important;border-color:var(--fg)}
.mch input{display:none}
.dica{display:block;font-size:.72rem;font-weight:500;color:var(--a-sub)}
.dica:empty{display:none}
.dica.ok{color:var(--verde-txt);font-weight:700}
.dica.erro{color:var(--erro);font-weight:700}
.f .auto{box-shadow:0 0 0 2px var(--verde) inset}
.grp{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--a-sub);font-weight:700;margin:8px 2px -2px}
.hist{font-size:.78rem;color:var(--a-sub);display:grid;gap:8px;margin-top:4px}
.hist b{color:var(--fg)}
.op{display:grid;gap:6px}
.op button{border:1px solid var(--a-line);background:var(--a-bg);border-radius:14px;padding:14px;text-align:left;font-size:.95rem;font-weight:600;cursor:pointer;display:flex;gap:10px;align-items:center}
.op button[aria-pressed="true"]{border-color:var(--fg)}
.op button i{width:10px;height:10px;border-radius:50%;display:inline-block}
.itp{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;margin-bottom:6px}
.total{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:.86rem;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.app-c{background:var(--marinho);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.app-c p{margin:4px 0 12px;font-size:.84rem;opacity:.85;line-height:1.45}
.app-c .bt{background:#fff;color:#000;border-color:#fff}
.login{max-width:420px;margin:0 auto;padding:calc(18vh + env(safe-area-inset-top)) 20px 40px}
.login h1{font-size:1.9rem;letter-spacing:-.04em;margin:0 0 4px}
.login h1 span{display:block;font-weight:200;font-style:italic}
</style>
</head>
<body data-casco="app">
<form class="login f" id="f-login" hidden>
  <div><span class="spaced" style="color:var(--a-sub)">Unique</span><h1>Workspace<span>no seu bolso.</span></h1></div>
  <label>Senha do admin<input id="l-senha" type="password" autocomplete="current-password" required></label>
  <div id="m-login" class="chip mag" hidden></div>
  <button class="bt pri cheio" type="submit">Entrar</button>
</form>

<header class="bar" id="bar" hidden>
  <button class="ib" id="b-voltar" aria-label="Voltar" hidden><i class="ic" style="--i:var(--ic-voltar)"></i></button>
  <h1 id="titulo">Unique</h1>
  <button class="ib" id="b-sino" aria-label="Avisos"><i class="ic" style="--i:var(--ic-bell)"></i><span class="bd" id="bd-sino" hidden></span></button>
</header>
<main class="tela" id="tela" hidden></main>
<button class="fab" id="fab" hidden aria-label="Novo"><i class="ic" style="--i:var(--ic-mais)"></i></button>
<nav class="tabs" id="tabs" hidden>
  <button data-t="inicio"><span class="pil"><i class="ic" style="--i:var(--ic-home)"></i></span>Início</button>
  <button data-t="crm"><span class="pil"><i class="ic" style="--i:var(--ic-kanban)"></i></span>CRM</button>
  <button data-t="avisos"><span class="pil"><i class="ic" style="--i:var(--ic-bell)"></i></span>Avisos<span class="bd" id="bd-tab" hidden></span></button>
  <button data-t="clientes"><span class="pil"><i class="ic" style="--i:var(--ic-predio)"></i></span>Clientes</button>
  <button data-t="mais"><span class="pil"><i class="ic" style="--i:var(--ic-menu)"></i></span>Mais</button>
</nav>
<div class="veu" id="veu" hidden></div>
<div class="folha" id="folha" hidden></div>

<script src="/blog/posts.js"></script>
<script src="/area/admin/crm-form.js"></script>
<script>
(function(){
  /* versão de computador */
  if(matchMedia('(min-width: 900px)').matches && !/[?&]app=1/.test(location.search)){ location.replace('/area/admin/'+location.hash); return; }

  var ETAPA={lead:['Lead','var(--a-sub)'],qualificado:['Lead qualificado','#f0a020'],cliente:['Cliente','var(--verde-txt)'],finalizado:['Finalizado','var(--marinho-txt)']};
  var ST={a_fazer:'A fazer',fazendo:'Em andamento',feito:'Feito',arquivado:'Arquivado'};
  function fechado(st){ return st==='feito'||st==='arquivado'; }
  var USTATUS={convite:'Sem acesso ainda',pendente:'Pediu acesso',ativo:'Com acesso',bloqueado:'Bloqueado',recusado:'Recusado'};
  var TIPO={acao:'Ação',post:'Post',video:'Videoaula',reuniao:'Reunião',material:'Material'};
  var PST={rascunho:'Rascunho',enviada:'Enviada',aceita:'Aceita',recusada:'Recusada'};
  var R=null, AC=null, PROPS=[], DIAGS=[], NOTIF=[], PILHA=[], ABA='inicio';
  var F={crm:'lead',tag:'',avisos:'pede',acoes:'',cli:'',modo:'emp',neg:'Lead',lista:'emp',seg:'',tc:''};
  var $=function(id){return document.getElementById(id);};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function ic(n){ return '<i class="ic" style="--i:var(--ic-'+n+')"></i>'; }

  function get(q){ return fetch('/api/area'+q,{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}); }

      '<label>Título<input name="titulo" value="'+esc(p.titulo||'')+'"></label>'+
      '<label>Serviço<select name="servico"><option value="">–</option>'+(R.tags||[]).map(function(t){return '<option'+(p.servico===t?' selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select></label>'+
      '<label>Contexto<textarea name="contexto">'+esc(p.contexto||'')+'</textarea></label>'+
      '<label>Objetivos (um por linha)<textarea name="objetivos">'+ls(p.objetivos)+'</textarea></label>'+
      '<label>O que está incluso (um por linha)<textarea name="escopo">'+ls(p.escopo)+'</textarea></label>'+
      '<label>Etapas (um por linha)<textarea name="etapas">'+ls(p.etapas)+'</textarea></label>'+
      '<div><div class="sec" style="margin-top:0"><h2>Investimento</h2><button type="button" data-add>+ Item</button></div><div id="pi"></div><div>Total <span class="total" id="pt"></span></div></div>'+
      '<label>Forma de pagamento<textarea name="pagamento" style="min-height:60px">'+esc(p.pagamento||'')+'</textarea></label>'+
      '<div class="l2"><label>Válida até<input type="date" name="validade" value="'+esc(p.validade||'')+'"></label><label>Status<select name="status">'+Object.keys(PST).map(function(k){return '<option value="'+k+'"'+(p.status===k?' selected':'')+'>'+PST[k]+'</option>';}).join('')+'</select></label></div>'+
      '<label>Observações<textarea name="observacoes" style="min-height:60px">'+esc(p.observacoes||'')+'</textarea></label>'+
      '<label>Notas internas (só você)<textarea name="notas" style="min-height:60px">'+esc(p.notas||'')+'</textarea></label>'+
      '<button class="bt pri cheio">Salvar</button><button type="button" class="bt ver cheio" data-env>'+ic('whatsapp')+'Salvar e enviar</button></form>',function(f){
      var fm=f.querySelector('form');
      function itens(){ f.querySelector('#pi').innerHTML=IT.map(function(i,k){return '<div class="itp"><input data-i="'+k+'" data-c="descricao" placeholder="Descrição" value="'+esc(i.descricao)+'"><input data-i="'+k+'" data-c="valor" placeholder="R$" inputmode="decimal" value="'+esc(i.valor)+'"><button type="button" class="ib" data-rm="'+k+'">'+ic('x')+'</button></div>';}).join(''); tot(); }
      function tot(){ f.querySelector('#pt').textContent=brl(IT.reduce(function(t,i){return t+(+String(i.valor).replace(',','.')||0);},0)); }
      itens();
      f.oninput=function(ev){ var t=ev.target; if(t.dataset.i){ IT[+t.dataset.i][t.dataset.c]=t.value; tot(); } };
      if(fm.slug) fm.slug.onchange=function(){ f.querySelector('#pc').hidden=!!this.value; };
      function envia(enviar){
        var o={id:p.id||'',titulo:fm.titulo.value,servico:fm.servico.value,contexto:fm.contexto.value,objetivos:fm.objetivos.value,escopo:fm.escopo.value,etapas:fm.etapas.value,itens:IT,pagamento:fm.pagamento.value,validade:fm.validade.value,observacoes:fm.observacoes.value,notas:fm.notas.value,status:enviar&&fm.status.value==='rascunho'?'enviada':fm.status.value,contato:p.contato||''};

          fechaFolha(); toast(r.novo?r.proposta.empresa+' entrou como lead qualificado.':'Proposta salva.');

      fm.onsubmit=function(ev){ ev.preventDefault(); envia(false); };

        if(b.hasAttribute('data-del')){ if(b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Excluir?'; return; } post({a:'admin-proposta-del',id:p.id}).then(function(){ fechaFolha(); carrega().then(desenha); }); } };
    });
  }
