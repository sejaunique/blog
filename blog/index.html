<style>
/* Layout: cabeçalho com menu em pílula no centro; páginas centralizadas; capas grandes com cantos arredondados; texto em coluna estreita com ícones de compartilhar ao lado. Preto e branco da Unique, verde só no grifo. */
:root{
  --bg:#ffffff;
  --fg:#0b0b0c;
  --muted:#6a6a70;
  --line:#e6e6e8;
  --soft:#f4f4f5;
  --pill:#0b0b0c;
  --pill-fg:#ffffff;
  --ph:#0b0b0c;
  --ph-fg:#ffffff;
  --grifo:#00e676;
  --focus:#dc0a5a;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --wide:1120px;
  --read:600px;
  --r:28px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--fg:#f5f5f5;--muted:#9a9aa1;--line:#232326;--soft:#111113;--pill:#f5f5f5;--pill-fg:#000;--ph:#141416;--ph-fg:#f5f5f5;--grifo:#00ff80;--focus:#ff2e7e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000;--fg:#f5f5f5;--muted:#9a9aa1;--line:#232326;--soft:#111113;--pill:#f5f5f5;--pill-fg:#000;--ph:#141416;--ph-fg:#f5f5f5;--grifo:#00ff80;--focus:#ff2e7e;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.75;margin:0;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:var(--wide);margin-inline:auto;padding-inline:20px}
a:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.grifo{background:none;color:inherit;padding:0;text-decoration:underline;text-decoration-color:var(--grifo);text-decoration-thickness:max(2px,.06em);text-underline-offset:.16em;text-decoration-skip-ink:none}
strong{font-weight:700}
.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;min-height:76px}
.brand{justify-self:start;display:flex;align-items:center;text-decoration:none}
.brand svg{height:16px;width:auto;color:var(--fg)}
.pill{display:flex;align-items:center;gap:4px;background:var(--pill);color:var(--pill-fg);border-radius:999px;padding:5px 5px 5px 18px}
.pill a{text-decoration:none;font-size:.78rem;font-weight:500;padding:6px 10px;opacity:.75;border-radius:999px}
.pill a:hover,.pill a[aria-current="page"]{opacity:1}
.pill .round{opacity:1;width:32px;height:32px;padding:0;display:grid;place-items:center;background:var(--pill-fg);color:var(--pill);margin-left:6px}
.pill .round .icon{width:15px;height:15px}
.social{justify-self:end;display:flex;gap:6px}
.social a{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--fg);text-decoration:none}
.social a:hover{background:var(--soft)}

/* elementos comuns */
.tag{display:inline-block;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;line-height:1.4}
.cover{border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;max-width:100%;background:var(--ph)}
.cover img{width:100%;height:100%;object-fit:cover}
.ph{position:relative;width:100%;height:100%;display:grid;place-items:center;background:var(--ph);color:var(--ph-fg)}
.ph svg{height:46%;width:auto}
.ph span{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:.62rem;font-weight:300;text-transform:uppercase;letter-spacing:.5em;opacity:.7}

/* abertura da lista */
.hero{text-align:center;padding-block:56px 48px}
.hero h1{font-size:clamp(2rem,5.4vw,3.4rem);line-height:1.1;font-weight:500;letter-spacing:-.025em;margin:18px auto 16px;max-width:18ch;text-wrap:balance}
.hero p{margin:0 auto;max-width:48ch;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:30px}
.chip{font:inherit;font-size:.72rem;font-weight:500;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
.chip:hover{color:var(--fg);border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--pill-fg);border-color:var(--pill)}
.ordem{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;font-size:.72rem;color:var(--muted)}
.ordem select{font:inherit;font-size:.72rem;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 30px 7px 14px;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.card .row .n{display:inline-flex;align-items:center;gap:4px}
.card .row .n .icon{width:13px;height:13px}

/* grade de posts */
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 28px}
.card a{display:flex;flex-direction:column;gap:14px;text-decoration:none}
.card .cover{aspect-ratio:4/3;border-radius:22px;transition:transform .3s ease}
.card a:hover .cover{transform:scale(.985)}
.card .row{display:flex;align-items:center;gap:12px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card .txt{display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:1.35rem;line-height:1.3;font-weight:500;letter-spacing:-.015em;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.6}
.card .cover img{filter:grayscale(1);transition:filter .5s}
.card a:hover .cover img,.card a:focus-visible .cover img{filter:none}
.about img{filter:grayscale(1);transition:filter .5s}.about img:hover{filter:none}
.grid .card:first-child{grid-column:1/-1}
.grid .card:first-child a{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;align-items:center}
.grid .card:first-child .cover{aspect-ratio:16/10;border-radius:var(--r)}
.grid .card:first-child h2{font-size:clamp(1.5rem,3vw,2.1rem)}
.grid .card:first-child .txt{display:flex;flex-direction:column;gap:14px;min-width:0}
.empty{text-align:center;color:var(--muted);padding-block:40px}

/* sobre */
.about{margin-top:112px;padding:40px;background:var(--soft);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:44px;align-items:center}
.about img{width:100%;height:auto;border-radius:18px;background:#000}
.about h2{font-size:1.7rem;font-weight:500;line-height:1.2;letter-spacing:-.015em;margin:14px 0 12px}
.about p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.about .btns{margin-top:22px}
.bio-l{margin:0 0 6px;padding-left:1.1em;color:var(--muted);display:grid;gap:4px}
.about p strong{color:var(--fg)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;text-decoration:none;border-radius:999px;padding:11px 20px;border:1px solid var(--fg)}
.btn.solid{background:var(--pill);color:var(--pill-fg);border-color:var(--pill)}
.btn:hover{opacity:.85}
button.btn{font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;background:transparent;color:inherit}
button.btn.solid{background:var(--pill);color:var(--pill-fg)}
.cta-ok{flex-basis:100%;font-size:.78rem;color:var(--muted)}
.cta .btn .icon{width:15px;height:15px}
#sheet[hidden]{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);background:var(--bg);color:var(--fg);border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));z-index:41;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-x{background:var(--soft);border:0;color:var(--fg);width:34px;height:34px;border-radius:50%;font-size:1.3rem;line-height:1;cursor:pointer}
.sheet-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sheet-grid a,.sheet-grid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:16px;background:var(--soft);border:0;color:var(--fg);text-decoration:none;font:inherit;font-size:.72rem;cursor:pointer}
.sheet-grid .icon{width:22px;height:22px}
.sheet-ok{margin:14px 0 0;font-size:.8rem;color:var(--muted);text-align:center;word-break:break-all}
@media (min-width:681px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:22px}}


/* post */
.head{text-align:center;padding-block:44px 44px}
.head h1{font-size:clamp(2rem,5.4vw,3.3rem);line-height:1.12;font-weight:500;letter-spacing:-.025em;margin:18px auto 16px;max-width:20ch;text-wrap:balance}
.head .sub{margin:0 auto;max-width:52ch;color:var(--muted);font-size:.95rem;line-height:1.65}
.meta{display:flex;justify-content:center;margin-top:30px}
.meta div{padding-inline:32px;text-align:center;font-size:.72rem;line-height:1.5;font-variant-numeric:tabular-nums}
.meta div+div{border-left:1px solid var(--line)}
.meta b{display:block;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-bottom:2px}
.meta span{color:var(--muted)}
.post .cover{max-width:920px;margin-inline:auto;aspect-ratio:16/9}
.body{position:relative;max-width:var(--read);margin:56px auto 0}
.share{position:absolute;left:-84px;top:4px;height:100%}
.share div{position:sticky;top:110px;display:flex;flex-direction:column;gap:6px}
.share a,.share button{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;color:var(--fg);cursor:pointer;text-decoration:none;font:inherit}
.share a:hover,.share button:hover{background:var(--soft)}
.copied{position:absolute;left:40px;white-space:nowrap;font-size:.7rem;color:var(--muted)}
.content>*{margin:0 0 1.2em}
.content>p:first-child{font-size:1.08rem}
.content h2{font-size:1.45rem;line-height:1.3;font-weight:500;letter-spacing:-.015em;margin:1.9em 0 .6em}
.content>h2:first-child{margin-top:0}
.content blockquote{margin:2em 0;padding:26px 30px;background:var(--soft);border-radius:18px;font-size:1.2rem;line-height:1.5;font-weight:500}
.content ul{padding-left:1.1em}
.content li{margin-bottom:.35em}
.content a{text-underline-offset:3px}
.content figure{margin:2em 0}
.content figure img{border-radius:18px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:2em 0}
.pair figure{margin:0}
.pair img{aspect-ratio:4/3;object-fit:cover;width:100%}
.content figcaption{font-size:.78rem;color:var(--muted);margin-top:10px;text-align:center}
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:var(--ph)}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-link{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:18px;background:var(--ph);color:var(--ph-fg);text-decoration:none}
.video-link .play{width:44px;height:44px;border-radius:50%;background:var(--ph-fg);color:var(--ph);display:grid;place-items:center;flex:none;font-size:.8rem}
.video-link small{display:block;opacity:.65;font-size:.72rem;word-break:break-all}
.cta{margin-top:48px;padding:28px 30px;border:1px solid var(--line);border-radius:22px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.cta p{margin:0;font-weight:600;font-size:1.05rem;max-width:30ch;line-height:1.4}
.btn.liked{background:var(--soft);border-color:var(--fg)}
.btn.liked .icon{fill:currentColor}
.coments{margin-top:56px;padding-top:40px;border-top:1px solid var(--line)}
.coments h3{font-size:1.25rem;font-weight:500;letter-spacing:-.01em;margin:0 0 20px}
.cform{display:grid;gap:10px}
.cform input,.cform textarea{font:inherit;font-size:.92rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.cform textarea{min-height:110px;resize:vertical;line-height:1.6}
.cform input:focus,.cform textarea:focus{outline:2px solid var(--focus);outline-offset:1px}
.cform .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.cform .linha{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cform small{color:var(--muted);font-size:.75rem}
.cform .msg{font-size:.8rem;color:var(--muted);margin:0}
.clist{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:14px}
.clist li{background:var(--soft);border-radius:18px;padding:16px 18px}
.clist b{font-size:.85rem}
.clist time{font-size:.72rem;color:var(--muted);margin-left:8px}
.clist p{margin:6px 0 0;font-size:.95rem;line-height:1.65;white-space:pre-line;overflow-wrap:anywhere}
.cvazio{color:var(--muted);font-size:.9rem;margin:24px 0 0}
.more{margin-top:100px;padding-top:56px;border-top:1px solid var(--line)}
.more h3{text-align:center;font-size:1.5rem;font-weight:500;letter-spacing:-.015em;margin:0 0 36px}
.more .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.more .grid .card:first-child{grid-column:auto}
.more .grid .card:first-child a{display:flex;flex-direction:column;gap:14px}
.more .grid .card:first-child .cover{aspect-ratio:4/3;border-radius:22px}
.more .grid .card:first-child h2{font-size:1.1rem}
.more .card h2{font-size:1.1rem}
.more .card p{display:none}

/* rodapé */
.foot{margin-top:112px;border-top:1px solid var(--line)}
.foot .wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;padding-block:32px}
.foot .mk{display:flex;align-items:center;gap:12px;font-size:.75rem;line-height:1.3;color:var(--muted)}
.foot .mk svg{height:30px;width:auto;color:var(--fg)}
.foot nav{display:flex;flex-wrap:wrap;gap:22px;font-size:.78rem}
.foot nav a{text-decoration:none;color:var(--muted)}
.foot nav a:hover{color:var(--fg)}

@media (max-width:900px){
  .share{position:static;height:auto;margin-bottom:28px}
  .share div{position:static;flex-direction:row;justify-content:center}
  .copied{position:static;align-self:center}
  .grid,.more .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:680px){
  .top .wrap{grid-template-columns:auto 1fr;min-height:64px}
  .social{display:none}
  .pill{justify-self:end;padding-left:10px}
  .pill a{padding:6px 7px}
  /* celular: lista compacta, estilo playlist */
  .grid,.more .grid{grid-template-columns:1fr;gap:6px}
  .card a,.grid .card:first-child a,.more .grid .card:first-child a{display:grid;grid-template-columns:136px minmax(0,1fr);gap:14px;align-items:center;padding:6px 0}
  .card .cover,.grid .card:first-child .cover,.more .grid .card:first-child .cover{aspect-ratio:16/9;border-radius:12px}
  .card a:hover .cover{transform:none}
  .card .cover .ph span{display:none}
  .card .txt,.grid .card:first-child .txt{gap:4px}
  .card h2,.grid .card:first-child h2,.more .card h2,.more .grid .card:first-child h2{font-size:.98rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
  .card p{display:none}
  .card .row{gap:8px;font-size:.68rem;flex-wrap:wrap;row-gap:2px}
  .card .row .tag{font-size:.55rem;padding:2px 8px;letter-spacing:.1em}
  .hero{padding-block:24px 22px}
  .hero h1{font-size:1.9rem;margin:12px auto 10px}
  .hero p{font-size:.88rem;line-height:1.6}
  .filters{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;margin:20px -20px 0;padding:0 20px 4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .ordem{justify-content:flex-start;margin-top:12px}
  .more{margin-top:64px;padding-top:36px}
  .more h3{font-size:1.2rem;margin-bottom:16px;text-align:left}
  .about{grid-template-columns:1fr;padding:24px;gap:24px}
  .about img{max-width:200px}
  .meta div{padding-inline:16px}
  .head,.hero{padding-block:32px 32px}
  .body{margin-top:36px}
}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .35s ease-out both}
  @keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
<style>/* leitura e foco: no modo escuro o fundo é #111113 (padrão Unique) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--soft:#18181b;--line:#2a2a2e}}
:root[data-theme="dark"]{--bg:#111113;--soft:#18181b;--line:#2a2a2e}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#inicio" aria-label="Início do blog"><i data-svg="logo"></i></a>
    <nav class="pill" aria-label="Principal">
      <a href="#inicio" data-nav="inicio">Posts</a>
      <a href="#sobre" data-nav="sobre">Sobre</a>
      <a href="/">Site</a>
      <a class="round" data-link="whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp"><i data-icon="chat"></i></a>
    </nav>
    <div class="social">
      <a data-link="instagram" target="_blank" rel="noopener" aria-label="Instagram"><i data-icon="insta"></i></a>
      <a data-link="whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp"><i data-icon="chat"></i></a>
      <a href="/" aria-label="Site da Unique"><i data-icon="globe"></i></a>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="foot">
  <div class="wrap">
    <div class="mk"><i data-svg="mark"></i><span>Consultoria<br>em Vendas</span></div>
    <nav aria-label="Contato">
      <a href="/">Site Unique</a>
      <a data-link="instagram" target="_blank" rel="noopener">Instagram</a>
      <a data-link="whatsapp" target="_blank" rel="noopener">WhatsApp</a>
    </nav>
  </div>
</footer>

<script src="posts.js"></script>
<script>
(function(){
  var C = window.BLOG || {}, POSTS = (window.POSTS || []).slice(), L = C.links || {};

  function api(metodo, dados, q){

  var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  function data(d){ var p=d.split('-'); return +p[2]+' '+MESES[+p[1]-1]+' '+p[0]; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function inline(s){
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/==(.+?)==/g,'<mark class="grifo">$1</mark>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function plain(s){ return String(s).replace(/==|\*\*/g,''); }
  function minutos(t){ return Math.max(1, Math.round(t.split(/\s+/).length/200)); }

  function capa(p, noPost){
    var yt=p.video?ytId(p.video):null;

    var img=p.capa||(yt?'https://img.youtube.com/vi/'+yt+'/hqdefault.jpg':'');
    if(img) return '<div class="cover"><img src="'+esc(img)+'" alt="" loading="lazy"></div>';
    return '<div class="cover"><div class="ph">'+MARK+'<span>'+esc(p.categoria||'')+'</span></div></div>';
  }

  function ytId(u){ var m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/); return m?m[1]:null; }
  var preview = /claude|anthropic/.test(location.hostname);
  function video(u, leg){
    var id=ytId(u), cap=leg?'<figcaption>'+inline(leg)+'</figcaption>':'';
    if(/\.(mp4|webm|mov)(\?|$)/i.test(u)) return '<figure><div class="video"><video controls preload="metadata" src="'+esc(u)+'"></video></div>'+cap+'</figure>';
    if(id && !preview) return '<figure><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/'+id+'" title="Vídeo" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>'+cap+'</figure>';
    return '<figure><a class="video-link" href="'+esc(u)+'" target="_blank" rel="noopener"><span class="play" aria-hidden="true">▶</span><span><strong>Assistir o vídeo</strong><small>'+esc(u)+'</small></span></a>'+cap+'</figure>';
  }
  function corpo(txt){
    return txt.trim().split(/\n\s*\n/).map(function(b){
      b=b.trim(); var m;
      if(b.indexOf('## ')===0) return '<h2>'+inline(b.slice(3))+'</h2>';
      if(b.indexOf('> ')===0) return '<blockquote>'+inline(b.replace(/^>\s?/gm,''))+'</blockquote>';
      if((m=b.match(/^!\[([^\]]*)\]\(([^)]+)\)$/))) return '<figure><img src="'+esc(m[2])+'" alt="'+esc(m[1])+'" loading="lazy">'+(m[1]?'<figcaption>'+inline(m[1])+'</figcaption>':'')+'</figure>';
      var ls=b.split(/\n/); if(ls.length>1 && ls.every(function(l){return /^!\[[^\]]*\]\([^)]+\)$/.test(l.trim());})) return '<div class="pair">'+ls.map(function(l){var q=l.trim().match(/^!\[([^\]]*)\]\(([^)]+)\)$/);return '<figure><img src="'+esc(q[2])+'" alt="'+esc(q[1])+'" loading="lazy">'+(q[1]?'<figcaption>'+inline(q[1])+'</figcaption>':'')+'</figure>';}).join('')+'</div>';
      if((m=b.match(/^\[video(?::\s*([^\]]*))?\]\(([^)]+)\)$/i))) return video(m[2],m[1]);
      if(/^- /.test(b)) return '<ul>'+b.split(/\n/).map(function(l){return '<li>'+inline(l.replace(/^- /,''))+'</li>';}).join('')+'</ul>';
      return '<p>'+inline(b).replace(/\n/g,'<br>')+'</p>';
    }).join('');
  }

  function card(p){

  function lista(manter){

      (vis.length?'<ul class="grid">'+vis.map(card).join('')+'</ul>':'<p class="empty">Nenhum post nesse assunto ainda.</p>')+

    app.querySelectorAll('.chip').forEach(function(b){ b.onclick=function(){ filtro=b.dataset.cat; lista(true); }; });
    document.getElementById('ordem').onchange=function(){ ordem=this.value; lista(true); };

  function post(p){
    var outros=POSTS.filter(function(x){return x!==p;}).slice(0,3);
    var url=location.origin+'/blog/'+p.slug+'/', titulo=plain(p.titulo);
    document.title=titulo+' · '+(C.nome||'Blog');
    app.innerHTML='<article class="view wrap post">'+

      '<section class="coments" id="comentarios"><h3>Comentários</h3>'+

      '</article>';
    app.querySelectorAll('.js-share').forEach(function(bt){ bt.onclick=function(){ compartilhar(titulo, plain(p.resumo||''), url); }; });
    var arte=storyArte(p);
    app.querySelectorAll('.js-story').forEach(function(bt){ bt.onclick=function(){ postarStory(arte, p, url); }; });
    interacoes(p);

  function quando(iso){
    var d=new Date(iso), s=(Date.now()-d)/1000;
    if(s<60) return 'agora';
    if(s<3600) return 'há '+Math.floor(s/60)+' min';
    if(s<86400) return 'há '+Math.floor(s/3600)+' h';
    if(s<86400*7) return 'há '+Math.floor(s/86400)+' dia'+(s<172800?'':'s');
    return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear();
  }
  function itemComentario(c){ return '<li><b>'+esc(c.nome)+'</b><time datetime="'+esc(c.data)+'">'+quando(c.data)+'</time><p>'+esc(c.texto)+'</p></li>'; }

  function interacoes(p){
    var slug=p.slug;
    // visualização: conta uma vez por dia por navegador
    var hoje=new Date().toISOString().slice(0,10), kv='v:'+slug;
    if(guardado(kv)!==hoje){ api('POST',{a:'view',slug:slug}).then(function(j){ if(j.ok){ guardado(kv,hoje); if(j.views) ST.views[slug]=j.views; } }).catch(function(){}); }

    // curtir
    var bt=app.querySelector('.js-like'), kl='l:'+slug, busy=false;
    function pintar(){
      var on=guardado(kl)==='1', q=n('likes',slug);
      bt.classList.toggle('liked',on); bt.setAttribute('aria-pressed',on);
      bt.querySelector('span').textContent=(on?'Curtido':'Curtir')+(q?' · '+q:'');
    }
    pintar();
    bt.onclick=function(){
      if(busy) return; busy=true;
      var on=guardado(kl)==='1', d=on?-1:1;
      guardado(kl,on?null:'1'); ST.likes[slug]=Math.max(0,n('likes',slug)+d); pintar();
      api('POST',{a:'like',slug:slug,d:d}).then(function(j){ if(j.ok){ ST.likes[slug]=j.likes; } else { guardado(kl,on?'1':null); ST.likes[slug]=Math.max(0,n('likes',slug)-d); } pintar(); busy=false; })
        .catch(function(){ guardado(kl,on?'1':null); ST.likes[slug]=Math.max(0,n('likes',slug)-d); pintar(); busy=false; });
    };

    // comentários
    var box=app.querySelector('.coments'), ul=box.querySelector('.clist'), h3=box.querySelector('h3'), f=box.querySelector('form'), msg=f.querySelector('.msg');
    function titulo(q){ h3.textContent='Comentários'+(q?' ('+q+')':''); }
    var lista=[];
    function desenhar(){ titulo(lista.length); ul.innerHTML=lista.map(itemComentario).join(''); if(!lista.length) ul.innerHTML='<li class="cvazio" style="background:none;padding:0">Seja o primeiro a comentar.</li>'; }
    api('GET',null,'?a=comments&slug='+encodeURIComponent(slug)).then(function(j){
      if(j.off||j._status===503){ ul.innerHTML='<li class="cvazio" style="background:none;padding:0">Os comentários abrem em breve.</li>'; f.querySelector('button').disabled=true; return; }
      if(j.ok){ lista=j.comentarios||[]; desenhar(); }
    }).catch(function(){});
    f.onsubmit=function(e){
      e.preventDefault();
      var nome=f.nome.value.trim(), texto=f.texto.value.trim(), b=f.querySelector('button[type=submit]');
      if(nome.length<2||texto.length<2){ msg.hidden=false; msg.textContent='Preencha seu nome e o comentário.'; return; }
      b.disabled=true; msg.hidden=false; msg.textContent='Enviando...';
      guardado('nome', nome);
      api('POST',{a:'comment',slug:slug,nome:nome,texto:texto,site:f.site.value}).then(function(j){
        b.disabled=false;
        if(j.ok && j.comentario){ lista.unshift(j.comentario); ST.comentarios[slug]=n('comentarios',slug)+1; desenhar(); f.texto.value=''; msg.textContent='Comentário publicado. Obrigado!'; }
        else msg.textContent=j.erro||'Não deu para enviar agora. Tente de novo.';
      }).catch(function(){ b.disabled=false; msg.textContent='Não deu para enviar agora. Tente de novo.'; });
    };
    var nm=guardado('nome'); if(nm) f.nome.value=nm;
  }

  // Compartilhar: no celular abre o menu do próprio aparelho (WhatsApp, Instagram, etc.).
  // Onde o navegador não tem esse menu (computador ou navegador dentro de apps), abre a nossa lista de opções.
  function compartilhar(titulo, resumo, url){
    if(navigator.share){
      navigator.share({title:titulo, text:titulo, url:url}).catch(function(e){ if(!e || e.name!=='AbortError') abrirOpcoes(titulo, url); });
    } else abrirOpcoes(titulo, url);
  }
  function abrirOpcoes(titulo, url){
    var u=encodeURIComponent(url), t=encodeURIComponent(titulo), tu=encodeURIComponent(titulo+' '+url);
    var ops=[
      ['WhatsApp','https://wa.me/?text='+tu,'chat'],
      ['LinkedIn','https://www.linkedin.com/sharing/share-offsite/?url='+u,'linkedin'],
      ['Facebook','https://www.facebook.com/sharer/sharer.php?u='+u,'facebook'],
      ['Telegram','https://t.me/share/url?url='+u+'&text='+t,'send'],
      ['X','https://x.com/intent/post?text='+t+'&url='+u,'x'],
      ['E-mail','mailto:?subject='+t+'&body='+tu,'mail']
    ];
    var el=document.getElementById('sheet');
    if(!el){ el=document.createElement('div'); el.id='sheet'; document.body.appendChild(el); }
    el.innerHTML='<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Compartilhar"><div class="sheet-head"><b>Compartilhar</b><button type="button" class="sheet-x" data-close aria-label="Fechar">×</button></div><div class="sheet-grid">'+
      ops.map(function(o){ return '<a href="'+o[1]+'" target="_blank" rel="noopener">'+icon(o[2])+'<span>'+o[0]+'</span></a>'; }).join('')+
      '<button type="button" id="sheet-copy">'+icon('link')+'<span>Copiar link</span></button></div><p class="sheet-ok" id="sheet-ok" hidden>Link copiado. É só colar onde quiser.</p></div>';
    el.hidden=false;
    el.querySelectorAll('[data-close]').forEach(function(x){ x.onclick=function(){ el.hidden=true; }; });
    el.querySelectorAll('.sheet-grid a').forEach(function(x){ x.addEventListener('click',function(){ setTimeout(function(){el.hidden=true;},300); }); });
    var ok=document.getElementById('sheet-ok');
    document.getElementById('sheet-copy').onclick=function(){
      var show=function(){ ok.hidden=false; };
      try{ navigator.clipboard.writeText(url).then(show,function(){ ok.textContent=url; show(); }); }catch(e){ ok.textContent=url; show(); }
    };
    document.onkeydown=function(e){ if(e.key==='Escape') el.hidden=true; };
  }

  // Stories do Instagram: monta uma arte 1080x1920 com a capa e o título do post.
  // No celular abre o menu do aparelho já com a imagem (escolha Instagram > Stories).
  // O link do post vai copiado, para colar na figurinha "Link" do Stories.
  function storyArte(p){
    return new Promise(function(ok){
      var W=1080,H=1920,c=document.createElement('canvas'); c.width=W; c.height=H;
      var g=c.getContext('2d');
      var logo=null;
      function fim(img){
        var fonte='"Montserrat",system-ui,Arial,sans-serif';
        g.fillStyle='#000'; g.fillRect(0,0,W,H);
        var y=150;
        // logo
        g.fillStyle='#fff'; g.font='700 34px '+fonte; g.textBaseline='top';
        if(logo) g.drawImage(logo, 90, y, 216, 48); else g.fillText('UNIQUE', 90, y);
        g.fillStyle='#9a9aa1'; g.font='500 26px '+fonte; g.fillText('Blog · Canivete de Vendas', 90, y+70);
        y=300;
        if(img){
          var iw=900, ih=Math.round(iw*9/16), x=90, r=36;
          g.save(); g.beginPath();
          if(g.roundRect) g.roundRect(x,y,iw,ih,r); else g.rect(x,y,iw,ih);
          g.clip();
          var s=Math.max(iw/img.width, ih/img.height), dw=img.width*s, dh=img.height*s;
          g.drawImage(img, x+(iw-dw)/2, y+(ih-dh)/2, dw, dh); g.restore();
          y+=ih+80;
        } else y+=120;
        // categoria
        var cat=(p.categoria||'').toUpperCase();
        if(cat){ g.font='700 28px '+fonte; var cw=g.measureText(cat).width+48;
          g.fillStyle='#00ff80'; if(g.roundRect){g.beginPath();g.roundRect(90,y,cw,56,28);g.fill();} else g.fillRect(90,y,cw,56);
          g.fillStyle='#000'; g.fillText(cat, 114, y+14); y+=100; }
        // título
        var tit=plain(p.titulo), tam=86;
        function linhas(t){ g.font='800 '+tam+'px '+fonte; var ws=t.split(' '), ls=[], l='';
          ws.forEach(function(w){ var tt=l?l+' '+w:w; if(g.measureText(tt).width>900&&l){ls.push(l);l=w;} else l=tt; }); if(l) ls.push(l); return ls; }
        var ls=linhas(tit); while(ls.length>5&&tam>56){ tam-=6; ls=linhas(tit); }
        g.fillStyle='#fff';
        ls.forEach(function(l){ g.fillText(l, 90, y); y+=Math.round(tam*1.1); });
        // chamada
        var cy=H-330;
        g.fillStyle='#fff'; if(g.roundRect){g.beginPath();g.roundRect(90,cy,900,130,65);g.fill();} else g.fillRect(90,cy,900,130);
        g.fillStyle='#000'; g.font='800 40px '+fonte; g.textAlign='center'; g.fillText('LEIA O POST COMPLETO ↗', W/2, cy+44); g.textAlign='left';
        g.fillStyle='#9a9aa1'; g.font='500 30px '+fonte; g.textAlign='center'; g.fillText('sejaunique.vercel.app/blog', W/2, cy+170); g.textAlign='left';
        c.toBlob(function(b){ ok(b?new File([b], p.slug+'-stories.png', {type:'image/png'}):null); }, 'image/png');
      }
      var pronto=(document.fonts&&document.fonts.ready)||Promise.resolve();
      var lg=new Image(), lgSrc='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO.replace('fill="currentColor"','fill="#ffffff"').replace('<svg ','<svg width="2696" height="600" '));
      var logoPronto=new Promise(function(r){ lg.onload=function(){ logo=lg; r(); }; lg.onerror=r; lg.src=lgSrc; });
      Promise.all([pronto,logoPronto]).then(function(){
        if(!p.capa) return fim(null);
        var im=new Image(); im.onload=function(){ fim(im); }; im.onerror=function(){ fim(null); }; im.src=p.capa;
      });
    });
  }
  function avisoStory(txt){
    var el=document.getElementById('sheet');
    if(!el){ el=document.createElement('div'); el.id='sheet'; document.body.appendChild(el); }
    el.innerHTML='<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Stories"><div class="sheet-head"><b>Postar nos Stories</b><button type="button" class="sheet-x" data-close aria-label="Fechar">×</button></div><p style="margin:0;font-size:.85rem;line-height:1.6">'+txt+'</p></div>';
    el.hidden=false;
    el.querySelectorAll('[data-close]').forEach(function(x){ x.onclick=function(){ el.hidden=true; }; });
  }
  function postarStory(arte, p, url){
    try{ navigator.clipboard.writeText(url).catch(function(){}); }catch(e){}
    arte.then(function(f){
      if(!f){ compartilhar(plain(p.titulo),'',url); return; }
      if(navigator.canShare && navigator.canShare({files:[f]})){
        navigator.share({files:[f]}).then(function(){
          avisoStory('Pronto! O link do post já está copiado: no Stories, toque na figurinha <b>Link</b> e cole.');
        }).catch(function(e){ if(e && e.name!=='AbortError') baixar(f); });
      } else baixar(f);
    });
    function baixar(f){
      var a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
      avisoStory('Baixamos a arte do Stories para você. Abra o Instagram, crie um Stories com essa imagem e use a figurinha <b>Link</b> para colar o endereço do post (já copiado).');
    }
  }

  function rota(){
    var h=location.hash.replace('#','');
    var p=POSTS.filter(function(x){return x.slug===h;})[0];
    document.querySelectorAll('[data-nav]').forEach(function(a){a.removeAttribute('aria-current');});
    if(p){ post(p); window.scrollTo(0,0); return; }
    document.title=C.nome||'Blog';
    lista();
    var n=document.querySelector('[data-nav="'+(h==='sobre'?'sobre':'inicio')+'"]'); if(n) n.setAttribute('aria-current','page');
    if(h==='sobre'){ var s=document.getElementById('sobre'); if(s) s.scrollIntoView(); } else window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', rota);
  rota();
})();
</script>
