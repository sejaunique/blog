<!doctype html>

<style>
/* ===== App Vagas por Propósito ===== */
body.vg-app{background:var(--soft);min-height:100vh;display:block}
.vg-app .foot{display:none}
.barra{position:sticky;top:0;z-index:40;background:#0b0b0c;color:#f5f5f5;padding-top:env(safe-area-inset-top,0px)}
.barra .in{max-width:1180px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:18px}
.barra .marca{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;min-width:0}
.barra .marca svg{height:15px;width:auto;flex-shrink:0}
.barra .marca span{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#a1a1a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.barra nav a,.barra nav button{font:inherit;font-size:.8rem;font-weight:600;color:#d4d4d8;text-decoration:none;background:none;border:0;padding:9px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.barra nav a:hover,.barra nav button:hover{background:#1c1c20;color:#fff}
.barra nav a[aria-current="page"]{color:#fff;background:#1c1c20}
.barra .emp{font-size:.8rem;color:#a1a1a8;padding-left:12px;border-left:1px solid #26262a;margin-left:6px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .tema-bt{width:34px;height:34px;margin-left:6px;border-color:#3f3f46;color:#d4d4d8}
.wrap-app{max-width:1180px;margin:0 auto;padding:34px 20px 120px;box-sizing:border-box}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.cab h1{font-size:clamp(1.8rem,4vw,2.7rem);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:0;text-wrap:balance}
.cab .sobre{color:var(--muted);margin:10px 0 0;max-width:64ch;font-size:.98rem;line-height:1.55}
.cab .sobre b{color:var(--fg)}
.olho{font-size:.68rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acoes .btn{background:var(--card);padding:11px 16px;font-size:.8rem}
.acoes .btn.solid{background:var(--fg);color:var(--bg)}
.acoes .btn.verde{background:#00e676;color:#000;border-color:#00e676}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.vg-card{background:var(--card)}
/* lista de vagas */
.vagas{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.vaga{padding:22px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s}
.vaga:hover{border-color:color-mix(in srgb,var(--fg) 30%,var(--line))}
.vaga h3{margin:8px 0 0;font-size:1.15rem;line-height:1.3;letter-spacing:-.01em}
.vaga .meta{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vaga .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px;padding:14px 0;border-block:1px solid var(--line)}
.vaga .nums span{font-size:.74rem;color:var(--muted)}
.vaga .nums b{display:block;font-size:1.5rem;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em}
.vaga .vg-row{margin-top:auto}
.vaga .vg-row{flex-wrap:nowrap}
.vaga .vg-row .btn{flex:1;white-space:nowrap;padding-inline:10px}
.nova-card{display:grid;place-items:center;text-align:center;min-height:250px;border:2px dashed var(--line);border-radius:20px;color:var(--muted);text-decoration:none;font-weight:600;gap:6px;padding:20px;transition:.2s}
.nova-card:hover{border-color:var(--fg);color:var(--fg)}
.nova-card i{font-style:normal;font-size:2rem;width:56px;height:56px;border-radius:50%;background:#00e676;color:#000;display:grid;place-items:center;margin:0 auto 6px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 18px}
.kpi{font:inherit;text-align:left;color:inherit;cursor:pointer;padding:18px 20px;border-radius:18px;border:1px solid var(--line);background:var(--card);transition:transform .15s,border-color .2s}
.kpi:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--fg) 30%,var(--line))}
.kpi b{display:block;font-size:2.2rem;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{display:block;margin-top:8px;font-size:.82rem;color:var(--muted)}
.kpi.forte{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kpi.forte span{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.kpi[aria-pressed="true"]{box-shadow:0 0 0 3px #00e676}
.status-linha{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 16px;font-size:.9rem;color:var(--muted)}
.status-linha b{color:var(--fg);letter-spacing:.06em}
.ferr{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.ferr .busca{font:inherit;font-size:.86rem;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 18px;min-width:240px}
.opcoes{display:flex;gap:8px;flex-wrap:wrap}
.opcoes button{font:inherit;font-size:.82rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:9px 16px;background:var(--card);color:var(--fg);cursor:pointer}
.opcoes button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.opcoes button small{opacity:.55;margin-left:4px;font-variant-numeric:tabular-nums}
/* candidatos */
.cands{display:grid;gap:12px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;padding:22px}
.cand .quem{display:flex;gap:14px;align-items:flex-start}
.ava{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;background:var(--soft);border:1px solid var(--line);flex-shrink:0}
.ava.ok{background:#00e676;border-color:#00e676;color:#000}
.cand h3{margin:0;font-size:1.12rem;letter-spacing:-.01em}
.cand .contato{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:2px}
.cand .contato a{color:var(--fg);font-weight:600}
.cand .selos{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.cand .resp{white-space:pre-wrap;font-size:.94rem;line-height:1.65;margin:14px 0 0;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.cand .resp.aberta{display:block;-webkit-line-clamp:unset}
.cand .mais{font:inherit;font-size:.8rem;font-weight:700;background:none;border:0;padding:6px 0 0;cursor:pointer;color:var(--fg);text-decoration:underline}
.cand video,.cand iframe{width:100%;border-radius:14px;background:#000;aspect-ratio:16/9;border:0}
.cand .lado{display:grid;gap:10px;align-content:start}
.cand .sem-video{display:grid;place-items:center;aspect-ratio:16/9;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:.82rem}
.cand label.mini{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.estrelas{display:flex;gap:2px}
.estrelas button{font-size:1.35rem;background:none;border:0;cursor:pointer;color:var(--line);padding:2px;line-height:1}
.estrelas button.on{color:#ffb020}
.cand select,.cand textarea{font:inherit;font-size:.88rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box}
.cand textarea{min-height:70px;resize:vertical}
.vazio-c{text-align:center;padding:54px 20px}
.vazio-c h2{margin:0 0 8px;font-size:1.4rem;letter-spacing:-.02em}
.vazio-c p{color:var(--muted);margin:0 auto 18px;max-width:46ch}
/* criador */
.estrategia{display:flex;align-items:center;gap:16px;background:#0b0b0c;color:#f5f5f5;border-radius:20px;padding:18px 20px;margin-bottom:18px}
.estrategia .play{width:48px;height:48px;border-radius:14px;background:#ff2e88;display:grid;place-items:center;flex-shrink:0;color:#fff;font-size:1.05rem}
.estrategia b{display:block;font-size:.98rem}
.estrategia small{color:#a1a1a8;font-size:.82rem;line-height:1.45;display:block;margin-top:2px}
.estrategia a{margin-left:auto;background:#fff;color:#000;border-radius:12px;padding:11px 16px;font-size:.8rem;font-weight:700;text-decoration:none;white-space:nowrap}
.progresso{height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:12px}
.progresso i{display:block;height:100%;background:#00e676;border-radius:999px;transition:width .35s}
.etapas{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.etapas::-webkit-scrollbar{display:none}
.etapas button{font:inherit;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.etapas button.feito{color:var(--fg);background:color-mix(in srgb,#00e676 12%,var(--card));border-color:color-mix(in srgb,#00e676 45%,var(--line))}
.etapas button[aria-current="step"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.passo{padding:28px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.ph .num{width:32px;height:32px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex-shrink:0}
.ph h2{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;margin:0}
.ph a{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--muted)}
.passo .ajuda{color:var(--muted);margin:0 0 22px;font-size:.94rem;max-width:66ch;line-height:1.6}
.passo .ajuda b{color:var(--fg)}
.analogias{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:20px}
.analogia{border:2px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;background:var(--bg);text-align:left;font:inherit;color:inherit;transition:border-color .15s}
.analogia .e{font-size:1.7rem}
.analogia b{display:block;font-size:1.02rem;margin-top:6px}
.analogia small{color:var(--muted);font-size:.82rem;line-height:1.45;display:block;margin-top:2px}
.analogia[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 12%,transparent)}
.rodape-ed{position:sticky;bottom:0;z-index:20;margin-top:16px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--soft) 30%);display:flex;align-items:center;justify-content:space-between;gap:10px}
.rodape-ed .conta{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rodape-ed .btn{min-height:48px;padding-inline:22px}
.rodape-ed .vazio{width:110px}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.sug button{font:inherit;font-size:.76rem;border:1px dashed var(--line);border-radius:999px;padding:6px 12px;background:none;color:var(--muted);cursor:pointer}
.sug button:hover{color:var(--fg);border-color:var(--fg)}
.logo-up{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo-prev{width:140px;height:84px;border:1px dashed var(--line);border-radius:14px;display:grid;place-items:center;background:repeating-conic-gradient(var(--soft) 0 25%,var(--bg) 0 50%) 0 0/16px 16px;overflow:hidden;flex-shrink:0}
.logo-prev img{max-width:90%;max-height:70px;object-fit:contain}
.logo-prev span{font-size:.75rem;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:999px}
.logo-ac{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1;min-width:200px}
.logo-ac small{flex-basis:100%;font-size:.75rem}
.logo-ac label.btn{cursor:pointer}
.dica-fmt{font-size:.82rem;color:var(--muted);background:var(--soft);border-left:3px solid var(--fg);border-radius:4px 12px 12px 4px;padding:10px 14px;margin:0 0 18px}
.dica-fmt code{font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.estado{max-width:560px;margin:60px auto;text-align:center}
.estado h1{font-size:2rem;letter-spacing:-.03em}
@media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}.cand{grid-template-columns:1fr}.barra .emp,.barra .marca span{display:none}}
@media (max-width:640px){
  .wrap-app{padding-top:22px}
  .barra nav a.opc{display:none}
  .estrategia{flex-wrap:wrap}.estrategia a{margin-left:0;width:100%;text-align:center}
  .passo{padding:20px}
  .rodape-ed .conta{display:none}.rodape-ed .btn{flex:1}.rodape-ed .vazio{display:none}
  .ferr .busca{width:100%;min-width:0}
  .analogia{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center;padding:14px 16px}.analogia .e{grid-row:span 2}.analogia b{margin:0}
  .ph a{margin-left:0;flex-basis:100%}
  .barra nav a,.barra nav button{padding:8px 9px}
  .acoes .btn{flex:1 1 calc(50% - 8px)}
}
</style>
</head>

<script>
(function(){
var sb=VG.sb, esc=VG.esc, A=VG.ANALOGIAS, app=document.getElementById('app');
var U=null, EMP=null, ADMIN=false, VAGAS=[], CONT={};

function h(s){ app.innerHTML=s; window.scrollTo(0,0); }
function navega(){
  var r=location.hash.replace(/^#\/?/,'').split('/')[0]||'';
  var n=document.getElementById('nav');
  n.innerHTML='<a href="#/"'+(r===''||r==='candidatos'?' aria-current="page"':'')+'>Minhas vagas</a>'+
    '<a class="opc" href="#/empresa"'+(r==='empresa'?' aria-current="page"':'')+'>Empresa</a>'+
    '<a class="opc" href="/vagas/metodo/" target="_blank" rel="noopener">Método</a>'+
    (ADMIN?'<a class="opc" href="/vagas/admin/">Admin</a>':'')+
    '<button type="button" id="bsair">Sair</button>'+(EMP?'<span class="emp">'+esc(EMP.nome)+'</span>':'');
  document.getElementById('bsair').onclick=sair;
}
function sair(){ sb.auth.signOut().then(function(){ location.replace('/vagas/'); }); }

/* ---------- início ---------- */
sb.auth.getSession().then(async function(r){
  if(/nova-senha/.test(location.search)) return telaNovaSenha();
  if(!r.data.session) return location.replace('/vagas/');
  U=r.data.session.user;
  var a=await sb.rpc('vg_is_admin'); ADMIN=!!a.data;
  var e=await sb.from('vg_empresas').select('*').eq('owner',U.id).maybeSingle();
  EMP=e.data;
  if(!EMP){
    var md=U.user_metadata||{};
    try{ var lc=JSON.parse(localStorage.getItem('vg_cadastro')||'null'); if(lc&&lc.empresa&&!md.empresa) md=lc; }catch(x){}
    var ins=await sb.from('vg_empresas').insert({owner:U.id,nome:md.empresa||'Minha empresa',responsavel:md.nome||'',whatsapp:md.whatsapp||'',cidade:md.cidade||''}).select().single();
    EMP=ins.data;
  }
  if(!EMP) return h('<div class="estado"><h1>Não foi possível abrir sua conta</h1><p class="muted">Tente sair e entrar de novo.</p><button class="btn" id="bs">Sair</button></div>'), document.getElementById('bs').onclick=sair;
  if(EMP.status!=='aprovada') return telaPendente();
  window.addEventListener('hashchange',rota); rota();
});

function telaNovaSenha(){
  h('<div class="estado vg-card" style="text-align:left"><h2>Crie uma nova senha</h2><div class="campo"><label>Nova senha</label><input id="ns" type="password" minlength="8" autocomplete="new-password"></div><button class="btn solid" id="bns">Salvar</button></div>');
  document.getElementById('bns').onclick=function(){
    var s=document.getElementById('ns').value; if(s.length<8) return VG.toast('Mínimo de 8 caracteres','erro');
    sb.auth.updateUser({password:s}).then(function(r){ if(r.error) return VG.toast(VG.erroPt(r.error),'erro'); location.replace('/vagas/painel/'); });
  };
}
function telaPendente(){
  navega();
  var bloq=EMP.status==='bloqueada';
  var wa='https://wa.me/5562996007574?text='+encodeURIComponent('Olá, Carlos! Criei a conta da '+EMP.nome+' no Vagas por Propósito e quero liberar o acesso.');
  h('<div class="estado"><span class="vg-pill '+(bloq?'mag':'warn')+'">'+(bloq?'Acesso suspenso':'Aguardando liberação')+'</span>'+
    '<h1>'+(bloq?'O acesso da '+esc(EMP.nome)+' está suspenso.':'Recebemos o cadastro da '+esc(EMP.nome)+'.')+'</h1>'+
    '<p class="muted">'+(bloq?'Fale com a Unique para entender o que aconteceu.':'A Unique confere e libera o seu acesso. Enquanto isso, assista aos vídeos do método: eles explicam cada filtro que você vai usar.')+'</p>'+
    '<div class="vg-row" style="justify-content:center;margin-top:20px"><a class="btn verde" href="'+wa+'" target="_blank" rel="noopener">Avisar no WhatsApp</a><a class="btn" href="/vagas/metodo/">Ver o método</a><button class="btn" id="bs">Sair</button></div></div>');
  document.getElementById('bs').onclick=sair;

    '<small class="muted">PNG, JPG, WEBP ou SVG · até 5 MB. Fundo transparente fica melhor.</small></div></div></div>';

function reduz(arq){
  return new Promise(function(ok){
    if(/svg|gif/.test(arq.type)) return ok(arq);
    var img=new Image(), u=URL.createObjectURL(arq);
    img.onload=function(){
      var m=800, w=img.width, hh=img.height; if(w<=m&&hh<=m){ URL.revokeObjectURL(u); return ok(arq); }
      var k=Math.min(m/w,m/hh), c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(hh*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
      var tipo=arq.type==='image/png'?'image/png':'image/webp';
      c.toBlob(function(b){ ok(b?new File([b],'logo.'+(tipo==='image/png'?'png':'webp'),{type:tipo}):arq); },tipo,.9);
    };
    img.onerror=function(){ ok(arq); }; img.src=u;
  });
}
function ligaLogo(id){
  var inp=document.getElementById(id), arq=document.getElementById(id+'-arq'), prev=document.getElementById(id+'-prev'), rm=document.getElementById(id+'-rm'), lb=document.querySelector('label[for="'+id+'-arq"]');
  function mostra(u){ inp.value=u||''; prev.innerHTML=u?'<img src="'+esc(u)+'" alt="">':'<span>Sem logo</span>'; rm.hidden=!u; lb.textContent=u?'Trocar imagem':'Anexar imagem'; }
  rm.onclick=function(){ mostra(''); };
  arq.onchange=async function(){
    var f=arq.files[0]; arq.value=''; if(!f) return;
    if(!/^image\//.test(f.type)) return VG.toast('Escolha um arquivo de imagem','erro');
    if(f.size>5*1024*1024) return VG.toast('A imagem passou de 5 MB','erro');
    lb.textContent='Enviando…'; prev.innerHTML='<span>Enviando…</span>';
    try{
      f=await reduz(f);
      var ext=(f.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,4)||'png';
      var cam=EMP.id+'/'+Date.now().toString(36)+'.'+ext;
      var up=await sb.storage.from('vagas-logos').upload(cam,f,{contentType:f.type,upsert:false,cacheControl:'31536000'});
      if(up.error) throw up.error;
      var url=sb.storage.from('vagas-logos').getPublicUrl(cam).data.publicUrl;
      mostra(url);
      if(!EMP.logo_url){ var r=await sb.from('vg_empresas').update({logo_url:url}).eq('id',EMP.id).select().single(); if(r.data) EMP=r.data; }
      VG.toast('Logo anexado');
    }catch(e){ mostra(inp.value); VG.toast(VG.erroPt(e),'erro'); }
  };
}

  function igual(a,b){ return JSON.stringify(a||'')===JSON.stringify(b||''); }

async function salvar(fim){
  if(!V.slug) V.slug=VG.slugify((V.empresa_nome||'')+'-'+(V.cargo_real||V.titulo||'vaga'))||('vaga-'+Date.now().toString(36));
  V.palavra_dica=(V.palavra_onde==='perfil'&&PAL)?'Se você leu até aqui, escreva a palavra '+PAL+' em algum lugar da sua resposta.':'';
  var d={}; ['empresa_id','slug','status','empresa_nome','empresa_sobre','empresa_logo','cidade','cargo_real','analogia','titulo','subtitulo','encerramento','promessa','tarefas','perfil','perfil_lista','local','horario','modelo','beneficios','remun_tipo','remun_texto','escadinha','remun_final','video_url','desafio_video','palavra_onde','palavra_dica','min_caracteres'].forEach(function(k){ d[k]=V[k]; });
  if(!d.titulo) d.titulo=V.analogia?A[V.analogia].pergunta:(V.cargo_real||'Nova vaga');
  if(!V.id){
    var livre=await sb.rpc('vg_slug_livre',{s:d.slug});
    if(livre.data===false){ d.slug=d.slug+'-'+Math.random().toString(36).slice(2,6); }
  }
  var r=V.id?await sb.from('vg_vagas').update(d).eq('id',V.id).select().single():await sb.from('vg_vagas').insert(d).select().single();
  if(r.error) return VG.toast(VG.erroPt(r.error),'erro');
  V=r.data;
  var s=await sb.from('vg_segredos').upsert({vaga_id:V.id,palavra:V.palavra_onde==='nenhuma'?null:(PAL||null)});
  if(s.error) VG.toast('A vaga foi salva, mas a palavra secreta não: '+VG.erroPt(s.error),'erro');
  if(fim){
    VG.toast(V.status==='publicada'?'Vaga no ar!':'Vaga salva');
    var url=location.origin+'/vagas/v/'+V.slug;
    h('<div class="estado card" style="padding:40px 24px"><span class="vg-pill '+(V.status==='publicada'?'ok':'')+'">'+(V.status==='publicada'?'● No ar':'Salva')+'</span><h1>'+esc(limpa(V.titulo))+'</h1>'+
      '<p class="muted">Divulgue este link no Instagram, nos grupos e no WhatsApp:</p><p><a href="'+url+'" target="_blank" style="font-weight:700;word-break:break-all">'+url+'</a></p>'+
      '<div class="vg-row" style="justify-content:center;margin-top:18px"><button class="btn solid" id="bcp">Copiar link</button>'+
      '<a class="btn verde" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(V.titulo+' · '+url)+'">Enviar no WhatsApp</a><a class="btn" href="#/candidatos/'+V.id+'">Ir para o painel</a></div></div>');
    document.getElementById('bcp').onclick=function(){ copiar(url); };
    history.replaceState(null,'','#/editar/'+V.id);
  } else {
    VG.toast('Rascunho salvo');
    if(location.hash!=='#/editar/'+V.id) history.replaceState(null,'','#/editar/'+V.id);
    desenha();
  }
}

async function candidatos(id){

  var NOMES={todos:'Todos',atentos:'✓ Atentos',video:'Com vídeo',novo:'Novos',triagem:'Triagem',entrevista:'Entrevista',aprovado:'Aprovados',recusado:'Reprovados'};

    var m=e.target.closest('.mais'); if(m){ var rp=m.previousElementSibling; rp.classList.toggle('aberta'); m.textContent=rp.classList.contains('aberta')?'Mostrar menos':'Ler resposta completa'; return; }
    var b=e.target.closest('[data-nota]'); if(b){ var a=b.closest('.cand'), nt=+b.dataset.nota;
      a.querySelectorAll('[data-nota]').forEach(function(x){ x.classList.toggle('on',+x.dataset.nota<=nt); }); atualiza(a.dataset.id,{nota:nt}); }
  });
  document.getElementById('busca').oninput=function(){ BUSCA=this.value; render(); };
  async function atualiza(cid,d){ var r=await sb.from('vg_candidatos').update(d).eq('id',cid); if(r.error) VG.toast(VG.erroPt(r.error),'erro'); else { var c=C.find(function(x){return x.id===cid;}); Object.assign(c,d); VG.toast('Salvo'); if(d.status) render(); } }
  document.getElementById('lista-c').addEventListener('change',function(e){ var a=e.target.closest('.cand'); if(!a) return; var k=e.target.dataset.k; if(k){ var o={}; o[k]=e.target.value; atualiza(a.dataset.id,o); } });
  var be=document.getElementById('benc');
  if(be) be.onclick=async function(){
    var novo=aberta?'encerrada':'publicada';
    if(aberta&&!confirm('Encerrar a vaga? A página para de receber candidaturas. Você pode reabrir depois.')) return;
    var r=await sb.from('vg_vagas').update({status:novo}).eq('id',id); if(r.error) return VG.toast(VG.erroPt(r.error),'erro');
    VG.toast(novo==='encerrada'?'Vaga encerrada':'Vaga reaberta'); candidatos(id);
  };
  document.getElementById('bcsv').onclick=function(){
    var cols=['nome','whatsapp','email','cidade','atento','status','nota','resposta','video_link','obs','created_at'];
    var q=function(s){ return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'; };
    var csv='﻿'+cols.join(';')+'\n'+C.map(function(c){ return cols.map(function(k){ return q(k==='atento'?(c.atento?'sim':'não'):k==='status'?ROT[c.status]:c[k]); }).join(';'); }).join('\n');
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='candidatos-'+v.data.slug+'.csv'; a.click();
  };
}
})();
</script>
</body>
